# CodeRabbit is not used in this repository (see CLAUDE.md, Code Review Tooling:
# repository-local review, tests, type checks, security scans, parity gates, and
# browser evidence instead). This config silences the app while it remains
# installed at the account level; the durable removal is uninstalling the
# GitHub App at https://github.com/settings/installations.
reviews:
  auto_review:
    enabled: false
  request_changes_workflow: false
  high_level_summary: false
  poem: false
  review_status: false
chat:
  auto_reply: false
