# Meerkat relay - one-click Render blueprint.
#
# Render reads a blueprint named `render.yaml` from the REPOSITORY ROOT, which is
# why this file lives here (the annotated reference copy is
# packages/meerkat-relay/deploy/render.yaml - keep the service shape in sync).
# This is what the "Deploy to Render" button in docs/guides/deploy-a-meerkat-relay.md
# and packages/meerkat-relay/README.md targets.
#
# The relay is STATELESS and ZERO-KNOWLEDGE: it reads only PORT (Render injects it)
# and HOST, takes no API keys, no DB, no volume, and persists nothing beyond
# short-TTL in-memory mailboxes. Render terminates TLS at its edge and proxies the
# WebSocket upgrade, so the service gets a public wss:// URL automatically - which
# is exactly what the browser client needs (it cannot use plain ws:// from https).

services:
  - type: web
    name: meerkat-relay
    runtime: docker
    dockerfilePath: ./packages/meerkat-relay/Dockerfile
    dockerContext: ./packages/meerkat-relay
    # A small paid always-on instance (about $7/mo). Render's free tier sleeps
    # after inactivity, which would stall the first sync until the relay wakes; a
    # relay should stay warm. Change this if you prefer that trade-off.
    plan: starter
    envVars:
      - key: HOST
        value: 0.0.0.0
      # Store-and-forward window for a message parked while the recipient is
      # offline. The relay default is 5 MINUTES, which silently drops overnight
      # hand-offs; 86400000 ms (24h) is the clamp maximum in protocol.ts. Set
      # here so a blueprint deploy is correct by default instead of depending on
      # the operator remembering a dashboard edit. Mailboxes stay IN-MEMORY, so
      # a restart still clears them (by design: the relay persists nothing).
      - key: RELAY_MAILBOX_TTL_MS
        value: "86400000"
    healthCheckPath: /healthz
    autoDeploy: false
