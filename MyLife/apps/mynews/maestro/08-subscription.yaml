appId: com.mylife.mynews
name: MyNews subscription gate
tags:
  - mynews
  - subscription
---
# Subscription: the PremiumGate that wraps the whole (root) stack.
#
# A PURCHASE CANNOT BE AUTOMATED HERE, and no wording in this flow should be
# read as claiming otherwise. Tapping "Unlock for $X" hands off to StoreKit or
# Play Billing through RevenueCat; the confirmation sheet is a system UI outside
# the app's view hierarchy, and driving it needs a sandbox Apple ID or a Play
# licence-tester account signed in on the device. That is founder-ops.
#
# What this flow proves is the part that is testable and has real product value:
# the gate's three states are distinct, an UNCONFIGURED build shows no purchase
# controls at all (it must never render a paywall it cannot honour), and the
# four entitlement-exempt obligations stay reachable while gated.

- launchApp

# State 1: no store connection. The build must say so and offer nothing.
- runFlow:
    when:
      visible: "MyNews access unavailable"
    commands:
      - assertVisible: "Subscriptions are not available in this build."
      - assertVisible: "This build has no store connection, so it cannot open a paywall, make a purchase, or simulate access."
      - assertNotVisible: "Restore purchase"

# State 2: configured, not entitled. Purchase and restore controls render.
- runFlow:
    when:
      visible: "Unlock MyNews"
    commands:
      - assertVisible: "Read, publish under a signed byline, follow journalists, and work in the editing desk."
      - assertVisible: "Unlock for \\$\\d+\\.\\d\\d"
      - assertVisible: "Restore purchase"
      - assertVisible: "Purchases and restores are verified by the App Store or Play Store through RevenueCat."
      # STOP. See the header note: the store sheet is outside this app.

# State 3: entitled. The reader surface renders.
- runFlow:
    when:
      visible: "Today"
    commands:
      - assertVisible: "Today"
      - assertVisible: "Me"

# The entitlement-exempt obligations
# (apps/mynews/app/(root)/lib/entitlement-routes.ts: legal, notices,
# account-delete, account-export) must stay reachable even while the gate is up.
# This is asserted for `legal` because it is the one an app store reviewer will
# look for, and it is reachable from Me in every state that renders the tabs.
- runFlow:
    when:
      visible: "Me"
    commands:
      - tapOn: "Me"
      - scrollUntilVisible:
          element:
            text: "Legal"
          direction: DOWN
      - tapOn: "Legal"
      - back
