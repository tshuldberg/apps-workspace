appId: com.mylife.mynews
name: MyNews block and mute
tags:
  - mynews
  - safety
env:
  MAESTRO_MYNEWS_ALLOW_WRITES: "0"
---
# Block / mute: the T7 rail. The control lives on a journalist profile
# (BlockCard) and the resulting list lives at Me -> "Blocked accounts".
#
# Like reporting, blocking needs an account: the block is a row keyed to the
# blocking profile. The card's signed-out state offers "Sign in" and no block
# button, and this flow asserts that state honestly rather than skipping it.
#
# NOT COVERED by default: actually blocking. It writes a row and removes the
# target's content from the reader's feeds, so it is gated on
# MAESTRO_MYNEWS_ALLOW_WRITES. The unblock path is asserted from the Blocked
# accounts screen when a seeded account already has one.

- launchApp
- assertVisible: "Today"

# Path 1: the blocked-accounts list, reachable from Me on a signed-in build.
- tapOn: "Me"
- runFlow:
    when:
      visible: "Blocked accounts"
    commands:
      - tapOn: "Blocked accounts"
      - assertVisible: "Blocked accounts"
      - runFlow:
          when:
            visible: "Unblock"
          commands:
            - assertVisible: "Unblock"
      - back

# Path 2: the block control on a journalist profile.
- tapOn: "Today"
- runFlow:
    when:
      notVisible: "Try again"
    commands:
      - tapOn:
          point: "50%,45%"
      # The byline on the article screen routes to the journalist.
      - runFlow:
          when:
            visible: "Suggest edit"
          commands:
            - tapOn:
                point: "50%,25%"

      - runFlow:
          when:
            visible: "Report this profile"
          commands:
            - assertVisible: "Report this profile"

            - runFlow:
                when:
                  visible: "Not seeing eye to eye?"
                commands:
                  # Signed-out state: the card explains and offers sign-in. No
                  # block button, because a block with no account to key it to
                  # would be a lie.
                  - assertVisible: "Sign in"

            - runFlow:
                when:
                  visible: "Block or mute"
                commands:
                  - assertVisible: "Block or mute"
                  - assertVisible: "Mute"
                  - assertVisible: "Block"
                  - runFlow:
                      when:
                        true: ${MAESTRO_MYNEWS_ALLOW_WRITES == "1"}
                      commands:
                        # Mute, not Block: it is the reversible, lower-impact of
                        # the two, and the flow immediately reverses it.
                        - tapOn: "Mute"
                        - assertVisible: "Unblock"
                        - tapOn: "Unblock"
