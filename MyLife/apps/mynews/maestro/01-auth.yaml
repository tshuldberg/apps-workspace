appId: com.mylife.mynews
name: MyNews auth
tags:
  - mynews
  - auth
env:
  MYNEWS_FLOW_EMAIL: "flow-runner@example.test"
  MYNEWS_FLOW_HANDLE: "flow_runner"
  MYNEWS_FLOW_DISPLAY_NAME: "Flow Runner"
---
# Auth: reach the account controls, prove the email sign-in form is real, and
# reach profile registration.
#
# Selector note for every flow in this directory: apps/mynews ships ZERO
# testIDs. It does ship an accessibility contract that
# apps/mynews/app/__tests__/accessibility.test.ts enforces from source (every
# TextInput has an accessibilityLabel, every Pressable has a role and an
# accessible name). Maestro matches accessibility labels, so those labels are
# the stable anchors here. Everything else is visible text quoted from source.
#
# NOT COVERED, and why:
#   - Completing sign-in. The app uses Supabase email OTP / magic link, so
#     finishing needs a real message delivered to a real inbox. This flow stops
#     BEFORE pressing "Send sign-in email": pressing it would send mail on every
#     run and still leave the flow unable to read the inbox. Mailbox-backed
#     sign-in is founder-ops (see README.md).
#   - Creating the journalist profile. "Create profile" writes to the backend,
#     so it needs a configured Supabase project and a handle that is still free.
#     The flow asserts the form instead of submitting it.

- launchApp
- assertVisible: "Today"

- tapOn: "Me"
- assertVisible: "Your identity"
- assertVisible: "Account"

# The account card renders one of three states. Only the signed-out state has
# the sign-in controls, and that is the state this flow drives.
- runFlow:
    when:
      visible: "Reading? No account needed."
    commands:
      - tapOn: "Sign in with email"
      # The form's own copy names the active mode. Asserting it is what proves
      # the tap changed state rather than the card already being open.
      - assertVisible: "We will email you a sign-in link for your existing account."
      - tapOn: "Email address"
      - inputText: ${MYNEWS_FLOW_EMAIL}
      - hideKeyboard
      - assertVisible: "Send sign-in email"
      # STOP. See the header note: pressing this sends real email.
      - assertVisible: "Create account"

# Profile registration is a separate identity from the auth session: the session
# is the account, the profile is the public byline.
- assertVisible: "Public profile"
- runFlow:
    when:
      visible: "Register to publish or suggest"
    commands:
      - tapOn: "Register to publish or suggest"
      - assertVisible: "Create your profile"
      - assertVisible: "Handle"
      - assertVisible: "Display name"
      - tapOn: "Handle"
      - inputText: ${MYNEWS_FLOW_HANDLE}
      - hideKeyboard
      - tapOn: "Display name"
      - inputText: ${MYNEWS_FLOW_DISPLAY_NAME}
      - hideKeyboard
      - assertVisible: "Create profile"
      # STOP. "Create profile" writes a real row against the configured backend.
      - back
