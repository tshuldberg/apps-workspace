appId: com.mylife.mynews
name: MyNews review the editing desk
tags:
  - mynews
  - editing
env:
  MAESTRO_MYNEWS_ALLOW_WRITES: "0"
---
# Review: the author side of the editing desk.
#
# The product invariant is that only the article's AUTHOR merges, and nothing
# merges without an author signature. So this flow needs a seeded account that
#   - owns a published article, and
#   - has at least one OPEN suggestion on it from a DIFFERENT editor.
#
# That is two accounts' worth of state, which is why this flow is seeded-account
# only (README.md). Without it the Desk renders "No suggestions yet" and the
# flow asserts that instead of inventing a suggestion to accept.
#
# NOT COVERED: accepting or rejecting by default. Both write a signed decision
# and move credibility, so they are gated on MAESTRO_MYNEWS_ALLOW_WRITES.
# Accepting also runs the pre-publication screening gate, which can HOLD the
# result: a hold is a correct outcome, not a failure, so the write branch below
# accepts either "Suggestion" returning or the held state, and asserts neither
# as "published".

- launchApp
- assertVisible: "Today"

- tapOn: "Desk"
- assertVisible: "Desk"

- runFlow:
    when:
      visible: "Register to publish or suggest"
    commands:
      # No profile: there is nothing to review. Honest stop.
      - assertVisible: "Register to publish or suggest"

- runFlow:
    when:
      visible: "No suggestions yet"
    commands:
      # Configured and registered, but nothing queued. Honest stop.
      - assertVisible: "No suggestions yet"

- runFlow:
    when:
      visible: "Review queue"
    commands:
      - assertVisible: "Review queue"
      - scrollUntilVisible:
          element:
            text: "Review queue"
          direction: DOWN

      # Single-suggestion path: the detail screen. Its accept label carries the
      # revision number it would publish, which is the honest thing to assert:
      # an author is agreeing to publish a specific revision.
      - runFlow:
          when:
            visible: "Suggestion"
          commands:
            - assertVisible: "Suggestion"
            - assertVisible: "Accept · publish rev \\d+"
            - assertVisible: "Reject"
            - runFlow:
                when:
                  true: ${MAESTRO_MYNEWS_ALLOW_WRITES == "1"}
                commands:
                  - tapOn: "Accept · publish rev \\d+"

      # Batch path: several copyedits merged into one signed revision.
      - runFlow:
          when:
            visible: "Batch copyedits"
          commands:
            - assertVisible: "Batch copyedits"
            - assertVisible: "Combined preview"
            - assertVisible: "Accept \\d+ · publish rev \\d+"
            - runFlow:
                when:
                  true: ${MAESTRO_MYNEWS_ALLOW_WRITES == "1"}
                commands:
                  - tapOn: "Accept \\d+ · publish rev \\d+"
