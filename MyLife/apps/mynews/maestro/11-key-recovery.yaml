appId: com.mylife.mynews
name: MyNews key recovery
tags:
  - mynews
  - keys
env:
  # Creating a kit mints a new recovery code and, if escrowed, writes ciphertext
  # to the server and an owner-visible access-log row. Own gate, default off.
  MAESTRO_MYNEWS_ALLOW_KEY_WRITES: "0"
---
# Key recovery: Me -> "Keys and Recovery".
#
# The interesting problem here is that the recovery code EXISTS ONLY AT RUNTIME.
# It is 160 bits minted on device, shown exactly once, and never stored by the
# app, so no fixture can know it ahead of time. This flow therefore reads it off
# the screen with copyTextFrom and types it back, which is the same thing the
# user does and is the only honest way to automate the confirm step.
#
# The code is Crockford base32 (0123456789ABCDEFGHJKMNPQRSTVWXYZ), eight groups
# of four separated by hyphens (RECOVERY_CODE_GROUP_SIZE /
# RECOVERY_CODE_GROUP_COUNT in modules/mynews/src/signing/recovery-kit.ts), so
# the regex below matches the displayed code and nothing else on the screen.
#
# NOT COVERED, and why:
#   - Restoring on a SECOND device. That needs two devices or a reinstall plus
#     the kit file moved between them, which is a device-farm shape, not a
#     single-simulator flow. Founder-ops (README.md).
#   - Exporting the kit file. "Export kit file" opens the OS share sheet.
#   - Recovery WITHOUT a kit. It is HARD-DISABLED in the product until a
#     notification provider ships, because the cancel-token notice is the only
#     thing that lets a real owner stop a stolen-session takeover. The flow
#     asserts it renders as unavailable WITH a reason, and must never be
#     "fixed" to make it succeed.

- launchApp
- tapOn: "Me"

- scrollUntilVisible:
    element:
      text: "Keys and Recovery"
    direction: DOWN
- tapOn: "Keys and Recovery"
- assertVisible: "Keys and Recovery"

- assertVisible: "Keys on this account"
- assertVisible: "Recovery kit"

# The honest state when this device holds no signing key.
- runFlow:
    when:
      visible: "This device has no signing key loaded yet, so there is nothing to put in a kit."
    commands:
      - assertVisible: "No signing keys yet."

# The no-kit recovery path must present as unavailable, with the reason.
- scrollUntilVisible:
    element:
      text: "Lost the kit and every device?"
    direction: DOWN
- assertVisible: "Lost the kit and every device?"

- runFlow:
    when:
      true: ${MAESTRO_MYNEWS_ALLOW_KEY_WRITES == "1"}
    commands:
      - scrollUntilVisible:
          element:
            text: "Recovery kit"
          direction: UP
      - tapOn: "Create a( new)? recovery kit"

      - assertVisible: "This is your recovery code. It is shown once and is never stored by the app. Write it down or put it in a password manager now."
      # Read the once-shown code off the screen. This is the whole reason this
      # flow exists: the value cannot come from a fixture.
      - copyTextFrom:
          text: "[0-9A-HJKMNP-TV-Z]{4}(-[0-9A-HJKMNP-TV-Z]{4}){7}"
      - tapOn: "I have saved it"

      - assertVisible: "Type the code back to confirm you really have it. This is the last point at which you can see it again."
      - tapOn: "Recovery code, typed back to confirm"
      - inputText: ${maestro.copiedText}
      - hideKeyboard
      - tapOn: "Confirm and create kit"

      - assertVisible: "Your kit is encrypted with that code. Export it somewhere durable. You can also let the server hold the encrypted file, which it cannot open."
      - assertVisible: "Export kit file"
      # STOP before "Export kit file": OS share sheet, see the header note.
      - tapOn: "Done"

# Restore is asserted as reachable. It is not driven here: pasting a kit and its
# code on the SAME device that already holds the key proves nothing, and the
# cross-device case is founder-ops.
- scrollUntilVisible:
    element:
      text: "Restore from a kit"
    direction: DOWN
- assertVisible: "Restore from a kit"
- assertVisible: "Recovery kit file contents"
- assertVisible: "Restore signing on this device"
