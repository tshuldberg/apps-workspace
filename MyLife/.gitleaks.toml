regexTarget = "match"
paths = ['''(^|/)apps/meerkat-web/src/lib/__tests__/delete-account-core\.test\.ts$''']
regexes = ['''^FRIEND_CODE_KEY, 'MEER-A1B2-C3D4-E5F6-G7H8'$''']

