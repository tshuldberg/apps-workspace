title = "MyLife gitleaks config"

# Keep the upstream detectors; this file only adds repository exclusions.
[extend]
useDefault = true

[[allowlists]]
description = "Repository dependency and archive exclusions"
  paths = [
    '''node_modules''',
    '''.claude/skills/gstack''',
    '''archive/''',
  ]


# Exact reviewed fixtures/source expressions, scoped to their detector and file.
# Keep AND exclusions at rule level: directory scans prefilter global paths.

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Reviewed non-secret fixture or source expression (2026-09-04)"
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)packages/sync/src/node/friend-rendezvous\.ts$''']
regexes = ['''^secretHalf, 'meerkat-rendezvous-seal-v1'$''']

[[rules.allowlists]]
description = "Reviewed non-secret fixture or source expression (2026-09-04)"
