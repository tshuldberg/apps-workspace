name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal token scopes. `pull-requests: read` lets dorny/paths-filter list a PR's
# changed files via the API on `pull_request` events (without it the `changes`
# job fails with "Resource not accessible by integration", which also skips the
# gated relay-image job). `contents: read` is all checkout needs.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.filter.outputs.e2e }}
      run_relay: ${{ steps.filter.outputs.relay }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            e2e:
              - 'apps/web/**'
              - 'apps/meerkat/**'
              - 'apps/meerkat-web/**'
              - 'modules/**'
              - 'packages/**'
              - 'scripts/**'
              - '.gitmodules'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            relay:
              - 'packages/meerkat-relay/**'
              - 'pnpm-lock.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

  audit:
    # Supply chain scan via osv-scanner against the pnpm lockfile. Replaces the
    # previous `pnpm audit` step after npm retired its /v1/security/audits
    # endpoint (HTTP 410). osv-scanner reads pnpm-lock.yaml directly and queries
    # the OSV.dev database, which aggregates GHSA, CVE, and vendor advisories.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: google/osv-scanner-action/osv-scanner-action@19ec1116569a47416e11a45848722b1af31a857b # v2.2.3
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --recursive
            --config=.github/osv-scanner.toml

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:parity

  lint:
    runs-on: ubuntu-latest
    needs: [parity]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:generated-artifacts
      - run: pnpm check:web-barrel
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    env:
      VITEST_SEED: ${{ github.run_id }}
      # Perf slope/memory gates are a local quality instrument (pre-commit
      # function gate + local suites). Shared-runner wall clock is scheduler
      # noise at the millisecond medians these gates measure; release-grade
      # performance evidence comes from the Step 15 load/soak budgets.
      MYLIFE_PERF_GATES: "off"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  meerkat-postgres:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run_relay == 'true'
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: meerkat_ci
          POSTGRES_USER: meerkat
          POSTGRES_PASSWORD: meerkat-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meerkat -d meerkat_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MEERKAT_TEST_POSTGRES_URL: postgres://meerkat:meerkat-ci-password@127.0.0.1:5432/meerkat_ci
      MEERKAT_ALLOW_DESTRUCTIVE_POSTGRES_TESTS: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mylife/meerkat-relay test:postgres

  meerkat-s3:
    # Live object-store conformance for the S3 adapter (WP-2B) against a pinned MinIO,
    # mirroring the meerkat-postgres job. MinIO needs `server /data` as its command, which a
    # `services:` container cannot express cleanly, so it is booted as a pinned-DIGEST step and
    # health-gated before the env-gated S3 suite runs. Gated on relay changes so unrelated PRs
    # do not pay the cost.
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run_relay == 'true'
    env:
      MEERKAT_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      MEERKAT_TEST_S3_ACCESS_KEY: meerkat
      MEERKAT_TEST_S3_SECRET_KEY: meerkat-ci-secret
      MEERKAT_TEST_S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Boot pinned MinIO (S3-compatible object store)
        run: |
          docker run -d --name meerkat-minio-ci \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=meerkat \
            -e MINIO_ROOT_PASSWORD=meerkat-ci-secret \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then
              echo "MinIO is live"; break
            fi
            if [ "$attempt" -eq 30 ]; then echo "MinIO did not become healthy" >&2; exit 1; fi
            sleep 2
          done
      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mylife/meerkat-relay test:s3
      - run: pnpm --filter @mylife/meerkat-relay test:s3-hosted
      - run: pnpm --filter @mylife/meerkat-relay test:s3-archive
      - name: Stop MinIO
        if: always()
        run: docker rm -f meerkat-minio-ci 2>/dev/null || true

  coverage:
    runs-on: ubuntu-latest
    env:
      VITEST_SEED: ${{ github.run_id }}
      MYLIFE_PERF_GATES: "off"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage:ci

  e2e:
    runs-on: ubuntu-latest
    needs: [changes, lint, typecheck, test]
    if: needs.changes.outputs.run_e2e == 'true'
    env:
      VITEST_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mylife/web exec playwright install --with-deps chromium
      - run: pnpm --filter @mylife/web test:e2e
      - name: Run Meerkat browser E2E against a real relay
        env:
          MEERKAT_E2E_RELAY_URL: ws://127.0.0.1:8787
          VITE_MEERKAT_DEFAULT_RELAY_URL: ws://127.0.0.1:8787
          VITE_MEERKAT_HOSTED_API_URL: http://127.0.0.1:3127
        run: |
          pnpm --filter @mylife/meerkat-relay start &
          relay_pid=$!
          trap 'kill "$relay_pid" 2>/dev/null || true' EXIT
          pnpm --filter @mylife/meerkat-web exec playwright install chromium
          pnpm --filter @mylife/meerkat-web test:e2e

  relay-image:
    # Smoke-build the slim, zero-knowledge relay Docker image so a broken
    # Dockerfile (an install or compile step that fails) breaks CI here instead of
    # surfacing only when someone tries to deploy. Build only - nothing is pushed.
    # Gated on relay changes so unrelated PRs do not pay the build cost.
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run_relay == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build the slim relay image (no push)
        run: docker build -t meerkat-relay-ci packages/meerkat-relay
      - name: Build the stateful Meerkat platform image (no push)
        run: docker build -f packages/meerkat-relay/Dockerfile.platform -t meerkat-platform-ci .
      - name: Boot the production hosted-service image
        run: |
          docker run --rm -d --name meerkat-platform-ci-smoke \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -p 18893:8893 \
            -e PORT=8893 -e HOST=0.0.0.0 -e DATA_DIR=/tmp/hosted \
            -e MEERKAT_DEPLOYMENT_PROFILE=self-host -e MEERKAT_STORE_BACKEND=file \
            -e ENTITLEMENT_SECRET=test-entitlement -e WEBHOOK_SECRET=test-webhook \
            -e STRIPE_SECRET_KEY=sk_test_placeholder \
            -e STRIPE_MONTHLY_PRICE_ID=price_monthly \
            -e STRIPE_APP_UNLOCK_PRICE_ID=price_unlock \
            -e REVENUECAT_REST_API_KEY=rc_test_placeholder \
            -e MEERKAT_ALLOWED_ORIGINS=https://app.example.test \
            -e MEERKAT_APP_UNLOCK_TOKEN_SECRET=test-app-token \
            meerkat-platform-ci \
            ./node_modules/.bin/tsx bin/meerkat-hosted-service.mjs
          trap 'docker stop meerkat-platform-ci-smoke 2>/dev/null || true' EXIT
          # curl --retry does not retry an empty reply (exit 52), which is what
          # docker-proxy returns while the tsx entrypoint is still cold-booting,
          # so poll with a bounded loop instead.
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18893/healthz; then
              echo "hosted service is healthy"; exit 0
            fi
            sleep 2
          done
          echo "hosted service did not become healthy" >&2
          docker logs meerkat-platform-ci-smoke >&2 || true
          exit 1
