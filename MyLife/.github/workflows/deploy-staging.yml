# Meerkat staging deploy checklist (Plan 44 Phase 6, WP-6C).
#
# WHAT THIS WORKFLOW IS. An AUDITABLE CHECKLIST RAIL, founder-triggered. CI cannot
# honestly deploy to the founder's staging hosts (it holds no SSH, no orchestrator
# credential, and inventing a fake deploy step would be exactly the dishonesty this
# plan forbids). So this workflow does ONLY what CI can do truthfully:
#   - fails immediately if the release id input is empty,
#   - prints the EXACT operator commands to run, as a step summary, in order:
#       1. verify the release is a signed, APPROVED manifest and the images are
#          digest-pinned (meerkat-release --verify + cosign verify),
#       2. deploy the pinned images to staging (docker compose pull/up with the
#          MEERKAT_RELEASE_TAG), and
#       3. RECORD the staging transition against the durable proof table
#          (meerkat-promotion --promote --to staging).
#
# WHAT THIS WORKFLOW IS NOT. It does not SSH, it does not run docker against a real
# host, it does not record the promotion. The deploy target actions and the record
# are FOUNDER-OPS, run by the operator against the real hosts and the ops database.
# A green run of this workflow proves the checklist was generated, NOT that a deploy
# happened. See docs/guides/meerkat-runbooks/release-promotion.md.

name: Deploy staging (checklist)

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'The recorded, APPROVED release id to deploy to staging'
        required: true
        type: string

permissions:
  contents: read

jobs:
  checklist:
    name: Generate staging deploy checklist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The release id is the whole point; an empty input is a hard fail, never a
      # checklist for "nothing". The FORMAT guard matters too: the id is rendered
      # into the step summary and into copy/paste shell commands, so backticks,
      # quotes, semicolons, or whitespace would let a crafted id forge checklist
      # sections or a command an operator then pastes.
      - name: Require a well-formed release id
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_ID" | grep -Eq '^[A-Za-z0-9._:@/-]{1,512}$'; then
            echo "::error::release_id must match ^[A-Za-z0-9._:@/-]{1,512}$; refusing to render it into a checklist" >&2
            exit 1
          fi

      - name: Emit the founder-ops staging deploy checklist
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          {
            echo "# Staging deploy checklist for \`${RELEASE_ID}\`"
            echo
            echo "> This workflow generated the checklist. It did NOT deploy. Run the steps"
            echo "> below against the real staging hosts and the ops database (FOUNDER-OPS)."
            echo
            echo "## 1. Verify the release is signed + approved (NC-44.4)"
            echo '```bash'
            echo "# For every image ref you are about to pull, prove it is digest-pinned and"
            echo "# present in the APPROVED manifest:"
            echo "MEERKAT_POSTGRES_URL='postgres://meerkat_ops:<pw>@<ops-host>/<db>' \\"
            echo "  pnpm --filter @mylife/meerkat-relay release:postgres --verify \\"
            echo "    --release-id '${RELEASE_ID}' \\"
            echo "    --image 'ghcr.io/<owner>/meerkat-relay@sha256:<digest>' \\"
            echo "    --image 'ghcr.io/<owner>/meerkat-platform@sha256:<digest>' \\"
            echo "    --image 'ghcr.io/<owner>/meerkat-hosted@sha256:<digest>' \\"
            echo "    --image 'ghcr.io/<owner>/meerkat-verification@sha256:<digest>'"
            echo "# Then cryptographically verify each signature (release-cli proves membership,"
            echo "# cosign proves the signature). The identity is PINNED to this repository's"
            echo "# release workflow; a wildcard would accept any GitHub workflow's signature:"
            echo "cosign verify 'ghcr.io/<owner>/meerkat-relay@sha256:<digest>' \\"
            echo "  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-images.yml@'"
            echo '```'
            echo
            echo "## 2. Deploy the pinned images to staging (FOUNDER-OPS)"
            echo '```bash'
            echo "export MEERKAT_RELEASE_TAG='<git-sha of the release>'"
            echo "docker compose --env-file <staging.env> -f packages/meerkat-relay/deploy/compose.production.yml pull"
            echo "docker compose --env-file <staging.env> -f packages/meerkat-relay/deploy/compose.production.yml up -d"
            echo '```'
            echo
            echo "## 3. Record the staging transition (durable proof)"
            echo '```bash'
            echo "MEERKAT_POSTGRES_URL='postgres://meerkat_ops:<pw>@<ops-host>/<db>' \\"
            echo "  pnpm --filter @mylife/meerkat-relay promotion:postgres --promote \\"
            echo "    --release-id '${RELEASE_ID}' --to staging --operator '<you>'"
            echo '```'
            echo
            echo "A transition that was not recorded is not evidence; a recorded transition"
            echo "proves the record, not the deploy. Confirm the app on staging before promoting"
            echo "to \`staging_canary\` (see the release-promotion runbook)."
          } >> "$GITHUB_STEP_SUMMARY"
