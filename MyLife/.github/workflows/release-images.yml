# Meerkat signed release image supply chain (Plan 44 Phase 6, WP-6A).
#
# WHAT THIS WORKFLOW PROVES (in CI, deterministically):
#   For each of the four production images (relay, platform, hosted,
#   verification) it builds from the correct context, tags by the IMMUTABLE full
#   git SHA (never `latest`), pushes to GHCR, then for that exact pushed digest:
#     - generates an SPDX SBOM (anchore/sbom-action -> syft),
#     - runs TWO Grype scans: a BLOCKING scan that fails on any FIXED finding at
#       or above the severity cutoff unless explicitly excepted in
#       .github/vulnerability-exceptions.yml (a repo-owned, review-gated,
#       expiry-audited Grype config), and an INFORMATIONAL full scan (all
#       severities, fixed or not) whose SARIF is uploaded so unfixed findings
#       are visible evidence. HONEST LIMIT: an UNFIXED high/critical CVE does
#       NOT block the release (nothing in this repo can action it); it appears
#       in the full-scan artifact, never hidden,
#     - attaches SLSA build provenance (actions/attest-build-provenance), and
#     - Cosign keyless-signs the digest via GitHub OIDC (no long-lived key).
#   The final job assembles a DRAFT release-manifest JSON artifact recording
#   every image digest and its SBOM/scan/attestation/signature references, the
#   git SHA, and the migration range.
#
# WHAT THIS WORKFLOW DOES NOT DO (founder-ops boundary, honest):
#   - It does NOT record the manifest into PostgreSQL (`ops.release_manifests`).
#     Recording + approval is operator-run via the `meerkat-release` CLI
#     (WP-6B). CI only emits the draft artifact.
#   - It does NOT deploy, promote, or run a canary. That is WP-6C + founder-ops.
#   - mobileBuild / webArtifact are NOT built here; the draft manifest carries an
#     explicit null (honestly absent, never fabricated). If founder-ops attests
#     one later, they fill {ref, founderSupplied: true} before recording.
#   No step simulates a push, sign, scan, or attestation: every one runs for
#   real against the real registry and the real OIDC identity, or the job fails.

name: Release images

on:
  workflow_dispatch:
  push:
    tags:
      - 'release-v*'

# Least privilege: the workflow default is read-only. ONLY the build-sign-scan
# job elevates (packages: write to push, id-token: write for Cosign keyless +
# provenance OIDC, attestations: write to store the attestation). The audit and
# assemble jobs only check out, parse, and upload ordinary artifacts, so they
# run with the read-only default.
permissions:
  contents: read

jobs:
  # One job per image via a matrix. Each entry names its build context, its
  # Dockerfile, and the GHCR image name. The relay builds from its own package
  # dir; the three stateful services build from the monorepo root so pnpm can
  # resolve the workspace.
  build-sign-scan:
    name: Build, scan, sign (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: meerkat-relay
            context: ./packages/meerkat-relay
            dockerfile: ./packages/meerkat-relay/Dockerfile
          - name: meerkat-platform
            context: .
            dockerfile: ./packages/meerkat-relay/Dockerfile.platform
          - name: meerkat-hosted
            context: .
            dockerfile: ./packages/meerkat-relay/Dockerfile.hosted
          - name: meerkat-verification
            context: .
            dockerfile: ./packages/meerkat-relay/Dockerfile.verification
    outputs:
      # The matrix fans out; each job writes its per-image manifest fragment as
      # an artifact (image-manifest-<name>), which the assemble job collects.
      # (Matrix job outputs cannot be aggregated directly, so we pass fragments
      # through the artifact store.)
      git_sha: ${{ steps.vars.outputs.git_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve immutable vars (lowercase owner, full git SHA)
        id: vars
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="ghcr.io/${owner}/${{ matrix.image.name }}"
          git_sha="${{ github.sha }}"
          echo "repository=${repo}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${repo}:${git_sha}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${git_sha}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      # Build + push tagged ONLY by the immutable git SHA (never `latest`).
      # provenance/sbom on the builder are left off here because we generate a
      # standalone SPDX SBOM and a signed SLSA attestation against the pushed
      # digest below, which is the authoritative supply-chain evidence.
      - name: Build and push (${{ matrix.image.name }})
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.vars.outputs.image_ref }}
          provenance: false
          sbom: false

      - name: Pin the pushed digest
        id: digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "${digest}" ]; then
            echo "::error::build-push-action produced no digest; refusing to continue" >&2
            exit 1
          fi
          repo="${{ steps.vars.outputs.repository }}"
          echo "image_digest=${repo}@${digest}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # SPDX SBOM of the exact pushed digest, uploaded as a build artifact.
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.digest.outputs.image_digest }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.image.name }}.spdx.json
          output-file: ${{ github.workspace }}/sbom-${{ matrix.image.name }}.spdx.json
          upload-artifact: true

      # BLOCKING Grype scan. Fails the job on any FIXED finding at or above the
      # severity cutoff that is NOT excepted in the repo-owned exception file.
      # `only-fixed: true` means an UNFIXED high/critical CVE does NOT block
      # (there is no upstream fix to ship from this repo) AND is FILTERED from
      # this SARIF — which is why the informational full scan below exists: the
      # complete picture is always uploaded, never hidden behind the filter.
      - name: Grype vulnerability scan (blocking, fixed findings only)
        id: scan
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6.5.1
        with:
          image: ${{ steps.digest.outputs.image_digest }}
          config: ${{ github.workspace }}/.github/vulnerability-exceptions.yml
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif

      - name: Upload blocking scan SARIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-${{ matrix.image.name }}.sarif
          path: ${{ steps.scan.outputs.sarif }}
          if-no-files-found: error

      # INFORMATIONAL full scan: every severity, fixed or unfixed, NO exception
      # file. Never fails the build; exists so the release evidence includes the
      # findings the blocking scan's only-fixed filter excludes.
      - name: Grype vulnerability scan (informational, full)
        id: scan_full
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6.5.1
        with:
          image: ${{ steps.digest.outputs.image_digest }}
          fail-build: false
          severity-cutoff: negligible
          output-format: sarif

      - name: Upload full scan SARIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-full-${{ matrix.image.name }}.sarif
          path: ${{ steps.scan_full.outputs.sarif }}
          if-no-files-found: error

      # SLSA build provenance attestation bound to the pushed digest. Uses the
      # GitHub OIDC identity (id-token: write) and stores the attestation in the
      # repo's attestation store (attestations: write).
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.vars.outputs.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      # Cosign keyless signature of the pushed digest via GitHub OIDC. No
      # long-lived key material: the identity is the workflow's OIDC token, and
      # the signature + certificate land in the Rekor transparency log.
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Cosign keyless sign (GitHub OIDC)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign --yes "${{ steps.digest.outputs.image_digest }}"

      # Per-image manifest fragment. The assemble job merges the four fragments
      # into the draft release manifest. References here are honest pointers to
      # where each piece of evidence lives, not fabricated hashes.
      - name: Write per-image manifest fragment
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat > "image-manifest-${{ matrix.image.name }}.json" <<JSON
          {
            "name": "${{ matrix.image.name }}",
            "repository": "${{ steps.vars.outputs.repository }}",
            "digest": "${{ steps.digest.outputs.digest }}",
            "imageRef": "${{ steps.digest.outputs.image_digest }}",
            "sbomRef": "${run_url}#artifacts:sbom-${{ matrix.image.name }}.spdx.json",
            "scanResultRef": "${run_url}#artifacts:scan-${{ matrix.image.name }}.sarif",
            "attestationRef": "${{ steps.attest.outputs.attestation-url }}",
            "signatureRef": "rekor:${{ steps.digest.outputs.image_digest }}"
          }
          JSON

      - name: Upload per-image manifest fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-manifest-${{ matrix.image.name }}
          path: image-manifest-${{ matrix.image.name }}.json
          if-no-files-found: error

  # Independent gate: fail the whole release if any active exception entry is
  # past its documented `expiry`. Grype does not enforce expiry natively, so the
  # expiry contract in .github/vulnerability-exceptions.yml is enforced here.
  exceptions-audit:
    name: Audit vulnerability exceptions (expiry)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Structural enforcement, not banner parsing: the YAML is loaded for real.
      # Every ignore entry MUST carry vulnerability + reason + a package.name
      # scope (an unscoped ignore would mask the CVE in EVERY package of EVERY
      # image), and the file must carry one expiry: date per entry (the example
      # template uses a non-date placeholder, so it can never satisfy or trip
      # the audit). Any expiry in the past fails the release.
      - name: Audit vulnerability exceptions (scope + expiry)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, re, sys, pathlib, yaml

          path = pathlib.Path(".github/vulnerability-exceptions.yml")
          text = path.read_text(encoding="utf-8")
          doc = yaml.safe_load(text) or {}
          entries = doc.get("ignore") or []
          problems = []

          for i, entry in enumerate(entries):
              if not isinstance(entry, dict) or not entry.get("vulnerability"):
                  problems.append(f"entry {i}: missing `vulnerability`")
                  continue
              vid = entry["vulnerability"]
              if not entry.get("reason"):
                  problems.append(f"{vid}: missing `reason`")
              package = entry.get("package") or {}
              if not isinstance(package, dict) or not package.get("name"):
                  problems.append(
                      f"{vid}: missing `package.name` scope; an unscoped ignore "
                      f"masks the CVE in every package of every image")

          # Expiry dates live in the review-contract comments; real ISO dates only
          # (the template placeholder is not a date). Every entry needs one, and
          # none may be past.
          dates = [datetime.date.fromisoformat(m.group(1))
                   for m in re.finditer(r"expiry:\s*(\d{4}-\d{2}-\d{2})", text)]
          today = datetime.date.today()
          expired = [d.isoformat() for d in dates if d < today]
          if expired:
              problems.append(f"exception expiry date(s) past due: {expired}")
          if len(dates) < len(entries):
              problems.append(
                  f"{len(entries)} ignore entries but only {len(dates)} expiry "
                  f"dates; every exception must carry an `# expiry: YYYY-MM-DD` "
                  f"comment")

          if problems:
              for p in problems:
                  print(f"::error::vulnerability-exceptions.yml: {p}")
              sys.exit(1)
          print(f"{len(entries)} exception(s), all scoped, all within expiry.")
          PY

  # Final job: collect the four per-image fragments and emit ONE draft release
  # manifest artifact. This is the WP-6B manifest schema shape. It is a DRAFT:
  # recording it into ops.release_manifests and approving it is founder-ops via
  # the meerkat-release CLI, NOT this workflow.
  assemble-manifest:
    name: Assemble draft release manifest
    runs-on: ubuntu-latest
    needs: [build-sign-scan, exceptions-audit]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download image manifest fragments
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-manifest-*
          path: fragments
          merge-multiple: true

      # The draft's `manifest` object is EXACTLY the WP-6B releaseManifestSchema
      # shape (schemaVersion 1), so the operator can extract it verbatim
      # (`jq .manifest release-manifest-draft.json`) and feed it straight to
      # `meerkat-release --record`. Draft metadata (deployRefs, the note) lives in
      # the WRAPPER, never inside the manifest, because the schema is strict.
      - name: Compose draft release manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, glob, os, re, pathlib

          images = []
          deploy_refs = []
          for f in sorted(glob.glob("fragments/image-manifest-*.json")):
              with open(f, encoding="utf-8") as fh:
                  fragment = json.load(fh)
              # The fragment's imageRef (repo@digest) is deploy-side info, not a
              # schema field; the strict WP-6B schema would reject it inline.
              deploy_refs.append(fragment.pop("imageRef"))
              images.append(fragment)
          if len(images) != 4:
              raise SystemExit(f"expected 4 image fragments, found {len(images)}: "
                               f"{[i.get('name') for i in images]}")

          # Migration range: lowest and highest numeric prefix under the relay's
          # PostgreSQL migrations dir. Derived, never hardcoded.
          mig_dir = pathlib.Path("packages/meerkat-relay/src/postgres/migrations")
          ids = sorted({
              int(m.group(1))
              for p in mig_dir.iterdir()
              for m in [re.match(r"(\d+)-", p.name)]
              if m
          })
          if not ids:
              raise SystemExit(f"no numbered migrations found under {mig_dir}")
          migration_range = {"lowest": ids[0], "highest": ids[-1]}

          # The config-schema digest is defined (see release-manifest.ts) as the
          # sha256 over the raw bytes of the production deploy contract file at
          # the release commit. Derived here so the operator can recompute it.
          config_path = pathlib.Path("packages/meerkat-relay/deploy/compose.production.yml")
          config_schema_digest = hashlib.sha256(config_path.read_bytes()).hexdigest()

          manifest = {
              "schemaVersion": 1,
              "gitSha": os.environ["GIT_SHA"],
              "images": images,
              "migrationRange": migration_range,
              "configSchemaDigest": config_schema_digest,
              # Not built by CI: null means HONESTLY ABSENT, never fabricated. If
              # founder-ops later attests a store build / web artifact, they fill
              # {"ref": ..., "founderSupplied": true} before recording.
              "mobileBuild": None,
              "webArtifact": None,
              "rollbackReleaseId": None,
          }
          artifact = {
              "draft": True,
              "note": ("Draft emitted by CI. The `manifest` object is WP-6B "
                       "releaseManifestSchema-shaped: review it, optionally fill "
                       "mobileBuild/webArtifact/rollbackReleaseId, extract it "
                       "(jq .manifest), then record + approve via the "
                       "meerkat-release CLI. CI never records or approves."),
              "deployRefs": deploy_refs,
              "manifest": manifest,
          }
          out = "release-manifest-draft.json"
          with open(out, "w", encoding="utf-8") as fh:
              json.dump(artifact, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(json.dumps(artifact, indent=2, sort_keys=True))
          PY
        env:
          GIT_SHA: ${{ needs.build-sign-scan.outputs.git_sha }}

      - name: Upload draft release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest-draft
          path: release-manifest-draft.json
          if-no-files-found: error
