nd \"Cancel Schedule\" actions per draft. Show sent confirmation with delivery status. Include a \"Snooze\" feature for received emails that resurfaces them at a chosen time."}, {"id": "MARKET-01", "module": "market", "title": "Encrypted Messaging Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(market)/messages.tsx", "apps/web/app/market/messages/page.tsx"], "referenceLogic": ["modules/market/src/crypto/secure-messaging.ts", "modules/market/src/encryption.ts"], "prompt": "Enhance the marketplace messaging screen with end-to-end encryption. Show a conversation list with buyer/seller, listing thumbnail, last message preview, and encryption status badge. Each conversation thread shows messages with sender avatar, timestamp, and read receipts. Use the secure-messaging engine for E2E encryption. Include a message composer with text, image attachment, and offer/counter-offer actions. Show a \"Make Offer\" button that sends a structured price offer within the chat. Display a security indicator showing encryption is active. Include listing context card at the top of each conversation."}, {"id": "MARKET-02", "module": "market", "title": "Payment Flow Screen (Stripe Connect)", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(market)/checkout.tsx", "apps/web/app/market/checkout/page.tsx"], "referenceLogic": ["modules/market/src/payments/stripe-connect.ts", "modules/market/src/payments/orchestrator.ts"], "prompt": "Build the marketplace payment flow screen. Show a checkout summary: item photo, title, price, shipping cost, total. Include Stripe payment form integration (card input, Apple Pay, Google Pay) using the Stripe Connect flow. Display seller info and buyer protection policy. Use the payment orchestrator for escrow flow: payment held until delivery confirmed. Show payment processing states (pending/processing/complete/failed). Include a receipt view after payment. Add a \"Pay with Wallet\" option for stored payment methods. Display estimated delivery date."}, {"id": "MARKET-03", "module": "market", "title": "Dispute Resolution Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(market)/dispute/[id].tsx", "apps/web/app/market/disputes/page.tsx"], "referenceLogic": ["modules/market/src/disputes/engine.ts", "modules/market/src/disputes/index.ts"], "prompt": "Build a dispute resolution screen. Show open disputes with: order info, dispute reason (item not received, item not as described, damaged, etc.), status timeline (opened/under-review/resolved), and messages between parties. Use the disputes engine for status management and resolution flow. Include a \"File Dispute\" wizard: select order, choose reason, describe issue, upload evidence photos. Show resolution options (refund, partial refund, return item). Display dispute history with outcomes. Add a 72-hour auto-escalation countdown for unresponsive parties."}, {"id": "MARKET-04", "module": "market", "title": "Shipping Tracking Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(market)/tracking/[id].tsx", "apps/web/app/market/tracking/page.tsx"], "referenceLogic": ["modules/market/src/shipping/tracking.ts", "modules/market/src/shipping/index.ts"], "prompt": "Build a shipping tracking screen. Show all active shipments with: order info, carrier, tracking number, current status, and estimated delivery date. Each shipment shows a step-by-step tracking timeline (label created -> picked up -> in transit -> out for delivery -> delivered) with timestamps and locations. Use the shipping tracking engine for carrier API integration. Include a map view showing current package location. Display delivery confirmation with signature/photo if available. Add push notification preferences for tracking updates."}, {"id": "MARKET-05", "module": "market", "title": "Seller Verification Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(market)/verification.tsx", "apps/web/app/market/verification/page.tsx"], "referenceLogic": ["modules/market/src/verification/engine.ts", "modules/market/src/verification/index.ts"], "prompt": "Build a seller verification screen. Show the verification process steps: 1) Email verification, 2) Phone verification (SMS code), 3) ID verification (photo upload), 4) Payment method setup. Each step shows completion status. Use the verification engine for verification level logic. Display current verification level badge (unverified, basic, verified, trusted). Show trust score breakdown: verification level, transaction history, response rate, dispute rate. Include a \"View My Seller Profile\" preview showing how buyers see the profile. Display verification benefits per level."}, {"id": "MARKET-06", "module": "market", "title": "Service Offerings Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(market)/services.tsx", "apps/web/app/market/services/page.tsx"], "referenceLogic": ["modules/market/src/db/crud.ts", "modules/market/src/types.ts"], "prompt": "Build a service offerings screen (beyond physical items). Show a service listing form: title, category (tutoring, repair, design, etc.), description, pricing model (flat rate, hourly, per project), availability calendar, location/remote toggle, and portfolio photos. Display active service listings in a card grid. Include a service search with filters: category, price range, distance, rating. Show service provider profile with reviews and booking calendar. Add a \"Request Quote\" flow for custom services. Display booked appointments with status tracking."}, {"id": "MARKET-07", "module": "market", "title": "Advanced Search Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(market)/search.tsx", "apps/web/app/market/search/page.tsx"], "referenceLogic": ["modules/market/src/db/crud.ts", "modules/market/src/types.ts"], "prompt": "Build an advanced marketplace search screen. Show a search bar with auto-complete suggestions. Include filter panel: category, price range (min/max), condition (new/like-new/good/fair), distance radius slider, sort order (newest/price/distance/relevance), seller rating minimum. Display results in a grid with toggle to list view. Each result card shows: photo, title, price, condition badge, distance, seller rating. Include \"Save Search\" with notification on new matches. Show recent searches and trending searches. Add a category browser with subcategory drill-down."}, {"id": "MEDS-01", "module": "meds", "title": "Drug Interaction Checker Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(meds)/interactions.tsx", "apps/web/app/meds/interactions/page.tsx"], "referenceLogic": ["modules/meds/src/interactions/checker.ts", "modules/meds/src/interactions/database.ts"], "prompt": "Build a drug interaction checker screen. Show a medication selector (from user's active meds) and an \"Add Medication\" field for checking new drugs. Display interaction results from the checker engine: severity (major/moderate/minor/none), affected drugs, interaction description, and clinical recommendation. Use the interaction database for lookup. Show a matrix view of all current medications with interaction indicators. Color code severity (red/orange/yellow/green). Include a \"Full Report\" export for doctor visits. Display food-drug interactions (grapefruit, dairy, etc.)."}, {"id": "MEDS-02", "module": "meds", "title": "Refill Tracking and Burn Rate Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(meds)/refills.tsx", "apps/web/app/meds/refills/page.tsx"], "referenceLogic": ["modules/meds/src/medication/refill-tracker.ts", "modules/meds/src/medication/crud.ts"], "prompt": "Build a refill tracking screen. Show each medication with: current supply level (pills remaining), daily burn rate, estimated run-out date, and days until refill needed. Use the refill tracker for burn rate calculations and refill predictions. Display a visual supply gauge per medication (full/half/low/critical). Include a \"Refill Reminder\" notification setting per medication (notify when X days supply remaining). Show refill history with dates and quantities. Add pharmacy information per medication. Include a \"Refill All\" quick action for medications due within 7 days."}, {"id": "MEDS-03", "module": "meds", "title": "Adherence Calendar Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(meds)/adherence.tsx", "apps/web/app/meds/adherence/page.tsx"], "referenceLogic": ["modules/meds/src/reminders/adherence.ts", "modules/meds/src/reminders/calendar.ts"], "prompt": "Build a medication adherence calendar screen. Show a monthly calendar view where each day is color-coded: green (all doses taken), yellow (partial), red (missed), gray (future/no data). Tapping a day shows the detailed dose log for that day: each medication, scheduled time, actual taken time, and status. Display adherence percentage for the current month and trend over 3/6/12 months. Use the adherence engine for calculations. Show per-medication adherence rates. Include a weekly adherence bar chart. Add a \"Perfect Week\" streak counter and celebratory milestones."}, {"id": "MEDS-04", "module": "meds", "title": "Measurement Trending Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(meds)/measurement-trends.tsx", "apps/web/app/meds/measurements/trends/page.tsx"], "referenceLogic": ["modules/meds/src/measurements/trends.ts", "modules/meds/src/measurements/crud.ts"], "prompt": "Build a measurement trending screen. Show interactive line charts for each tracked measurement type: blood pressure, blood glucose, weight, temperature, heart rate, SpO2. Each chart shows: data points, trend line, normal range bands, and annotation markers for medication changes. Use the measurement trends engine for trend calculations and anomaly detection. Allow selecting different time ranges (7d/30d/90d/1y). Show min/max/average stats per period. Include correlation highlights between measurement changes and medication adjustments. Add a \"Log Measurement\" quick-add per type."}, {"id": "MEDS-05", "module": "meds", "title": "Mood/Symptom Correlation Dashboard", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(meds)/correlation.tsx", "apps/web/app/meds/correlation/page.tsx"], "referenceLogic": ["modules/meds/src/analytics/correlation.ts", "modules/meds/src/mood/index.ts"], "prompt": "Build a mood/symptom correlation dashboard. Show a dual-axis chart overlaying mood scores with medication timing. Use the correlation engine to detect patterns: \"Mood improves 2 hours after taking [medication]\", \"Symptom X worsens on days when [medication] is missed.\" Display correlation strength indicators (strong/moderate/weak). Show a heatmap of symptom frequency vs medication adherence. Include mood check-in integration (link to mood logging). Display a \"Medication Effectiveness\" score per medication based on symptom response. Add a symptom diary view grouped by date with medication context."}, {"id": "MEDS-06", "module": "meds", "title": "Wellness Score Dashboard", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(meds)/wellness.tsx", "apps/web/app/meds/wellness/page.tsx"], "referenceLogic": ["modules/meds/src/engine/wellness-score.ts", "modules/meds/src/analytics/stats.ts"], "prompt": "Build a wellness score dashboard. Show an overall wellness score (0-100) with contributing factors from the wellness score engine: medication adherence, symptom management, vital signs stability, mood trend, and sleep quality. Display each factor as a sub-score with a mini trend chart. Show a daily/weekly wellness score trend line. Include actionable recommendations per low-scoring factor. Display a \"streak\" for days above target wellness score. Add a comparison to previous month. Include a morning check-in prompt that captures key daily metrics."}, {"id": "MEDS-07", "module": "meds", "title": "Doctor Reports Export Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(meds)/reports.tsx", "apps/web/app/meds/reports/page.tsx"], "referenceLogic": ["modules/meds/src/export/markdown-report.ts", "modules/meds/src/export/index.ts"], "prompt": "Build a doctor reports screen. Show report templates: \"Full Medical Summary\", \"Medication History\", \"Blood Pressure Report\", \"Glucose Management Report\", \"Adherence Summary\". Each report shows a preview with customizable date range. Use the markdown report generator to produce formatted reports. Include export options: PDF, print, share. Show generated report history with dates. Add custom report builder: select which sections to include (medications, vitals, adherence, symptoms, mood, measurements). Display a \"Prepare for Visit\" checklist with questions to ask the doctor."}, {"id": "MEDS-08", "module": "meds", "title": "Caregiver Alerts Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(meds)/caregivers.tsx", "apps/web/app/meds/caregivers/page.tsx"], "referenceLogic": ["modules/meds/src/caregiver/engine.ts", "modules/meds/src/models/caregiver.ts"], "prompt": "Enhance the caregiver alerts screen. Show a list of designated caregivers with name, relationship, contact info, and notification preferences. Use the caregiver engine for alert rules: missed dose alerts (after X minutes), low supply alerts, abnormal measurement alerts (BP/glucose out of range), and wellness score drops. Each alert rule shows enabled/disabled toggle and trigger threshold. Display alert history showing what was sent and when. Include a \"Caregiver View\" preview showing what caregivers see in their notifications. Add a \"Share Report\" action to send a summary to a caregiver."}, {"id": "MEDS-09", "module": "meds", "title": "FODMAP Tracking Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(meds)/fodmap.tsx", "apps/web/app/meds/fodmap/page.tsx"], "referenceLogic": ["modules/meds/src/fodmap/engine.ts", "modules/meds/src/fodmap/seed.ts"], "prompt": "Enhance the FODMAP tracking screen. Show a food diary with FODMAP classification per food item from the seed database. Display a color-coded food list: green (low FODMAP), yellow (moderate), red (high FODMAP). Include phase tracking: elimination, reintroduction (with specific FODMAP group testing), and maintenance. Show symptom correlation with food entries (bloating, pain, etc. vs food groups). Use the FODMAP engine for food classification and tolerance scoring. Add a barcode scanner for packaged food FODMAP lookup. Display a \"Safe Foods\" quick reference list."}, {"id": "MEDS-10", "module": "meds", "title": "Pain Heatmap Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(meds)/pain-map.tsx", "apps/web/app/meds/pain/page.tsx"], "referenceLogic": ["modules/meds/src/pain/engine.ts", "modules/meds/src/models/pain.ts"], "prompt": "Enhance the pain heatmap screen. Show a body silhouette diagram where users can tap to mark pain locations. Each point captures: location, intensity (1-10 scale), type (sharp/dull/burning/aching/throbbing), and timestamp. Use the pain engine to generate heatmap overlays showing pain frequency/intensity per body region. Display a timeline view showing pain patterns over days/weeks. Include a medication correlation view showing which medications were taken before/after pain events. Show weather correlation if weather data is available. Add a \"Pain Journal\" for detailed descriptions and trigger notes."}, {"id": "MEDS-11", "module": "meds", "title": "CGM Integration Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(meds)/cgm.tsx", "apps/web/app/meds/cgm/page.tsx"], "referenceLogic": ["modules/meds/src/cgm/engine.ts", "modules/meds/src/models/cgm.ts"], "prompt": "Enhance the CGM (Continuous Glucose Monitor) screen. Show a real-time glucose line graph with color zones (low/target/high). Display current glucose reading, trend arrow, and time-in-range percentages. Use the CGM engine for trend analysis and alert thresholds. Show daily overlay charts comparing multiple days. Include meal markers and insulin dose markers on the timeline. Display statistics: time in range, time below range, time above range, GMI (glucose management indicator), coefficient of variation. Show patterns: dawn phenomenon detection, post-meal spikes. Include alert settings for high/low thresholds."}, {"id": "NOTES-01", "module": "notes", "title": "Canvas/Whiteboard Editor", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(notes)/canvas.tsx", "apps/web/app/notes/canvas/[id]/page.tsx"], "referenceLogic": ["modules/notes/src/canvas/engine.ts", "modules/notes/src/canvas/layout.ts", "modules/notes/src/canvas/serializer.ts", "modules/notes/src/canvas/types.ts"], "prompt": "Enhance the canvas/whiteboard editor. Build an infinite canvas with: freehand drawing (pen/marker/highlighter), shape tools (rectangle/circle/arrow/line), text blocks, image embeds, and sticky notes. Use the canvas engine for element management and the serializer for persistence. Include a toolbar with tool selection, color picker, stroke width, and eraser. Support zoom/pan gestures. Add node connection lines between text blocks (for mind mapping). Include snap-to-grid and alignment guides from the layout engine. Support undo/redo. Show a minimap for navigation on large canvases."}, {"id": "NOTES-02", "module": "notes", "title": "Plugins Management Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(notes)/plugins.tsx", "apps/web/app/notes/plugins/page.tsx"], "referenceLogic": ["modules/notes/src/db/plugins.ts"], "prompt": "Enhance the plugins management screen. Show a list of installed plugins with: name, description, version, author, enabled/disabled toggle. Include a plugin browser/marketplace for discovering new plugins. Each plugin card shows: icon, name, rating, install count, and \"Install\" button. Display plugin settings per plugin. Show a \"Plugin Sandbox\" for safe execution. Include plugin categories: formatting, import/export, integrations, themes, productivity. Display plugin changelog and update notifications. Add a \"Develop Plugin\" section with API documentation link."}, {"id": "NOTES-03", "module": "notes", "title": "Web Clipper Screen", "dependsOn": [], "filesToEdit": ["apps/web/app/notes/clipper/page.tsx", "apps/mobile/app/(notes)/clipper.tsx"], "referenceLogic": ["modules/notes/src/engine/web-clipper.ts"], "prompt": "Enhance the web clipper screen. Show a URL input field and \"Clip\" button. After clipping, display the extracted content preview: title, main text, images, and metadata. Use the web clipper engine for content extraction and cleaning. Include clip format options: full page, simplified article, selection only, screenshot, bookmark only. Show a target notebook/folder selector. Add tag input for organization. Display clip history with thumbnails and source URLs. Include a \"Quick Clip\" mode that saves with minimal interaction. Show storage usage for clipped content."}, {"id": "NOTES-04", "module": "notes", "title": "Relational Database CRUD Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(notes)/databases.tsx", "apps/web/app/notes/databases/page.tsx"], "referenceLogic": ["modules/notes/src/db/databases.ts"], "prompt": "Enhance the relational database screen (Notion-style databases within notes). Show a table view with sortable/filterable columns. Support column types: text, number, date, select, multi-select, checkbox, URL, relation (link to other database rows). Include views: table, board (Kanban), calendar, gallery. Add a \"New Database\" wizard with template options (task tracker, CRM, inventory, reading list). Support row detail view as an expandable card. Include formula columns for computed values. Show database statistics (row count, last updated, column count). Add CSV import/export."}, {"id": "NOTES-05", "module": "notes", "title": "Template Variables and Management", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(notes)/templates.tsx", "apps/web/app/notes/templates/page.tsx"], "referenceLogic": ["modules/notes/src/templates/variables.ts", "modules/notes/src/templates/built-in.ts"], "prompt": "Enhance the templates screen with variable support. Show a template gallery with built-in templates from `built-in.ts`: meeting notes, project plan, daily standup, brainstorm, etc. Each template shows a preview and \"Use\" button. Include a template editor with variable insertion: `{{date}}`, `{{time}}`, `{{title}}`, custom user-defined variables. Use the variables engine for variable resolution at creation time. Support template sections with collapsible blocks. Add user-created custom templates with \"Save as Template\" from any note. Show template usage statistics and favorites."}, {"id": "NOTES-06", "module": "notes", "title": "Knowledge Graph Visualization", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(notes)/graph.tsx", "apps/web/app/notes/graph/page.tsx"], "referenceLogic": ["modules/notes/src/engine/graph.ts", "modules/notes/src/engine/link-intelligence.ts"], "prompt": "Enhance the knowledge graph visualization. Show an interactive force-directed graph where nodes are notes and edges are wiki-links/backlinks between them. Use the graph engine for layout and the link intelligence engine for relationship detection. Node size reflects connection count. Node color reflects note category/tag. Include zoom/pan and node click to preview note content. Show a sidebar with selected note's connections list. Include graph filters: by tag, date range, notebook. Display orphan nodes (notes with no connections). Add a \"Local Graph\" view showing connections for a single note within N hops."}, {"id": "NOTES-07", "module": "notes", "title": "Knowledge Discovery Dashboard", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(notes)/discovery.tsx", "apps/web/app/notes/discovery/page.tsx"], "referenceLogic": ["modules/notes/src/engine/knowledge-discovery.ts", "modules/notes/src/engine/tag-intelligence.ts"], "prompt": "Build a knowledge discovery dashboard. Show AI-generated insights from the knowledge discovery engine: suggested connections between unlinked notes that share themes, related notes clusters, topic evolution over time, and knowledge gaps (topics with few notes). Display a \"Daily Discovery\" card highlighting a forgotten note. Show tag co-occurrence analysis from the tag intelligence engine. Include a \"Random Note\" button for serendipitous rediscovery. Display a timeline of note creation showing topic diversity. Show a \"Most Connected\" leaderboard of heavily-linked notes."}, {"id": "NOTES-08", "module": "notes", "title": "Writing Analytics Dashboard", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(notes)/analytics.tsx", "apps/web/app/notes/analytics/page.tsx"], "referenceLogic": ["modules/notes/src/engine/writing-analytics.ts"], "prompt": "Build a writing analytics dashboard for notes. Show total note count, total word count, average note length, and notes-per-day trend. Use the writing analytics engine for: readability scores, vocabulary richness, writing consistency (daily/weekly patterns), most productive times. Display a calendar heatmap of note creation activity. Show top tags and their growth over time. Include a \"writing streak\" counter. Display note type distribution (text/canvas/database). Show a word cloud of most-used terms. Add a \"Year in Notes\" summary with monthly highlights."}, {"id": "NOTES-09", "module": "notes", "title": "AI Writing Assistant", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(notes)/ai-assistant.tsx", "apps/web/app/notes/ai/page.tsx"], "referenceLogic": ["modules/notes/src/ai/local-engine.ts", "modules/notes/src/ai/index.ts"], "prompt": "Build an AI writing assistant screen accessible from note editor. Show a sidebar/panel with AI actions: summarize selection, expand text, fix grammar, change tone (formal/casual/academic), translate, generate outline, brainstorm ideas, and continue writing. Use the local AI engine for on-device text operations where possible. Include a chat-style interface for asking questions about the note's content. Display AI suggestions inline with accept/reject actions. Show action history with undo capability. Include a \"Quick Actions\" toolbar that attaches to the note editor with common AI operations."}, {"id": "NUTRITION-01", "module": "nutrition", "title": "Barcode Scanner Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(nutrition)/scan.tsx", "apps/web/app/nutrition/scan/page.tsx"], "referenceLogic": ["modules/nutrition/src/barcode/scanner.ts", "modules/nutrition/src/barcode/index.ts", "modules/nutrition/src/db/barcode-cache.ts"], "prompt": "Enhance the barcode scanner screen. Show a live camera viewfinder with barcode scanning overlay. On successful scan, display the matched food item from the barcode cache or API lookup (Open Food Facts). Show: product name, brand, photo, serving size, calories, macros (protein/carbs/fat), and nutrition label. Include a \"Log This Food\" button with quantity/serving adjustment. Add a manual barcode entry field for when camera fails. Show recent scans list. Cache successful lookups for offline use via `barcode-cache.ts`. Display a \"Not Found\" flow for unrecognized barcodes with manual food entry option."}, {"id": "NUTRITION-02", "module": "nutrition", "title": "AI Photo Analysis Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(nutrition)/photo.tsx", "apps/web/app/nutrition/photo/page.tsx"], "referenceLogic": ["modules/nutrition/src/ai/photo-log.ts", "modules/nutrition/src/ai/prompts.ts", "modules/nutrition/src/ai/types.ts"], "prompt": "Enhance the AI photo food analysis screen. Show a camera capture or photo picker. After photo submission, display the AI-identified foods with estimated portions and nutrition breakdown using the photo-log engine. Show confidence level per identified food item. Include an editable results view where users can correct food identification, adjust portions, and add missed items. Display macro summary (calories, protein, carbs, fat) with a \"Log Meal\" button. Show analysis history with photo thumbnails and timestamps. Include a \"Retake\" option for unclear photos."}, {"id": "NUTRITION-03", "module": "nutrition", "title": "Macro Dashboard", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(nutrition)/dashboard.tsx", "apps/web/app/nutrition/dashboard/page.tsx"], "referenceLogic": ["modules/nutrition/src/stats/daily-summary.ts", "modules/nutrition/src/stats/micronutrients.ts", "modules/nutrition/src/db/goals.ts"], "prompt": "Enhance the macro dashboard. Show daily macro progress rings: calories (total), protein, carbs, and fat with target vs actual. Display a meal-by-meal breakdown (breakfast, lunch, dinner, snacks) with calorie contribution. Include micronutrient panel from `micronutrients.ts` showing vitamin and mineral intake vs RDA. Show a \"remaining budget\" indicator for calories and each macro. Display macronutrient ratio pie chart (actual vs target). Include a water intake tracker. Show a calorie balance indicator (intake vs estimated burn). Add a \"Quick Add\" for common foods/meals."}, {"id": "NUTRITION-04", "module": "nutrition", "title": "Daily Tracking Log Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(nutrition)/log.tsx", "apps/web/app/nutrition/log/page.tsx"], "referenceLogic": ["modules/nutrition/src/db/food-log.ts", "modules/nutrition/src/search/food-search.ts"], "prompt": "Build a daily food tracking log screen. Show a chronological list of logged food entries for the selected day. Each entry shows: time, food name, portion size, calories, and quick macros. Include an \"Add Food\" button that opens food search (by name or barcode). Support meal categorization (breakfast/lunch/dinner/snack). Show running totals as the user scrolls. Include a \"Copy Meal\" feature to duplicate meals from previous days. Add a \"Quick Log\" for frequently eaten foods. Display a date navigator to browse past days. Include swipe-to-delete per entry and edit capability."}, {"id": "NUTRITION-05", "module": "nutrition", "title": "Trends and History Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(nutrition)/trends.tsx", "apps/web/app/nutrition/trends/page.tsx"], "referenceLogic": ["modules/nutrition/src/stats/trends.ts", "modules/nutrition/src/engine/insight.ts"], "prompt": "Enhance the nutrition trends screen. Show weekly/monthly calorie intake trend line with goal target overlay. Display macro trends (protein/carbs/fat) as stacked area chart. Include a compliance score: percentage of days meeting macro targets. Use the insight engine for personalized observations (\"You tend to under-eat protein on weekends\"). Show a 7-day average comparison to previous 7 days. Display meal timing patterns (average breakfast/lunch/dinner time). Include a weight correlation chart if weight data is available. Add a \"Nutrition Score\" calculated from overall diet quality."}, {"id": "NUTRITION-06", "module": "nutrition", "title": "Goal Progress Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(nutrition)/goals.tsx", "apps/web/app/nutrition/goals/page.tsx"], "referenceLogic": ["modules/nutrition/src/db/goals.ts", "modules/nutrition/src/stats/daily-summary.ts"], "prompt": "Build a nutrition goals screen. Show active goals: calorie target, macro targets (g protein/carbs/fat), water intake goal, and custom nutrient goals. Each goal shows a progress bar with current vs target. Include a goal editor with options: weight loss, weight gain, maintenance, custom. Display TDEE calculator based on activity level, age, weight, and height. Show goal adherence over time (percentage of days meeting each goal). Include a \"Goal Wizard\" that recommends macro splits based on selected objective. Display projected weight change timeline based on calorie deficit/surplus."}, {"id": "PETS-01", "module": "pets", "title": "Vaccination Reminders Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(pets)/vaccinations.tsx", "apps/web/app/pets/vaccinations/page.tsx"], "referenceLogic": ["modules/pets/src/engine/reminders.ts", "modules/pets/src/engine/alerts.ts", "modules/pets/src/db/crud.ts"], "prompt": "Build a vaccination reminders screen. Show each pet's vaccination history and upcoming vaccinations. Each vaccine card shows: vaccine name, date administered, next due date, veterinarian, and status (current/due soon/overdue). Use the reminders engine for scheduling logic. Display a combined timeline view for multi-pet households. Include an \"Add Vaccination\" form with vaccine name, date, lot number, and vet name. Show notification preferences per vaccine type. Display a vaccination schedule template by pet type (dog/cat standard vaccines). Color code status (green/yellow/red)."}, {"id": "PETS-02", "module": "pets", "title": "Medication Tracking Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(pets)/medications.tsx", "apps/web/app/pets/medications/page.tsx"], "referenceLogic": ["modules/pets/src/engine/reminders.ts", "modules/pets/src/db/crud.ts"], "prompt": "Build a pet medication tracking screen. Show active medications per pet with: medication name, dosage, frequency, start date, end date, and remaining supply. Include a \"Give Dose\" quick action with timestamp logging. Display a dose history log per medication. Add an \"Add Medication\" form with: name, dosage amount, frequency (daily/twice daily/weekly/as needed), and instructions. Show reminders configuration per medication. Display a medication calendar view showing all pets' medication schedules. Include a supply tracker with refill alerts."}, {"id": "PETS-03", "module": "pets", "title": "Weight Trends Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(pets)/weight.tsx", "apps/web/app/pets/weight/page.tsx"], "referenceLogic": ["modules/pets/src/engine/weight.ts", "modules/pets/src/db/crud.ts"], "prompt": "Build a pet weight trends screen. Show a line chart of weight over time per pet with healthy weight range bands (based on breed/species). Display current weight, goal weight, and rate of change. Use the weight engine for trend calculations and health assessments. Include a \"Log Weight\" form with weight value and date. Show weight milestones (puppy/kitten growth milestones for young pets). Display multi-pet comparison chart option. Include a BMI/body condition score guide with visual reference images. Show alerts for sudden weight changes."}, {"id": "PETS-04", "module": "pets", "title": "Feeding Schedule Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(pets)/feeding.tsx", "apps/web/app/pets/feeding/page.tsx"], "referenceLogic": ["modules/pets/src/engine/feeding.ts", "modules/pets/src/db/crud.ts"], "prompt": "Build a feeding schedule screen. Show daily feeding schedule per pet: meal times, food type, portion size, and fed status (fed/pending). Include a \"Mark Fed\" quick action with timestamp. Display feeding history log. Use the feeding engine for calorie recommendations based on weight and activity level. Include an \"Add Feeding Schedule\" form with food brand, portion size, meal frequency, and special diet notes. Show a multi-pet feeding overview for households with multiple pets. Add a food supply tracker with auto-reorder reminders."}, {"id": "PETS-05", "module": "pets", "title": "Vet Visit History Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(pets)/vet-history.tsx", "apps/web/app/pets/vet-history/page.tsx"], "referenceLogic": ["modules/pets/src/db/crud.ts", "modules/pets/src/engine/reminders.ts"], "prompt": "Build a vet visit history screen. Show a chronological list of vet visits per pet with: date, clinic/vet name, reason (checkup/illness/injury/dental/surgery), diagnosis, treatment, cost, and follow-up date. Include an \"Add Visit\" form with all fields plus photo capture for receipts/records. Display a cost summary chart by visit type. Show upcoming scheduled visits with reminders. Include a vet directory per pet showing preferred clinics. Display a \"Annual Checkup Due\" alert based on last checkup date. Add a notes section per visit for treatment instructions."}, {"id": "PETS-06", "module": "pets", "title": "Expense Tracking Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(pets)/expenses.tsx", "apps/web/app/pets/expenses/page.tsx"], "referenceLogic": ["modules/pets/src/engine/expenses.ts", "modules/pets/src/db/crud.ts"], "prompt": "Build a pet expense tracking screen. Show expense categories: food, vet, grooming, supplies, insurance, toys, training. Display monthly/annual totals with a trend chart. Each expense entry shows: date, amount, category, pet, and description. Include an \"Add Expense\" form with receipt photo capture. Use the expenses engine for budget analysis and cost projections. Show per-pet cost comparison for multi-pet households. Display a monthly budget vs actual chart. Include a \"Lifetime Cost\" calculator per pet. Add cost projections for the next 12 months based on recurring expenses."}, {"id": "PETS-07", "module": "pets", "title": "Pet Age Calculator Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(pets)/age-calc.tsx", "apps/web/app/pets/age/page.tsx"], "referenceLogic": ["modules/pets/src/db/crud.ts", "modules/pets/src/types.ts"], "prompt": "Build a pet age calculator screen. Show each pet's age in human years using species-specific and breed-adjusted conversion (not the simple 7x rule). Display a visual age comparison showing the pet's life stage: puppy/kitten, adolescent, adult, senior. Show life expectancy range for the breed and percentage of expected lifespan. Include a birthday countdown. Display age-appropriate care recommendations (e.g., \"At senior age, consider bi-annual vet checkups\"). Show a growth timeline for young pets with milestone markers. Add a multi-pet age comparison chart."}, {"id": "RSVP-01", "module": "rsvp", "title": "iCal Sync Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(rsvp)/calendar-sync.tsx", "apps/web/app/rsvp/calendar/page.tsx"], "referenceLogic": ["modules/rsvp/src/engines/ical.ts", "modules/rsvp/src/db/crud.ts"], "prompt": "Build an iCal sync screen. Show a toggle to enable iCal sync with platform calendar app. Display a list of RSVP events with sync status (synced/pending/error). Use the iCal engine for .ics generation and parsing. Include a \"Sync Now\" button and auto-sync frequency setting. Show a conflict resolution UI when events overlap. Include an \"Export Event\" action per event that generates an .ics file. Display an import section for .ics files received via email. Show calendar subscription URL for external calendar apps."}, {"id": "RSVP-02", "module": "rsvp", "title": "Expense Splitting Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(rsvp)/expenses.tsx", "apps/web/app/rsvp/expenses/page.tsx"], "referenceLogic": ["modules/rsvp/src/engines/settlement.ts", "modules/rsvp/src/db/crud.ts"], "prompt": "Build an event expense splitting screen. Show event expenses with: item, amount, paid by, and split method (equal, by portion, custom amounts). Use the settlement engine to calculate who owes whom. Display a balance summary per guest. Include an \"Add Expense\" form with payer, amount, description, and split configuration. Show a settlement plan (simplified debts: \"Alice pays Bob $15, Carol pays Alice $10\"). Include a \"Mark Settled\" action per debt. Display total event cost and per-person cost. Add a receipt photo attachment per expense."}, {"id": "RSVP-03", "module": "rsvp", "title": "Event Templates Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(rsvp)/templates.tsx", "apps/web/app/rsvp/templates/page.tsx"], "referenceLogic": ["modules/rsvp/src/engines/templates.ts", "modules/rsvp/src/types.ts"], "prompt": "Build an event templates screen. Show a gallery of event templates from the templates engine: dinner party, birthday, wedding, potluck, game night, movie night, holiday gathering, baby shower, BBQ. Each template includes: pre-filled event details, suggested guest list size, timeline template, supply checklist, and invitation design. Include a \"Use Template\" button that creates a new event pre-populated. Add a \"Create Custom Template\" option from any past event. Show template categories and a search function. Display user's saved custom templates."}, {"id": "RSVP-04", "module": "rsvp", "title": "Dietary Response Collection Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(rsvp)/dietary.tsx", "apps/web/app/rsvp/dietary/page.tsx"], "referenceLogic": ["modules/rsvp/src/engines/dietary.ts", "modules/rsvp/src/db/crud.ts"], "prompt": "Build a dietary response collection screen. Show a guest list with dietary requirements collected via RSVP: allergies (nuts, dairy, gluten, shellfish, etc.), dietary preferences (vegetarian, vegan, halal, kosher), and custom restrictions. Use the dietary engine for requirement aggregation. Display a summary panel: total guests, dietary breakdown by type, and \"menu compatibility\" suggestions. Include the guest-facing RSVP form with dietary checkboxes and free-text field. Show a \"Shopping List\" generator that accounts for all dietary requirements. Display potential allergen conflicts with menu items."}, {"id": "RSVP-05", "module": "rsvp", "title": "Recurrence Rules Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(rsvp)/recurrence.tsx", "apps/web/app/rsvp/recurrence/page.tsx"], "referenceLogic": ["modules/rsvp/src/engines/recurrence.ts"], "prompt": "Build a recurrence rules configuration screen. Show a recurrence builder for repeating events: frequency (daily, weekly, bi-weekly, monthly, annually), day selection, end condition (never, after N occurrences, until date), and exceptions. Use the recurrence engine for RRULE generation and preview. Display a preview calendar showing the next 10 occurrences. Include \"Skip This Occurrence\" and \"Edit This Occurrence Only\" actions. Show a recurrence history (past occurrences with attendance). Include a \"Book Club\", \"Game Night\", and \"Team Meeting\" preset patterns."}, {"id": "RSVP-06", "module": "rsvp", "title": "Location and Maps Integration", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(rsvp)/location.tsx", "apps/web/app/rsvp/location/page.tsx"], "referenceLogic": ["modules/rsvp/src/engines/location.ts"], "prompt": "Build an event location screen. Show a map with event pin and venue details: name, address, phone, website, parking info, and accessibility notes. Use the location engine for geocoding and directions. Include a venue search with autocomplete. Display travel time estimates from guests' locations (if shared). Show nearby amenities (parking, transit, hotels). Include a \"Share Location\" button that generates a directions link. Display a venue photo gallery. Add indoor venue notes (floor/suite/room number). Include a weather forecast for outdoor events."}, {"id": "RSVP-07", "module": "rsvp", "title": "Invitation Design Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(rsvp)/invitation-design.tsx", "apps/web/app/rsvp/invitations/page.tsx"], "referenceLogic": ["modules/rsvp/src/engines/designs.ts", "modules/rsvp/src/types.ts"], "prompt": "Build an invitation design screen. Show a template gallery from the designs engine with themed invitation designs (formal, casual, festive, minimal). Each design shows: preview, color scheme, and font style. Include a customization editor: edit text (event name, details, host name), change colors, upload a custom header image, and adjust layout. Display a live preview of the invitation. Add a \"Send Preview\" to self. Include output options: digital share link, email, SMS, printable PDF. Show sent invitation tracking (opened, RSVP'd, pending)."}, {"id": "RSVP-08", "module": "rsvp", "title": "Guest Messaging Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(rsvp)/messaging.tsx", "apps/web/app/rsvp/messaging/page.tsx"], "referenceLogic": ["modules/rsvp/src/db/crud.ts", "modules/rsvp/src/types.ts"], "prompt": "Build a guest messaging screen. Show a message composer for event-wide announcements or individual guest messages. Include message templates: \"Reminder\", \"Update\", \"Thank You\", \"Directions\", \"What to Bring\". Display a message history with delivery status per guest. Add guest group messaging (e.g., message only \"Attending\" guests). Include a guest Q&A thread where guests can ask questions visible to all attendees. Show read receipts per message. Add scheduling for future message delivery (e.g., \"Send reminder 24 hours before event\")."}, {"id": "RSVP-09", "module": "rsvp", "title": "Gift Registry Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(rsvp)/registry.tsx", "apps/web/app/rsvp/registry/page.tsx"], "referenceLogic": ["modules/rsvp/src/db/crud.ts", "modules/rsvp/src/types.ts"], "prompt": "Build a gift registry screen. Show a wish list of gift items with: name, photo, price, link, and claimed/available status. Include an \"Add Item\" form with URL auto-fill (scrape product details from link). Display a guest view where guests can claim items (preventing duplicates). Show a fund/cash gift option with contribution tracking. Include multiple registry support (link to external registries: Amazon, Target, etc.). Display total registry value and percentage claimed. Add a \"Thank You\" tracking list for received gifts with sent/pending status."}, {"id": "RSVP-10", "module": "rsvp", "title": "Seating Arrangement Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(rsvp)/seating.tsx", "apps/web/app/rsvp/seating/page.tsx"], "referenceLogic": ["modules/rsvp/src/engines/seating.ts"], "prompt": "Build a seating arrangement screen. Show a visual floor plan editor with draggable table shapes (round, rectangular, long). Assign guests to seats via drag-and-drop. Use the seating engine for: auto-assign suggestions (keep groups together, separate conflicts), capacity validation per table, and guest relationship awareness. Display an unassigned guests panel. Include table naming/numbering. Show dietary requirements per seat for catering. Export seating chart as printable PDF. Include a \"Shuffle\" button for auto-optimization. Display a guest-facing \"Find My Seat\" view."}, {"id": "STARS-01", "module": "stars", "title": "Birth Chart Display Improvements", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(stars)/birth-chart.tsx", "apps/web/app/stars/birth-chart/page.tsx"], "referenceLogic": ["modules/stars/src/engine/astro.ts", "modules/stars/src/engine/interpretations.ts", "modules/stars/src/db/crud.ts"], "prompt": "Enhance the birth chart display. Show an interactive zodiac wheel with accurate planet positions from the astro engine. Display: ascendant, midheaven, planets in signs and houses, and major aspects (conjunction, sextile, square, trine, opposition) with aspect lines on the wheel. Each planet is tappable to show its interpretation from the interpretations engine: sign placement meaning, house placement meaning, and aspect descriptions. Include a table view alternative listing all placements. Show element/modality balance (fire/earth/air/water, cardinal/fixed/mutable). Add a \"Save Chart\" action for non-user profiles."}, {"id": "STARS-02", "module": "stars", "title": "Compatibility Results Visualization", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(stars)/compatibility.tsx", "apps/web/app/stars/compatibility/page.tsx"], "referenceLogic": ["modules/stars/src/engine/compatibility.ts", "modules/stars/src/engine/astro.ts"], "prompt": "Enhance the compatibility results screen. Show an overall compatibility score (0-100) with a visual gauge. Break down into categories: emotional (Moon compatibility), communication (Mercury), love (Venus), passion (Mars), growth (Jupiter/Saturn). Display a synastry chart overlay showing both charts. List key aspects between the two charts with interpretation text from the compatibility engine. Show a \"strengths\" and \"challenges\" summary. Include a comparison table of both profiles' key placements. Add a \"Compatibility History\" section showing past comparisons with scores."}, {"id": "STARS-03", "module": "stars", "title": "Transit Logging History", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(stars)/transit-history.tsx", "apps/web/app/stars/transits/page.tsx"], "referenceLogic": ["modules/stars/src/engine/transits.ts", "modules/stars/src/db/crud.ts"], "prompt": "Build a transit logging history screen. Show a chronological log of significant planetary transits that have affected the user's natal chart. Each transit entry shows: transiting planet, natal planet/point aspected, aspect type, date range (applying/exact/separating), and interpretation text from the transits engine. Include a \"How did this feel?\" journal note per transit. Display a calendar view of past and upcoming transits. Show a transit intensity graph over time. Include filters by planet and aspect type. Add a \"Major Transits This Year\" summary with the most impactful transits highlighted."}, {"id": "SUBS-01", "module": "subs", "title": "Module Layout and Dashboard Screen (Mobile)", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(subs)/_layout.tsx", "apps/mobile/app/(subs)/index.tsx"], "referenceLogic": ["modules/subs/src/definition.ts", "modules/subs/src/engines/cost-analysis.ts", "modules/subs/src/db/crud.ts", "modules/subs/src/types.ts"], "prompt": "Build the subs module mobile layout and dashboard screen. The layout should follow the tab navigation from the module definition: Dashboard, Subs, Calendar, Settings. The dashboard screen shows: total monthly subscription cost, cost trend (last 6 months), next upcoming renewal, most expensive subscription, and a cost breakdown by category (streaming, software, news, fitness, etc.) using the cost analysis engine. Include a large \"Monthly Total\" hero number with comparison to previous month. Add a \"Quick Add\" floating action button."}, {"id": "SUBS-02", "module": "subs", "title": "Subscription List Screen (Mobile)", "dependsOn": ["SUBS-01"], "filesToEdit": ["apps/mobile/app/(subs)/subscriptions.tsx"], "referenceLogic": ["modules/subs/src/db/crud.ts", "modules/subs/src/types.ts"], "prompt": "Build the subscription list screen. Show all tracked subscriptions in a scrollable list. Each subscription card shows: service name, icon/logo, price, billing frequency (monthly/annual/weekly), next billing date, and category badge. Include sort options (price, renewal date, name, category). Add swipe actions: edit, delete, pause. Include a filter by category and status (active/paused/cancelled). Display a total count and total monthly equivalent cost header. Add a search bar for finding subscriptions. Use Cool Obsidian surface cards with accent color borders."}, {"id": "SUBS-03", "module": "subs", "title": "Add Subscription Screen (Mobile)", "dependsOn": ["SUBS-01"], "filesToEdit": ["apps/mobile/app/(subs)/add-sub.tsx"], "referenceLogic": ["modules/subs/src/db/crud.ts", "modules/subs/src/types.ts"], "prompt": "Build the add subscription form screen. Show fields: service name (with autocomplete from catalog), price, billing frequency (weekly/monthly/quarterly/annual), start date, category (dropdown), payment method, and notes. Include a \"Detect from Bank\" link to SUBS-05's detection flow. Show a \"From Catalog\" picker with popular services pre-filled. Include a trial period toggle with trial end date. Add a custom icon/color picker. Validate all required fields with Zod. Save via CRUD's `insertSubscription`."}, {"id": "SUBS-04", "module": "subs", "title": "Subscription Calendar Screen (Mobile)", "dependsOn": ["SUBS-01"], "filesToEdit": ["apps/mobile/app/(subs)/calendar.tsx"], "referenceLogic": ["modules/subs/src/engines/renewal-calendar.ts", "modules/subs/src/db/crud.ts"], "prompt": "Build the subscription renewal calendar screen. Show a monthly calendar view with renewal dates marked with colored dots (one color per category). Tapping a day shows the subscriptions renewing that day with amounts. Use the renewal calendar engine for date calculations. Display a monthly total below the calendar. Show a list view alternative with upcoming renewals sorted by date. Include a \"This Month's Total\" summary. Add notification settings: how many days before renewal to alert. Show a year view heat map of spending intensity per month."}, {"id": "SUBS-05", "module": "subs", "title": "Bank Detection / Find Subscriptions Screen (Mobile)", "dependsOn": ["SUBS-01"], "filesToEdit": ["apps/mobile/app/(subs)/detect.tsx"], "referenceLogic": ["modules/subs/src/engines/bank-detection.ts", "modules/subs/src/db/detection.ts"], "prompt": "Build the subscription detection screen. Show a Plaid bank connection flow to scan transaction history for recurring charges. Display detected subscriptions with: merchant name, amount, frequency, last charge date, and confidence score. Each detected sub shows \"Add\" to confirm or \"Dismiss\" to ignore. Use the bank detection engine for pattern recognition. Show a detection progress indicator. Display dismissed payees (with \"Undismiss\" option). Include a manual refresh button. Show a \"New Detections\" section for charges detected since last visit."}, {"id": "SUBS-06", "module": "subs", "title": "Subscription Detail Screen (Mobile)", "dependsOn": ["SUBS-02"], "filesToEdit": ["apps/mobile/app/(subs)/[id].tsx"], "referenceLogic": ["modules/subs/src/db/crud.ts", "modules/subs/src/engines/price-comparison.ts", "modules/subs/src/engines/alternatives-catalog.ts"], "prompt": "Build the subscription detail screen. Show full subscription info: name, price, frequency, category, payment method, start date, total spent to date, and notes. Display a payment history timeline. Include a price history chart showing any price changes over time. Show alternative services from the alternatives catalog with price comparison from the price comparison engine. Add action buttons: Edit, Pause, Cancel (with cancellation assist link), and Share. Display a \"Worth It?\" score based on usage frequency if available."}, {"id": "SUBS-07", "module": "subs", "title": "Cost Report and Insights Screen (Mobile)", "dependsOn": ["SUBS-01"], "filesToEdit": ["apps/mobile/app/(subs)/cost-report.tsx"], "referenceLogic": ["modules/subs/src/engines/cost-analysis.ts"], "prompt": "Build a cost report screen. Show annual subscription spending with monthly breakdown chart. Display category spending pie chart. Use the cost analysis engine for: year-over-year comparison, projected annual cost, \"most expensive\" and \"longest held\" highlights. Include a \"potential savings\" section showing subscriptions with cheaper alternatives or unused subscriptions. Show a cost-per-day calculation for each subscription. Add an export option (CSV/PDF). Display a \"Subscription Creep\" metric showing how spending has grown over time."}, {"id": "SUBS-08", "module": "subs", "title": "Price Comparison Screen (Mobile)", "dependsOn": ["SUBS-06"], "filesToEdit": ["apps/mobile/app/(subs)/compare.tsx"], "referenceLogic": ["modules/subs/src/engines/price-comparison.ts", "modules/subs/src/engines/alternatives-catalog.ts"], "prompt": "Build a price comparison screen. Show the current subscription alongside alternatives from the catalog. Each alternative shows: name, price, features comparison, and savings if switched. Use the price comparison engine to calculate monthly/annual savings. Include a feature comparison table (checkmarks for features each service offers). Display user ratings from the catalog. Show a \"Switch\" action with cancellation link and sign-up link. Include a \"Compare Any Two\" selector for ad-hoc comparisons."}, {"id": "SUBS-09", "module": "subs", "title": "Settings Screen (Mobile)", "dependsOn": ["SUBS-01"], "filesToEdit": ["apps/mobile/app/(subs)/settings.tsx"], "referenceLogic": ["modules/subs/src/db/crud.ts", "modules/subs/src/types.ts"], "prompt": "Build the subs settings screen. Show: notification preferences (renewal reminders, price changes, new detections), default currency, budget limit with alert threshold, bank connection management (connected accounts, reconnect, disconnect), data export (CSV of all subscriptions), and category management (add/edit/delete custom categories). Include a \"Reset All Data\" danger zone. Display app version and storage usage."}, {"id": "SURF-01", "module": "surf", "title": "Forecast Narratives Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(surf)/spot/[id].tsx", "apps/web/app/surf/spot/[slug]/page.tsx"], "referenceLogic": ["modules/surf/src/cloud/forecasts.ts", "modules/surf/src/rating/rating.ts"], "prompt": "Enhance the spot detail screen with forecast narratives. Add a human-readable forecast summary paragraph below the raw data: \"Morning will see clean 4-6ft waves from the WNW with light offshore winds, dropping to 3-4ft by afternoon as winds shift onshore.\" Generate narratives from forecast data (swell height, period, direction, wind speed/direction, tide). Show a multi-day forecast timeline with a narrative per time block (dawn, morning, afternoon, evening). Include a \"Best Time to Go\" recommendation highlighting the optimal window."}, {"id": "SURF-02", "module": "surf", "title": "Spot Rating Breakdown Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(surf)/rating-detail.tsx", "apps/web/app/surf/spot/[slug]/rating/page.tsx"], "referenceLogic": ["modules/surf/src/rating/rating.ts", "modules/surf/src/rating/energy.ts", "modules/surf/src/rating/wind.ts", "modules/surf/src/rating/tide.ts"], "prompt": "Build a spot rating breakdown screen. Show the overall surf rating (1-10 or stars) decomposed into sub-ratings: swell quality (from energy engine), wind conditions (from wind engine), tide suitability (from tide engine), and crowd factor. Each sub-rating shows a gauge with explanation. Use the rating engine's scoring functions. Display how each factor contributes to the overall score. Show a \"Ideal Conditions\" reference panel for the specific spot. Include a historical rating chart showing rating trends over the past week."}, {"id": "SURF-03", "module": "surf", "title": "Alert Rule Builder Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(surf)/alerts.tsx", "apps/web/app/surf/alerts/page.tsx"], "referenceLogic": ["modules/surf/src/utils/alerts.ts", "modules/surf/src/cloud/alerts.ts"], "prompt": "Build a surf alert rule builder screen. Show a condition builder: spot selector, minimum wave height, maximum wind speed, preferred wind direction, tide range, minimum rating threshold, and time window (e.g., only morning alerts). Use the alerts utilities for condition evaluation. Display active alerts with their conditions summary and recent trigger history. Include notification channel preferences (push, email, SMS). Show a \"Test Alert\" that evaluates current conditions. Add template alerts: \"Epic Day\" (>6ft, offshore, good tide), \"Beginner Friendly\" (<3ft, light wind). Support multiple alerts per spot."}, {"id": "SURF-04", "module": "surf", "title": "Crew Management Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(surf)/crew.tsx", "apps/web/app/surf/crew/page.tsx"], "referenceLogic": ["modules/surf/src/cloud/social.ts", "modules/surf/src/cloud/community.ts"], "prompt": "Build a surf crew management screen. Show a friends/crew list with: name, avatar, home break, last session date, and current status (surfing/available/busy). Include an \"Add to Crew\" invite flow. Display a crew session planner: propose a session (spot, date/time) and see who's in. Show a crew activity feed of recent sessions. Include a chat thread per crew. Display crew statistics: total sessions together, favorite shared spots. Use the social and community cloud modules for crew data. Add a \"Session Check\" broadcast asking who's available."}, {"id": "SURF-05", "module": "surf", "title": "Wave Detection Integration", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(surf)/wave-detect.tsx", "apps/web/app/surf/waves/page.tsx"], "referenceLogic": ["modules/surf/src/utils/waves.ts", "modules/surf/src/rating/energy.ts"], "pr const MODULE_COLORS = {"mood": "#A78BFA", "budget": "#34D399", "books": "#C9894D", "fast": "#F97316", "recipes": "#FB923C", "workouts": "#EF4444", "car": "#60A5FA", "closet": "#F472B6", "cycle": "#EC4899", "flash": "#FBBF24", "garden": "#22C55E", "habits": "#8B5CF6", "health": "#14B8A6", "homes": "#6366F1", "journal": "#A3A3A3", "mail": "#3B82F6", "market": "#10B981", "meds": "#06B6D4", "notes": "#737373", "nutrition": "#84CC16", "pets": "#FB7185", "rsvp": "#D946EF", "stars": "#EAB308", "subs": "#F59E0B", "surf": "#0EA5E9", "trails": "#059669", "voice": "#7C3AED", "words": "#E879F9"};

const MODULE_ICONS = {"mood": "\ud83c\udfad", "budget": "\ud83d\udcb0", "books": "\ud83d\udcda", "fast": "\u23f1\ufe0f", "recipes": "\ud83c\udf73", "workouts": "\ud83d\udcaa", "car": "\ud83d\ude97", "closet": "\ud83d\udc54", "cycle": "\ud83e\ude78", "flash": "\u26a1", "garden": "\ud83c\udf31", "habits": "\u2705", "health": "\u2764\ufe0f", "homes": "\ud83c\udfe0", "journal": "\ud83d\udcdd", "mail": "\ud83d\udcec", "market": "\ud83d\udcc8", "meds": "\ud83d\udc8a", "notes": "\ud83d\udcd2", "nutrition": "\ud83e\udd57", "pets": "\ud83d\udc3e", "rsvp": "\ud83c\udf89", "stars": "\u2b50", "subs": "\ud83d\udcb3", "surf": "\ud83c\udfc4", "trails": "\ud83e\udd7e", "voice": "\ud83c\udf99\ufe0f", "words": "\u270d\ufe0f"};

// ── State ──
const STORAGE_KEY = 'mylife-mission-control';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();
// state shape: { taskStatuses: { "MOOD-01": "done"|"active"|"pending", ... }, collapsed: { "mood": true, ... } }
if (!state.taskStatuses) state.taskStatuses = {};
if (!state.collapsed) state.collapsed = {};

function getTaskStatus(taskId) {
  const explicit = state.taskStatuses[taskId];
  if (explicit) return explicit;
  // Check if blocked
  const task = TASKS.find(t => t.id === taskId);
  if (task && task.dependsOn.length > 0) {
    const allDepsDone = task.dependsOn.every(dep => state.taskStatuses[dep] === 'done');
    if (!allDepsDone) return 'blocked';
  }
  return 'pending';
}

function setTaskStatus(taskId, status) {
  if (status === 'pending') {
    delete state.taskStatuses[taskId];
  } else {
    state.taskStatuses[taskId] = status;
  }
  saveState(state);
  render();
}

// ── Helpers ──
function getModules() {
  const map = new Map();
  TASKS.forEach(t => {
    if (!map.has(t.module)) map.set(t.module, []);
    map.get(t.module).push(t);
  });
  return map;
}

function getModuleStats(moduleTasks) {
  let done = 0, active = 0, blocked = 0, pending = 0;
  moduleTasks.forEach(t => {
    const s = getTaskStatus(t.id);
    if (s === 'done') done++;
    else if (s === 'active') active++;
    else if (s === 'blocked') blocked++;
    else pending++;
  });
  return { done, active, blocked, pending, total: moduleTasks.length };
}

function getGlobalStats() {
  let done = 0, active = 0, blocked = 0, pending = 0;
  TASKS.forEach(t => {
    const s = getTaskStatus(t.id);
    if (s === 'done') done++;
    else if (s === 'active') active++;
    else if (s === 'blocked') blocked++;
    else pending++;
  });
  return { done, active, blocked, pending, total: TASKS.length };
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function highlightCode(text) {
  return escapeHtml(text).replace(/`([^`]+)`/g, '<code>$1</code>');
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ── Filters ──
let currentFilter = { search: '', module: 'all', status: 'all', sort: 'module' };

function getFilteredTasks() {
  let tasks = [...TASKS];

  // Search
  if (currentFilter.search) {
    const q = currentFilter.search.toLowerCase();
    tasks = tasks.filter(t =>
      t.id.toLowerCase().includes(q) ||
      t.title.toLowerCase().includes(q)
    );
  }

  // Module
  if (currentFilter.module !== 'all') {
    tasks = tasks.filter(t => t.module === currentFilter.module);
  }

  // Status
  if (currentFilter.status !== 'all') {
    tasks = tasks.filter(t => getTaskStatus(t.id) === currentFilter.status);
  }

  // Sort
  if (currentFilter.sort === 'id') {
    tasks.sort((a, b) => a.id.localeCompare(b.id));
  } else if (currentFilter.sort === 'deps') {
    tasks.sort((a, b) => b.dependsOn.length - a.dependsOn.length);
  } else if (currentFilter.sort === 'status') {
    const order = { active: 0, pending: 1, blocked: 2, done: 3 };
    tasks.sort((a, b) => (order[getTaskStatus(a.id)] ?? 1) - (order[getTaskStatus(b.id)] ?? 1));
  }

  return tasks;
}

// ── Rendering ──

function renderModuleGrid() {
  const grid = document.getElementById('module-grid');
  const modules = getModules();
  let html = '';

  const sortedModules = [...modules.entries()].sort((a, b) => b[1].length - a[1].length);

  sortedModules.forEach(([mod, tasks]) => {
    const stats = getModuleStats(tasks);
    const pct = stats.total > 0 ? Math.round((stats.done / stats.total) * 100) : 0;
    const color = MODULE_COLORS[mod] || '#666';
    const icon = MODULE_ICONS[mod] || '📦';
    const isActive = currentFilter.module === mod;

    html += `
      <div class="module-card ${isActive ? 'active' : ''}" style="--mod-color: ${color}" onclick="filterByModule('${mod}')"
           title="${mod}: ${stats.done}/${stats.total} done">
        <div style="position:absolute;top:0;left:0;width:3px;height:100%;background:${color};border-radius:3px 0 0 3px;"></div>
        <div class="module-top">
          <div class="module-name"><span class="module-icon">${icon}</span>${mod}</div>
          <div class="module-count">${stats.total}</div>
        </div>
        <div class="module-progress">
          <div class="module-progress-bar" style="width:${pct}%;background:${color}"></div>
        </div>
        <div class="module-stats">
          <span>${stats.done}/${stats.total}</span>
          <span>${pct}%</span>
        </div>
      </div>
    `;
  });

  grid.innerHTML = html;
}

function renderModuleFilter() {
  const select = document.getElementById('module-filter');
  const modules = getModules();
  const sortedModules = [...modules.keys()].sort();
  let opts = '<option value="all">All Modules</option>';
  sortedModules.forEach(mod => {
    const icon = MODULE_ICONS[mod] || '';
    opts += `<option value="${mod}" ${currentFilter.module === mod ? 'selected' : ''}>${icon} ${mod} (${modules.get(mod).length})</option>`;
  });
  select.innerHTML = opts;
}

function renderTaskBoard() {
  const board = document.getElementById('task-board');
  const filtered = getFilteredTasks();

  // Update result count
  document.getElementById('result-count').textContent = `${filtered.length} of ${TASKS.length} tasks`;

  // Group by module
  const grouped = new Map();
  filtered.forEach(t => {
    if (!grouped.has(t.module)) grouped.set(t.module, []);
    grouped.get(t.module).push(t);
  });

  if (filtered.length === 0) {
    board.innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:var(--text-ter);">
        <div style="font-size:48px;margin-bottom:12px;">&#128269;</div>
        <div style="font-size:16px;font-weight:600;">No tasks match your filters</div>
        <div style="font-size:13px;margin-top:4px;">Try adjusting your search or filter criteria</div>
      </div>
    `;
    return;
  }

  let html = '';

  // Determine sort order for sections
  let sortedModules;
  if (currentFilter.sort === 'module') {
    sortedModules = [...grouped.entries()].sort((a, b) => b[1].length - a[1].length);
  } else {
    sortedModules = [...grouped.entries()];
  }

  sortedModules.forEach(([mod, tasks]) => {
    const stats = getModuleStats(TASKS.filter(t => t.module === mod));
    const pct = stats.total > 0 ? Math.round((stats.done / stats.total) * 100) : 0;
    const color = MODULE_COLORS[mod] || '#666';
    const icon = MODULE_ICONS[mod] || '📦';
    const collapsed = state.collapsed[mod];

    html += `
      <div class="module-section ${collapsed ? 'collapsed' : ''}" data-module="${mod}">
        <div class="module-section-header" onclick="toggleSection('${mod}')">
          <div class="module-section-left">
            <span class="module-section-icon">${icon}</span>
            <span class="module-section-name">${mod}</span>
            <span class="module-section-badge">${stats.done} / ${stats.total}</span>
          </div>
          <div class="module-section-right">
            <div class="module-section-progress">
              <div class="module-section-progress-bar" style="width:${pct}%;background:${color}"></div>
            </div>
            <span class="chevron">&#9660;</span>
          </div>
        </div>
        <div class="task-grid">
    `;

    tasks.forEach(t => {
      const status = getTaskStatus(t.id);
      const statusClass = status === 'active' ? 'active-status' : status;

      let depsHtml = '';
      if (t.dependsOn.length > 0) {
        depsHtml = t.dependsOn.map(dep => {
          const depStatus = getTaskStatus(dep);
          const depClass = depStatus === 'done' ? 'dep-done' : (depStatus === 'blocked' || depStatus === 'pending' ? 'dep-blocked' : '');
          return `<span class="task-dep ${depClass}">${dep}</span>`;
        }).join('');
      }

      const filesPreview = t.filesToEdit.length > 0 ? t.filesToEdit[0].split('/').pop() + (t.filesToEdit.length > 1 ? ` +${t.filesToEdit.length - 1}` : '') : '';

      html += `
        <div class="task ${statusClass}" onclick="openTask('${t.id}')" data-task-id="${t.id}">
          <div class="task-top">
            <span class="task-id">${t.id}</span>
            <span class="status-dot ${status}" title="${status}"></span>
          </div>
          <div class="task-title">${escapeHtml(t.title)}</div>
          <div class="task-meta">${depsHtml}</div>
          ${filesPreview ? `<div class="task-files">${escapeHtml(filesPreview)}</div>` : ''}
        </div>
      `;
    });

    html += '</div></div>';
  });

  board.innerHTML = html;
}

function renderHeader() {
  const stats = getGlobalStats();
  document.getElementById('done-count').textContent = stats.done;
  document.getElementById('active-count').textContent = stats.active;

  const pct = Math.round((stats.done / stats.total) * 100);
  document.getElementById('global-progress').style.width = pct + '%';

  const remaining = (stats.total - stats.done) * 0.5;
  document.getElementById('progress-text').textContent =
    `${pct}% complete -- ~${remaining.toFixed(1)} hours remaining (${stats.total - stats.done} tasks)`;
}

function renderFooter() {
  const stats = getGlobalStats();
  const modules = getModules();
  const remaining = (stats.total - stats.done) * 0.5;

  // Module leaderboard
  const leaderboard = [...modules.entries()]
    .map(([mod, tasks]) => {
      const s = getModuleStats(tasks);
      return { mod, ...s, pct: s.total > 0 ? Math.round((s.done / s.total) * 100) : 0 };
    })
    .sort((a, b) => b.pct - a.pct || b.done - a.done);

  let lbHtml = '';
  leaderboard.slice(0, 10).forEach((item, i) => {
    const color = MODULE_COLORS[item.mod] || '#666';
    const icon = MODULE_ICONS[item.mod] || '📦';
    lbHtml += `
      <div class="leaderboard-item">
        <div class="leaderboard-rank">${i + 1}</div>
        <div class="leaderboard-name">${icon} ${item.mod}</div>
        <div class="leaderboard-bar-wrap">
          <div class="leaderboard-bar" style="width:${item.pct}%;background:${color}"></div>
        </div>
        <div class="leaderboard-pct">${item.pct}%</div>
      </div>
    `;
  });

  document.getElementById('footer-stats').innerHTML = `
    <div class="footer-card">
      <h3>Status Breakdown</h3>
      <div class="footer-stat-row">
        <div class="label"><span class="status-dot pending" style="display:inline-block"></span> Pending</div>
        <div class="value">${stats.pending}</div>
      </div>
      <div class="footer-stat-row">
        <div class="label"><span class="status-dot active" style="display:inline-block"></span> Active</div>
        <div class="value">${stats.active}</div>
      </div>
      <div class="footer-stat-row">
        <div class="label"><span class="status-dot done" style="display:inline-block"></span> Done</div>
        <div class="value">${stats.done}</div>
      </div>
      <div class="footer-stat-row">
        <div class="label"><span class="status-dot blocked" style="display:inline-block"></span> Blocked</div>
        <div class="value">${stats.blocked}</div>
      </div>
    </div>
    <div class="footer-card">
      <h3>Time Estimates</h3>
      <div class="footer-stat-row">
        <div class="label">Remaining Tasks</div>
        <div class="value">${stats.total - stats.done}</div>
      </div>
      <div class="footer-stat-row">
        <div class="label">Est. Time Remaining</div>
        <div class="value">${remaining.toFixed(1)}h</div>
      </div>
      <div class="footer-stat-row">
        <div class="label">Est. Days (8h/day)</div>
        <div class="value">${Math.ceil(remaining / 8)} days</div>
      </div>
      <div class="footer-stat-row">
        <div class="label">Time Per Task</div>
        <div class="value">~30 min</div>
      </div>
    </div>
    <div class="footer-card">
      <h3>Module Leaderboard</h3>
      ${lbHtml}
    </div>
  `;
}

// ── Modal ──
function openTask(taskId) {
  const task = TASKS.find(t => t.id === taskId);
  if (!task) return;
  const status = getTaskStatus(taskId);
  const color = MODULE_COLORS[task.module] || '#666';

  document.getElementById('modal-task-id').innerHTML =
    `<span style="color:${color}">${task.module.toUpperCase()}</span> &middot; ${task.id}`;
  document.getElementById('modal-task-title').textContent = task.title;

  // Body
  let bodyHtml = '';

  // Status
  bodyHtml += `
    <div class="modal-section">
      <div class="modal-section-title">Status</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="status-dot ${status}"></span>
        <span style="font-weight:600;text-transform:capitalize;">${status}</span>
      </div>
    </div>
  `;

  // Dependencies
  if (task.dependsOn.length > 0) {
    bodyHtml += `
      <div class="modal-section">
        <div class="modal-section-title">Dependencies</div>
        <div class="modal-dep-list">
          ${task.dependsOn.map(dep => {
            const ds = getTaskStatus(dep);
            return `<div class="modal-dep"><span class="status-dot ${ds}"></span>${dep}</div>`;
          }).join('')}
        </div>
      </div>
    `;
  }

  // Files
  if (task.filesToEdit.length > 0) {
    bodyHtml += `
      <div class="modal-section">
        <div class="modal-section-title">Files to Create/Edit</div>
        <ul class="modal-file-list">
          ${task.filesToEdit.map(f => `<li>${escapeHtml(f)}</li>`).join('')}
        </ul>
      </div>
    `;
  }

  // Reference Logic
  if (task.referenceLogic.length > 0) {
    bodyHtml += `
      <div class="modal-section">
        <div class="modal-section-title">Reference Logic</div>
        <ul class="modal-file-list">
          ${task.referenceLogic.map(f => `<li>${escapeHtml(f)}</li>`).join('')}
        </ul>
      </div>
    `;
  }

  // Prompt (hidden, just copy button)


  document.getElementById('modal-body').innerHTML = bodyHtml;

  // Footer
  const footerHtml = `
    <button class="btn btn-copy" id="copy-prompt-btn" onclick="copyPrompt('${taskId}')">
      &#128203; Copy Prompt
    </button>
    <div class="status-btns">
      ${status !== 'pending' ? `<button class="btn" onclick="setTaskStatus('${taskId}','pending');openTask('${taskId}')">Pending</button>` : ''}
      ${status !== 'active' ? `<button class="btn btn-accent" onclick="setTaskStatus('${taskId}','active');openTask('${taskId}')">&#9654; Active</button>` : ''}
      ${status !== 'done' ? `<button class="btn btn-success" onclick="setTaskStatus('${taskId}','done');openTask('${taskId}')">&#10003; Done</button>` : ''}
    </div>
  `;
  document.getElementById('modal-footer').innerHTML = footerHtml;

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function copyPrompt(taskId) {
  const task = TASKS.find(t => t.id === taskId);
  if (!task || !task.prompt) return;
  navigator.clipboard.writeText(task.prompt).then(() => {
    const btn = document.getElementById('copy-prompt-btn');
    btn.classList.add('copied');
    btn.innerHTML = '&#10003; Copied!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '&#128203; Copy Prompt';
    }, 2000);
    showToast('Prompt copied to clipboard');
  });
}

// ── Interactions ──
function filterByModule(mod) {
  if (currentFilter.module === mod) {
    currentFilter.module = 'all';
  } else {
    currentFilter.module = mod;
  }
  document.getElementById('module-filter').value = currentFilter.module;
  render();
  document.getElementById('task-board').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function toggleSection(mod) {
  state.collapsed[mod] = !state.collapsed[mod];
  saveState(state);
  const section = document.querySelector(`.module-section[data-module="${mod}"]`);
  if (section) section.classList.toggle('collapsed');
}

// ── Event Listeners ──
document.getElementById('search-input').addEventListener('input', function(e) {
  currentFilter.search = e.target.value;
  renderTaskBoard();
});

document.getElementById('module-filter').addEventListener('change', function(e) {
  currentFilter.module = e.target.value;
  render();
});

document.getElementById('sort-select').addEventListener('change', function(e) {
  currentFilter.sort = e.target.value;
  renderTaskBoard();
});

document.getElementById('status-filters').addEventListener('click', function(e) {
  const pill = e.target.closest('.pill');
  if (!pill) return;
  document.querySelectorAll('#status-filters .pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  currentFilter.status = pill.dataset.status;
  renderTaskBoard();
});

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.getElementById('modal-close').addEventListener('click', closeModal);

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

// ── Master Render ──
function render() {
  renderHeader();
  renderModuleGrid();
  renderModuleFilter();
  renderTaskBoard();
  renderFooter();
}

// Boot
render();
</script>
</body>
</html>
