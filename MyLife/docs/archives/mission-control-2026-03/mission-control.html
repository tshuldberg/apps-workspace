stion()` that calls `getBestToTrain`. Create `apps/web/app/workouts/recovery/page.tsx` rendering: (1) a body outline SVG (front and back views) where each muscle group is colored by recovery score (green=fresh 80-100, yellow=recovering 50-79, red=fatigued 0-49), (2) a legend showing the three states, (3) a list of all 13 muscle groups with score, status, hours since last trained, hours until recovered, volume last session, and frequency in last 7 days, (4) a \"What to train today\" suggestion card from `getBestToTrain` showing recommended split type and which muscles are fresh. Use `buildHighlightData` to map muscle groups to SVG regions."}, {"id": "WORKOUTS-04", "module": "workouts", "title": "Workout Intelligence Insight Cards", "dependsOn": [], "filesToEdit": ["apps/web/app/workouts/actions.ts", "apps/web/app/workouts/page.tsx"], "referenceLogic": ["modules/workouts/src/intelligence/insight.ts", "modules/workouts/src/intelligence/data-bridge.ts", "modules/workouts/src/intelligence/types.ts"], "prompt": "Add server action `fetchWorkoutInsights()` that uses the data bridge to gather the last 14 days of workout, mood, nutrition, and fasting data, then calls `generateWorkoutInsights`. Return the array of `WorkoutInsight[]`. Edit `apps/web/app/workouts/page.tsx` to add an \"Insights\" section below the dashboard stats. Render each insight as a glass card with: severity icon (green checkmark for positive, yellow info for neutral, red alert for negative), title, body text, metric badge, and recommendation. Cap display at 4 insights (show \"See all\" if more). Insights with cross-module data (mood, fasting, nutrition) get a subtle \"Cross-module\" badge. Cards should be dismissible (hide for the session, not persisted)."}, {"id": "WORKOUTS-05", "module": "workouts", "title": "GPS Activity Tracking -- Route Recording", "dependsOn": [], "filesToEdit": ["apps/web/app/workouts/actions.ts", "apps/web/app/workouts/gps/page.tsx", "apps/web/app/workouts/layout.tsx"], "referenceLogic": ["modules/workouts/src/gps/metrics.ts", "modules/workouts/src/types.ts", "modules/workouts/src/db/crud.ts"], "prompt": "Add server actions for GPS: `doStartGpsRoute(activityType, name?)`, `doAddGpsPoints(routeId, points[])`, `doCompleteGpsRoute(routeId)` that computes metrics (distance, pace, speed, elevation, calories) from points using the metrics engine and updates the route record, `fetchGpsRoutes(limit?)`, `fetchGpsRouteWithPoints(routeId)`. Create `apps/web/app/workouts/gps/page.tsx` with: (1) activity type selector (run/cycle/hike/walk/other), (2) a \"Start\" button that uses the Geolocation API to begin watching position, recording points at ~1s interval, (3) live stats panel showing distance, duration, current pace, (4) \"Pause\" / \"Resume\" / \"Stop\" controls (pause increments segment counter), (5) on stop, compute final metrics and save. Add a route history list showing past routes with date, activity type, distance, duration, pace. Note: map display is deferred to a separate task; this task focuses on recording + metrics."}, {"id": "WORKOUTS-06", "module": "workouts", "title": "AI Workout Generation", "dependsOn": [], "filesToEdit": ["apps/web/app/workouts/generate/page.tsx", "apps/web/app/workouts/actions.ts", "apps/web/app/workouts/layout.tsx"], "referenceLogic": ["modules/workouts/src/ai/generator.ts", "modules/workouts/src/db/crud.ts", "modules/workouts/src/types.ts"], "prompt": "Add server actions: `doGenerateWorkout(request: GenerationRequest)` that fetches all exercises from the library, gets recently used exercise IDs from the last 5 sessions, and calls `generateLocalWorkout`; `doSaveGeneratedWorkout(workout)` that creates a new workout definition from the generated result. Create `apps/web/app/workouts/generate/page.tsx` with a multi-step form: Step 1 -- Goal (strength/hypertrophy/endurance/general as cards), Step 2 -- Muscle focus (multi-select from MUSCLE_GROUPS with body map visual), Step 3 -- Equipment (checkboxes: barbell, dumbbells, cables, machines, bodyweight, bands, kettlebell), Step 4 -- Duration (15/30/45/60/75/90 min slider) + Difficulty (beginner/intermediate/advanced). On submit, call the action and show the generated workout preview: exercise list with sets/reps/rest, estimated duration, title. \"Save & Start\" button saves the workout and navigates to session. \"Regenerate\" button creates a new variation."}, {"id": "WORKOUTS-07", "module": "workouts", "title": "1RM Calculator + History Screen", "dependsOn": [], "filesToEdit": ["apps/web/app/workouts/calculator/page.tsx", "apps/web/app/workouts/actions.ts", "apps/web/app/workouts/layout.tsx"], "referenceLogic": ["modules/workouts/src/workout/oneRM.ts", "modules/workouts/src/db/crud.ts", "modules/workouts/src/types.ts"], "prompt": "Add server actions: `fetch1RMHistory(exerciseId)`, `fetchLatest1RM(exerciseId)`, `doRecord1RM(input)`, `fetchAllExercises()`. Create `apps/web/app/workouts/calculator/page.tsx` with: (1) a 1RM calculator form -- exercise dropdown, weight input, reps input, formula toggle (Epley/Brzycki) -- showing the calculated 1RM in real-time as the user types, plus a percentage table (95%/90%/85%/.../50% of 1RM), (2) a \"Save\" button that records the 1RM to history, (3) a trend chart (SVG line) showing 1RM history over time for the selected exercise, (4) exercise picker that shows latest 1RM for each exercise in the dropdown. Style with Cool Obsidian. The calculator should show both Epley and Brzycki side by side for comparison."}, {"id": "WORKOUTS-08", "module": "workouts", "title": "Body Measurements Screen", "dependsOn": [], "filesToEdit": ["apps/web/app/workouts/measurements/page.tsx", "apps/web/app/workouts/actions.ts", "apps/web/app/workouts/layout.tsx"], "referenceLogic": ["modules/workouts/src/db/crud.ts", "modules/workouts/src/types.ts"], "prompt": "Add server actions: `fetchBodyMeasurements(type?, days?)`, `doCreateBodyMeasurement(input)`, `doDeleteBodyMeasurement(id)`. Create `apps/web/app/workouts/measurements/page.tsx` with: (1) measurement type tabs (weight, body_fat, chest, waist, hips, arms, thighs, neck), (2) an entry form per type (value input, unit selector, date picker), (3) a trend chart (SVG line) for the selected type showing last 30/60/90 days, (4) a data table below showing all entries for the type (date, value, unit, delete button), (5) a summary card showing latest value, change over 30 days (with green/red arrow), min/max in the period. Style with Cool Obsidian glass cards and `var(--accent-workouts)`."}, {"id": "WORKOUTS-09", "module": "workouts", "title": "Workout Plans + Periodization", "dependsOn": [], "filesToEdit": ["apps/web/app/workouts/plans/page.tsx", "apps/web/app/workouts/plans/[id]/page.tsx", "apps/web/app/workouts/actions.ts", "apps/web/app/workouts/layout.tsx"], "referenceLogic": ["modules/workouts/src/db/crud.ts", "modules/workouts/src/workout/plan-helpers.ts", "modules/workouts/src/types.ts"], "prompt": "Add server actions for plan CRUD, subscription, and progress. Create `apps/web/app/workouts/plans/page.tsx` listing all plans as cards (title, description, weeks, sessions/week) with \"Subscribe\" / \"Unsubscribe\" buttons and a \"New Plan\" button. Create `apps/web/app/workouts/plans/[id]/page.tsx` with: (1) plan header (title, description, edit/delete), (2) a weekly calendar view -- for each week, show 7 day columns with workout assignments or \"Rest\" markers, (3) plan builder UI: click a day cell to assign an existing workout from a dropdown or mark as rest, (4) progress bar showing completed vs total plan days via `getPlanProgress`, (5) \"Today's Workout\" highlight card using `getTodaysWorkout` with a \"Start Session\" button. The plan builder serializes weeks as JSON via the `weeksJson` field."}, {"id": "WORKOUTS-10", "module": "workouts", "title": "Progress Photos", "dependsOn": [], "filesToEdit": ["apps/web/app/workouts/photos/page.tsx", "apps/web/app/workouts/actions.ts", "apps/web/app/workouts/layout.tsx"], "referenceLogic": ["modules/workouts/src/db/crud.ts", "modules/workouts/src/types.ts"], "prompt": "Add server actions: `fetchProgressPhotos(viewType?, limit?)`, `doUploadProgressPhoto(input)`, `doDeleteProgressPhoto(id)`. Create `apps/web/app/workouts/photos/page.tsx` with: (1) view type filter tabs (front/side_left/side_right/back), (2) upload area with file picker, view type selector, optional notes, date picker, (3) photo gallery grid showing thumbnails sorted by date, (4) click a photo to open a lightbox, (5) \"Compare\" mode -- select two photos and display them side-by-side with date labels for before/after comparison. Store photos as local file URIs (web can use base64 data URLs or object URLs). On mobile, use `expo-image-picker`. Show total photo count and date range in the header. Privacy note: \"Photos are stored locally and never uploaded.\""}, {"id": "WORKOUTS-11", "module": "workouts", "title": "Plate Loading Calculator Screen", "dependsOn": [], "filesToEdit": ["apps/web/app/workouts/calculator/page.tsx"], "referenceLogic": ["modules/workouts/src/workout/plates.ts", "modules/workouts/src/types.ts"], "prompt": "Edit `apps/web/app/workouts/calculator/page.tsx` to add a \"Plates\" tab alongside the 1RM calculator (or create it if WORKOUTS-07 hasn't been done yet). The plate calculator shows: (1) target weight input, (2) bar weight selector (Standard 45lb, Women's 35lb, EZ Curl 15lb from `BAR_PRESETS`), (3) unit toggle (lbs/kg), (4) the plate diagram -- a horizontal barbell SVG with plates rendered per side using `PLATE_COLORS` for each plate weight, proportionally sized (45lb plates are largest, 2.5lb smallest), (5) a text summary: \"Per side: 1x45, 1x25, 1x10 = 225 lbs total\", (6) remainder warning if the target can't be exactly hit (\"Closest loadable: 222.5 lbs, 2.5 lbs short\"). Call `calculatePlates` on every input change for real-time updates. The visual barbell diagram is the key UX element."}, {"id": "WORKOUTS-12", "module": "workouts", "title": "Social Sharing -- Post-Workout Summary Card", "dependsOn": [], "filesToEdit": ["apps/web/app/workouts/session/page.tsx", "apps/web/app/workouts/actions.ts"], "referenceLogic": ["modules/workouts/src/social/privacy.ts", "modules/workouts/src/types.ts", "modules/workouts/src/db/crud.ts"], "prompt": "Add server action `buildSessionSummaryCard(sessionId)` that queries the completed session, its set weights, exercise details, and builds a `WorkoutSummaryCard` (title, date, duration, exercise count, total sets/reps/volume, PRs hit, muscle groups). Add `doShareWorkout(sessionId, privacySettings)` that applies `applyPrivacyFilter` and returns the filtered card. Edit the session page: after completing a workout, show a \"Workout Complete\" modal with the summary card (animated entrance). The card displays: title, date, duration, exercise count, total volume, any new PRs (highlighted), muscle groups trained. Below the card, show privacy toggles (share title, exercises, weight details, PRs, duration) from `DEFAULT_SOCIAL_PRIVACY`. \"Share\" button copies a text summary to clipboard or triggers the Web Share API. \"Done\" dismisses. Style the summary card as a dark gradient card suitable for screenshot sharing."}, {"id": "CAR-01", "module": "car", "title": "OBD-II Diagnostics Dashboard Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(car)/diagnostics.tsx", "apps/web/app/car/diagnostics/page.tsx"], "referenceLogic": ["modules/car/src/engines/obd-engine.ts", "modules/car/src/engines/dtc-database.ts", "modules/car/src/db/diagnostics.ts", "modules/car/src/types.ts"], "prompt": "Build the OBD-II diagnostics screen showing a list of past diagnostic snapshots per vehicle, with a \"New Scan\" button. Each snapshot row shows date, vehicle name, code count, and severity badge (green/yellow/red). Tapping a snapshot navigates to CAR-02's detail. Use `getDiagnosticSnapshots` from `db/diagnostics.ts` and `classifySnapshotSeverity` from `obd-engine.ts`. Apply Cool Obsidian tokens: surface cards, glassBorder, danger/success for severity. Wrap web server actions in try/catch/finally per the web error handling rule."}, {"id": "CAR-02", "module": "car", "title": "OBD-II Diagnostic Snapshot Detail Screen", "dependsOn": ["CAR-01"], "filesToEdit": ["apps/mobile/app/(car)/diagnostics/[id].tsx", "apps/web/app/car/diagnostics/[id]/page.tsx"], "referenceLogic": ["modules/car/src/engines/obd-engine.ts", "modules/car/src/engines/dtc-database.ts", "modules/car/src/db/diagnostics.ts"], "prompt": "Build the snapshot detail screen. Show snapshot metadata (date, protocol, VIN). List each DiagnosticCode with its code string, system (engine/transmission/body/chassis), severity icon, and human-readable description from `lookupDTC` in `dtc-database.ts`. Include a section for live data readings at scan time from `getLiveDataForSnapshot`. Use colored severity badges: P0xxx=engine, B0xxx=body, etc. Add a \"Clear Codes\" action button. Cool Obsidian surfaceElevated cards per code group."}, {"id": "CAR-03", "module": "car", "title": "OBD-II Live Data Dashboard", "dependsOn": ["CAR-01"], "filesToEdit": ["apps/mobile/app/(car)/live-data.tsx", "apps/web/app/car/live-data/page.tsx"], "referenceLogic": ["modules/car/src/engines/obd-engine.ts", "modules/car/src/db/diagnostics.ts"], "prompt": "Build a real-time OBD-II live data dashboard. Show gauge-style visualizations for key PIDs: RPM, coolant temp, speed, MAF, throttle position, fuel system status. Use `parsePIDResponse` and `ELM327_COMMANDS` from `obd-engine.ts`. On mobile, use animated circular gauges. On web, use SVG gauge components. Include a \"Start Recording\" toggle that logs readings to `cr_live_data_logs` via `insertLiveDataLog`. Display last-updated timestamp per reading."}, {"id": "CAR-04", "module": "car", "title": "VIN Decoder Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(car)/vin-decoder.tsx", "apps/web/app/car/vin-decoder/page.tsx"], "referenceLogic": ["modules/car/src/engines/vin-engine.ts", "modules/car/src/db/recalls.ts"], "prompt": "Build a VIN decoder screen. Show a VIN input field with real-time validation using `isValidVIN` and `validateCheckDigit` from `vin-engine.ts`. On decode, display parsed vehicle attributes (year, make, model, engine, plant) from `decodeVINResponse`. Below the decode results, show a \"Check Recalls\" section that calls `parseRecallResponse` and lists any NHTSA recalls. Include a \"Save to Vehicle\" button that auto-fills the vehicle's VIN field. Handle the offline case by showing only VIN validation without NHTSA data."}, {"id": "CAR-05", "module": "car", "title": "GPS Trip Dashboard and Map View", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(car)/gps-dashboard.tsx", "apps/web/app/car/gps/page.tsx"], "referenceLogic": ["modules/car/src/engines/gps-engine.ts", "modules/car/src/db/gps-trips.ts"], "prompt": "Build a GPS trip dashboard. Show a list of recorded GPS trips with distance (from `calculateTripDistance`), duration, start/end addresses, and average speed. Include a map view using Mapbox (mobile: `@rnmapbox/maps`, web: `mapbox-gl`) that renders the trip polyline from `decodePolyline`. Add a \"Start Trip\" floating action button that begins GPS recording. Show monthly distance summary and most-traveled routes. Use `filterDriftPoints` to clean displayed paths."}, {"id": "CAR-06", "module": "car", "title": "Tire Scheduler and Health Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(car)/tires.tsx", "apps/web/app/car/tires/page.tsx"], "referenceLogic": ["modules/car/src/engines/tire-engine.ts", "modules/car/src/db/tires.ts"], "prompt": "Build the tire management screen. Show each tire set with brand, size, and a tread health score badge from `scoreTreadHealth` in `tire-engine.ts`. Display a 4-corner diagram (FL/FR/RL/RR) with tread depth color coding (green >5mm, yellow 3-5mm, red <3mm). Show the next rotation date from `nextRotationDate` and wear rate prediction from `predictWearRate`. Include buttons to \"Log Measurement\" (opens a form for 4 tread depths) and \"Log Rotation\". List rotation history."}, {"id": "CAR-07", "module": "car", "title": "Registration and Insurance Alerts Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(car)/documents.tsx", "apps/web/app/car/documents/page.tsx"], "referenceLogic": ["modules/car/src/engines/insurance-engine.ts", "modules/car/src/engines/registration-engine.ts", "modules/car/src/db/insurance.ts", "modules/car/src/db/registrations.ts"], "prompt": "Build a combined documents/alerts screen. Show two sections: Insurance and Registration. Each policy/registration card shows expiration status from `getExpirationStatus` (valid/expiring-soon/expired), next due date, and cost summary. Insurance cards show `annualizePremium` value and masked policy number via `maskPolicyNumber`. Registration cards show inspection type and last inspection date. Add red/yellow/green status indicators. Include \"Add Policy\" and \"Add Registration\" action buttons linking to existing add forms."}, {"id": "CAR-08", "module": "car", "title": "Parking History Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(car)/parking-history.tsx", "apps/web/app/car/parking/page.tsx"], "referenceLogic": ["modules/car/src/engines/parking-engine.ts", "modules/car/src/db/parking.ts"], "prompt": "Build a parking history screen. Show a list of saved parking locations sorted by recency. Each card shows address, date/time parked, meter status from `getMeterStatus` (active countdown/expired/no-meter), and a mini map thumbnail. Include a \"Park Here\" button that saves current location. Show walking time estimate from `estimateWalkingTime`. Stale locations (>24h) get a dimmed style via `isStaleLocation`. Add a full-screen map view toggle showing all parking pins."}, {"id": "CAR-09", "module": "car", "title": "Trip Cost Analytics Dashboard", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(car)/cost-analytics.tsx", "apps/web/app/car/costs/page.tsx"], "referenceLogic": ["modules/car/src/engines/cost-engine.ts", "modules/car/src/engines/trip-engine.ts"], "prompt": "Build the trip cost analytics dashboard. Show cost-per-mile from `computeCostPerMile`, monthly expense breakdown by category (fuel/maintenance/insurance/registration) from `getMonthlyBreakdown`, and a 12-month trend chart. Include IRS mileage deduction estimate from `estimateIRSDeduction` in `trip-engine.ts`. Show trip purpose pie chart (personal/commute/business/medical). Display total annual ownership cost projection. Use bar charts for monthly trends and donut chart for category breakdown."}, {"id": "CAR-10", "module": "car", "title": "Fuel Price Tracking Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(car)/fuel-prices.tsx", "apps/web/app/car/fuel-prices/page.tsx"], "referenceLogic": ["modules/car/src/engines/fuel-price-engine.ts", "modules/car/src/db/crud.ts"], "prompt": "Build a fuel price tracking screen. Show the user's recent fuel fill-ups with per-gallon price, total cost, and station name. Display an average price trend line over the last 6 months from `getAveragePrice`. Show station analysis from `getStationBreakdown` ranking cheapest stations. Include a cost projection section from `projectFuelCost` estimating next month's fuel spend based on driving patterns. Add a \"Log Fill-Up\" button that opens a form with gallons, price, odometer, and station fields."}, {"id": "CLOSET-01", "module": "closet", "title": "Color Palette Analysis Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(closet)/color-analysis.tsx", "apps/web/app/closet/colors/page.tsx"], "referenceLogic": ["modules/closet/src/engine/color.ts", "modules/closet/src/db/crud.ts", "modules/closet/src/types.ts"], "prompt": "Build a color palette analysis screen. Display the user's wardrobe color distribution as a visual palette grid using data from the color engine. Show seasonal color analysis (which colors dominate per season), color harmony suggestions, and a \"your palette\" summary. Each color swatch shows the count of items in that color. Include a color wheel visualization showing complementary and analogous colors in the wardrobe. Use the color engine's analysis functions to generate recommendations for missing palette gaps."}, {"id": "CLOSET-02", "module": "closet", "title": "Cost Per Wear Calculator Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(closet)/cpw.tsx", "apps/web/app/closet/cpw/page.tsx"], "referenceLogic": ["modules/closet/src/engine/cpw.ts", "modules/closet/src/db/crud.ts"], "prompt": "Build the CPW (Cost Per Wear) calculator screen. Show a ranked list of clothing items sorted by CPW value (purchase price / number of wears). Each item card shows photo thumbnail, name, purchase price, wear count, and calculated CPW with color coding (green <$1, yellow $1-5, red >$5). Include a \"best value\" highlight section for top 5 lowest CPW items. Show total wardrobe value and average CPW. Add a \"Log Wear\" quick action per item that increments the wear count and recalculates CPW."}, {"id": "CLOSET-03", "module": "closet", "title": "Seasonal Rotation Manager", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(closet)/rotation.tsx", "apps/web/app/closet/rotation/page.tsx"], "referenceLogic": ["modules/closet/src/engine/seasonal.ts", "modules/closet/src/db/capsules.ts"], "prompt": "Build a seasonal rotation screen. Show current season's active wardrobe vs stored items. Use the seasonal engine to recommend which items to rotate in/out based on weather data and seasonal categories. Display a 4-season grid (Spring/Summer/Fall/Winter) with item counts. Include a \"Rotate Now\" action that marks selected items as stored/active. Show capsule wardrobe suggestions per season from the capsule engine. Add packing tips for seasonal transitions."}, {"id": "CLOSET-04", "module": "closet", "title": "Outfit Suggestion Refinement Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(closet)/suggestions.tsx", "apps/web/app/closet/suggestions/page.tsx"], "referenceLogic": ["modules/closet/src/engine/outfit-suggest.ts", "modules/closet/src/engine/weather.ts", "modules/closet/src/db/suggestions.ts"], "prompt": "Build an outfit suggestion screen. Show today's weather-responsive outfit suggestion from the outfit-suggest engine, with a visual clothing stack (top/bottom/shoes/accessories). Include a \"Regenerate\" button, a \"Like/Dislike\" feedback mechanism that trains future suggestions, and a history of past suggestions. Show weather conditions (temp, rain, wind) that influenced the suggestion. Allow tapping individual items to swap alternatives. Save liked outfits to a favorites collection."}, {"id": "CLOSET-05", "module": "closet", "title": "Wishlist Management Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(closet)/wishlist.tsx", "apps/web/app/closet/wishlist/page.tsx"], "referenceLogic": ["modules/closet/src/db/wishlist.ts", "modules/closet/src/engine/cpw.ts"], "prompt": "Build a wishlist screen. Show saved wishlist items with photo, name, price, retailer, and URL link. Include \"Add to Wishlist\" form with fields for item details and optional photo upload. Show a projected CPW estimate (price / estimated wears based on similar items). Add priority sorting (high/medium/low) and price drop alerts toggle. Include a \"Move to Wardrobe\" action when an item is purchased. Display total wishlist value."}, {"id": "CLOSET-06", "module": "closet", "title": "Weather-Responsive Outfit Scoring", "dependsOn": ["CLOSET-04"], "filesToEdit": ["apps/mobile/app/(closet)/weather-score.tsx", "apps/web/app/closet/weather/page.tsx"], "referenceLogic": ["modules/closet/src/engine/weather.ts", "modules/closet/src/engine/outfit-suggest.ts"], "prompt": "Build a weather-responsive scoring screen. Show today's weather forecast and score each of the user's recent outfits on weather appropriateness (0-100 scale). Display a 7-day forecast with outfit recommendations per day. Use the weather engine's scoring functions to rate warmth, rain protection, and breathability. Show color-coded scores (green >80, yellow 50-80, red <50). Include a \"What to Wear\" quick view for the next 3 days."}, {"id": "CLOSET-07", "module": "closet", "title": "Trend Analysis Dashboard", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(closet)/trends.tsx", "apps/web/app/closet/trends/page.tsx"], "referenceLogic": ["modules/closet/src/engine/analytics.ts", "modules/closet/src/db/crud.ts"], "prompt": "Build a trend analysis dashboard. Show wearing frequency trends over time (most/least worn items, weekly/monthly patterns), category distribution (tops/bottoms/shoes/accessories), brand preferences, and spending trends. Include charts for: items added per month, average wears per item, most-worn colors, and cost trends. Use the analytics engine to generate insights like \"You wear 80% of your wardrobe\" or \"Consider donating 12 unworn items.\" Display a wardrobe health score."}, {"id": "CYCLE-01", "module": "cycle", "title": "Pregnancy Mode Dashboard", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(cycle)/pregnancy.tsx", "apps/web/app/cycle/pregnancy/page.tsx"], "referenceLogic": ["modules/cycle/src/engine/pregnancy.ts", "modules/cycle/src/data/pregnancy-weeks.ts", "modules/cycle/src/types.ts"], "prompt": "Build the full pregnancy mode dashboard. Show current week/trimester with a progress bar, due date countdown, and baby size comparison from `pregnancy-weeks.ts` data. Display weekly development milestones, common symptoms for the current week, and upcoming appointments section. Include a weight gain tracker with recommended range bands. Add a \"Kick Counter\" section with session logging. Show trimester summary cards (first/second/third) with key milestones. Use the pregnancy engine's calculation functions for gestational age and due date."}, {"id": "CYCLE-02", "module": "cycle", "title": "Pregnancy Symptom and Appointment Tracker", "dependsOn": ["CYCLE-01"], "filesToEdit": ["apps/mobile/app/(cycle)/pregnancy-log.tsx", "apps/web/app/cycle/pregnancy/log/page.tsx"], "referenceLogic": ["modules/cycle/src/engine/pregnancy.ts", "modules/cycle/src/db/crud.ts"], "prompt": "Build a pregnancy symptom and appointment logging screen. Show a daily symptom checklist (nausea, fatigue, cravings, swelling, etc.) with severity toggles. Include an appointments list with date, provider, type (ultrasound/checkup/lab), and notes. Add a \"Birth Plan\" notes section. Show symptom frequency trends over the pregnancy timeline. Include quick-log buttons for common symptoms."}, {"id": "CYCLE-03", "module": "cycle", "title": "Temperature Analysis Dashboard", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(cycle)/temperature.tsx", "apps/web/app/cycle/temperature/page.tsx"], "referenceLogic": ["modules/cycle/src/engine/temperature.ts", "modules/cycle/src/db/crud.ts"], "prompt": "Build a BBT (Basal Body Temperature) analysis dashboard. Show a biphasic temperature chart with the thermal shift line from the temperature engine. Display daily BBT readings as a line graph overlaid on cycle phases. Highlight the predicted ovulation point based on temperature shift detection. Show the coverline calculation and luteal phase temperature plateau. Include a \"Log Temperature\" form with time, temp, and notes. Display cycle-over-cycle temperature overlay comparison. Add statistics: average follicular temp, average luteal temp, shift magnitude."}, {"id": "CYCLE-04", "module": "cycle", "title": "Sharing and Partner View", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(cycle)/sharing.tsx", "apps/web/app/cycle/sharing/page.tsx"], "referenceLogic": ["modules/cycle/src/engine/sharing.ts", "modules/cycle/src/types.ts"], "prompt": "Build the sharing/partner view screen. Show sharing settings: what data categories to share (cycle dates, symptoms, fertility window, mood), who to share with (partner name/email), and share link generation from the sharing engine. Include a \"Partner View\" preview showing what the shared recipient sees: a simplified cycle calendar with fertility window, expected period dates, and mood indicators. No raw symptom data unless explicitly enabled. Add a toggle for push notification sharing (e.g., \"Period starting soon\"). Include a revoke access button."}, {"id": "CYCLE-05", "module": "cycle", "title": "Detailed Cycle Insights Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(cycle)/insights-detail.tsx", "apps/web/app/cycle/insights/detail/page.tsx"], "referenceLogic": ["modules/cycle/src/engine/insights.ts", "modules/cycle/src/engine/prediction.ts", "modules/cycle/src/db/crud.ts"], "prompt": "Build a detailed cycle insights screen expanding on the existing insights tab. Show: average cycle length with standard deviation, luteal phase length analysis, period duration trends, PMS symptom patterns (which symptoms appear how many days before period), flow intensity patterns, and ovulation prediction confidence. Display each insight as an expandable card with a chart and explanation text. Use the insights engine to generate personalized observations like \"Your cycles have become more regular over the last 6 months.\""}, {"id": "CYCLE-06", "module": "cycle", "title": "Cycle Comparison View", "dependsOn": ["CYCLE-05"], "filesToEdit": ["apps/mobile/app/(cycle)/compare.tsx", "apps/web/app/cycle/compare/page.tsx"], "referenceLogic": ["modules/cycle/src/engine/insights.ts", "modules/cycle/src/engine/prediction.ts"], "prompt": "Build a cycle-over-cycle comparison screen. Show a horizontal timeline overlay of the last 3-6 cycles aligned by period start date. Each cycle row shows color-coded phases (menstruation=red, follicular=green, ovulation=blue, luteal=yellow). Display symptom dots on the timeline for each cycle. Show a comparison table: cycle length, period duration, heaviest flow day, PMS start day. Highlight anomalies (e.g., \"Cycle 4 was 5 days longer than average\"). Allow selecting specific cycles to compare side-by-side."}, {"id": "FLASH-01", "module": "flash", "title": "Spaced Repetition Scheduler UI", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(flash)/schedule.tsx", "apps/web/app/flash/schedule/page.tsx"], "referenceLogic": ["modules/flash/src/engine/scheduler.ts", "modules/flash/src/engine/session.ts", "modules/flash/src/db/crud.ts"], "prompt": "Build a spaced repetition schedule overview screen. Show today's due card count, upcoming reviews for the next 7 days as a bar chart, and overdue cards count in red. Display per-deck review schedule with next review date and card counts (new/learning/review/overdue). Use `getNextReviewDate` and interval calculations from `scheduler.ts`. Include a \"Study Now\" button per deck that launches the session engine. Show streak days and daily review goal progress bar."}, {"id": "FLASH-02", "module": "flash", "title": "Cross-Module Study Signals Dashboard", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(flash)/signals.tsx", "apps/web/app/flash/signals/page.tsx"], "referenceLogic": ["modules/flash/src/engine/cross-module.ts", "modules/flash/src/types.ts"], "prompt": "Build a cross-module study signals screen. Show suggested flashcards generated from other modules: vocabulary from Words, medication names from Meds, plant care facts from Garden, recipe ingredients from Recipes. Each signal shows the source module icon, suggested card content, and a \"Create Card\" button. Use the cross-module engine to detect study opportunities. Display a feed of recent cross-module suggestions sorted by relevance. Include a toggle to enable/disable signals per module."}, {"id": "FLASH-03", "module": "flash", "title": "Anki Import/Export Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(flash)/import-export.tsx", "apps/web/app/flash/import-export/page.tsx"], "referenceLogic": ["modules/flash/src/engine/anki-import.ts", "modules/flash/src/engine/export.ts"], "prompt": "Build an import/export screen for Anki format. Import section: file picker for .apkg files, preview of detected decks with card count, field mapping UI (front/back/tags), and \"Import\" button. Use `parseAnkiPackage` and `mapAnkiFields` from `anki-import.ts`. Export section: deck selector, format choice (Anki .apkg, CSV, JSON), include/exclude scheduling data toggle, and \"Export\" button using the export engine. Show import/export history with timestamps and card counts."}, {"id": "FLASH-04", "module": "flash", "title": "Forgetting Curve Visualization", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(flash)/forgetting-curve.tsx", "apps/web/app/flash/forgetting/page.tsx"], "referenceLogic": ["modules/flash/src/engine/forgetting-curve.ts", "modules/flash/src/engine/analytics.ts"], "prompt": "Build a forgetting curve visualization screen. Show an interactive chart of the user's actual retention rate vs. the theoretical Ebbinghaus forgetting curve. Use `calculateRetentionRate` and `getRetentionCurve` from `forgetting-curve.ts`. Display per-deck retention curves with different colors. Show key metrics: current retention rate, optimal review timing, memory strength distribution. Include an explanation section describing how spaced repetition combats the forgetting curve. Add a card-level view showing individual cards' retention trajectories."}, {"id": "FLASH-05", "module": "flash", "title": "Session Intelligence Analytics", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(flash)/session-analytics.tsx", "apps/web/app/flash/session-analytics/page.tsx"], "referenceLogic": ["modules/flash/src/engine/analytics.ts", "modules/flash/src/engine/session.ts"], "prompt": "Build a session intelligence analytics screen. Show study session history with duration, cards reviewed, accuracy rate, and difficulty distribution per session. Display a calendar heatmap of study activity. Include time-of-day analysis (when the user studies best). Show average response time per difficulty level. Display a \"focus score\" per session based on response time consistency. Chart weekly review volume and accuracy trends. Include \"best streak\" and \"total cards mastered\" lifetime stats."}, {"id": "FLASH-06", "module": "flash", "title": "Card Performance Stats Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(flash)/card-stats.tsx", "apps/web/app/flash/card-stats/page.tsx"], "referenceLogic": ["modules/flash/src/engine/analytics.ts", "modules/flash/src/db/crud.ts"], "prompt": "Build a per-card performance statistics screen. Show a searchable/filterable list of cards with: ease factor, interval, lapse count, average response time, and retention status (mature/learning/new). Sort options: hardest, most lapsed, longest interval, newest. Each card row is tappable to show a detail modal with review history timeline, response time chart, and ease factor progression. Include \"Problem Cards\" section highlighting leeches (cards with >X lapses). Add actions: reset card, suspend, delete."}, {"id": "GARDEN-01", "module": "garden", "title": "Companion Planting Matrix Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(garden)/companion-matrix.tsx", "apps/web/app/garden/companion-matrix/page.tsx"], "referenceLogic": ["modules/garden/src/engine/companion.ts", "modules/garden/src/engine/companion-data.ts"], "prompt": "Build a full companion planting matrix screen. Display an interactive grid/table where rows and columns are plant types from `companion-data.ts`. Each cell shows a colored indicator: green (beneficial), red (antagonistic), gray (neutral). Tapping a cell shows the relationship reason. Include a search/filter to find specific plant combinations. Add a \"Check My Garden\" mode that highlights only the plants the user has added, showing any conflicts. Use the companion engine's `getCompanionScore` and `getRelationship` functions."}, {"id": "GARDEN-02", "module": "garden", "title": "Plant Diagnosis Engine UI", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(garden)/diagnose.tsx", "apps/web/app/garden/diagnose/page.tsx"], "referenceLogic": ["modules/garden/src/engine/diagnosis.ts", "modules/garden/src/engine/diagnosis-db.ts"], "prompt": "Enhance the plant diagnosis screen. Build a step-by-step diagnostic wizard: 1) Select plant, 2) Choose affected part (leaf/stem/root/fruit/flower), 3) Describe symptoms via checklist (yellowing, spots, wilting, holes, mold), 4) Upload optional photo. Use the diagnosis engine to match symptoms to conditions from `diagnosis-db.ts`. Show ranked results with confidence score, condition name, description, treatment options, and prevention tips. Include a diagnosis history log per plant. Add a \"Common Issues\" quick-reference section."}, {"id": "GARDEN-03", "module": "garden", "title": "Light Classification Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(garden)/light-meter.tsx", "apps/web/app/garden/light/page.tsx"], "referenceLogic": ["modules/garden/src/engine/light.ts", "modules/garden/src/engine/light-classification.ts"], "prompt": "Enhance the light meter screen with classification results. After measuring light levels, show the classification result from `light-classification.ts`: full sun / partial sun / partial shade / full shade, with lux ranges. Display a visual meter gauge. Show which of the user's plants are suitable for this light level and which are mismatched. Include a \"Map Your Garden\" feature where the user can save light readings per garden zone. Show plant recommendations sorted by light requirement match."}, {"id": "GARDEN-04", "module": "garden", "title": "Propagation Tracking Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(garden)/propagation/[id].tsx", "apps/web/app/garden/propagation/[id]/page.tsx"], "referenceLogic": ["modules/garden/src/engine/propagation.ts", "modules/garden/src/db/crud-v2.ts"], "prompt": "Enhance the propagation detail screen. Show a timeline tracker for each propagation attempt: method (cutting/seed/division/layering), start date, current stage (planted/rooting/sprouting/established), expected timeline milestones from the propagation engine. Include a photo journal per propagation with dated entries. Show success rate statistics per method and plant type. Add stage transition buttons (\"Mark as Rooted\", \"Mark as Sprouting\"). Display care instructions specific to the propagation method and current stage."}, {"id": "GARDEN-05", "module": "garden", "title": "Seasonal Task Generation Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(garden)/seasonal.tsx", "apps/web/app/garden/seasonal/page.tsx"], "referenceLogic": ["modules/garden/src/engine/seasonal-data.ts", "modules/garden/src/engine/frost.ts"], "prompt": "Enhance the seasonal tasks screen. Generate a personalized task list based on the user's garden zone, current month, and planted items using `seasonal-data.ts`. Each task card shows: task name, affected plants, urgency (overdue/due-soon/upcoming), and instructions. Group tasks by category (planting/pruning/harvesting/preparation). Include frost date awareness from the frost engine: show days until first/last frost and frost-sensitive plant alerts. Add a \"Complete\" checkbox per task that tracks completion history."}, {"id": "GARDEN-06", "module": "garden", "title": "Frost Date Calculator Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(garden)/frost.tsx", "apps/web/app/garden/frost/page.tsx"], "referenceLogic": ["modules/garden/src/engine/frost.ts", "modules/garden/src/engine/frost-data.ts"], "prompt": "Enhance the frost date calculator. Show first and last frost dates for the user's zone from `frost-data.ts`. Display a visual timeline showing the frost-free growing season. Include a planting calendar that shows safe outdoor planting dates for each plant type based on frost dates. Show \"start indoors\" dates (X weeks before last frost). Add a frost alert section for upcoming cold snaps with plant protection recommendations. Display growing degree days calculation."}, {"id": "HABITS-01", "module": "habits", "title": "Sobriety Clock Detail Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(habits)/sobriety-clock.tsx", "apps/web/app/habits/sobriety/page.tsx"], "referenceLogic": ["modules/habits/src/sobriety/engine.ts", "modules/habits/src/sobriety/craving-engine.ts", "modules/habits/src/db/sobriety.ts"], "prompt": "Enhance the sobriety clock screen with rich detail. Show a large animated counter (days/hours/minutes/seconds since sobriety date). Display milestone badges earned and upcoming milestones. Add a \"Money Saved\" calculator based on daily spend before sobriety. Show health recovery timeline (e.g., \"After 72 hours: nicotine leaves body\"). Include a motivational quote rotation. Display a calendar view highlighting sober days. Add an emergency \"I'm Struggling\" button linking to craving analysis (HABITS-02)."}, {"id": "HABITS-02", "module": "habits", "title": "Craving Analysis Dashboard", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(habits)/craving-insights.tsx", "apps/web/app/habits/cravings/page.tsx"], "referenceLogic": ["modules/habits/src/sobriety/craving-engine.ts", "modules/habits/src/db/cravings.ts"], "prompt": "Enhance the craving insights screen. Show craving frequency chart over time (daily/weekly/monthly). Display trigger analysis: most common triggers, time-of-day patterns, location patterns, and intensity trends. Use the craving engine to identify peak craving times and suggest coping strategies. Show a \"Craving Surfing\" timer (cravings typically pass in 15-20 min). Include distraction suggestions. Display stats: average craving intensity trend, longest craving-free streak, total cravings resisted."}, {"id": "HABITS-03", "module": "habits", "title": "Focus Timer Analytics Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(habits)/focus-analytics.tsx", "apps/web/app/habits/focus/page.tsx"], "referenceLogic": ["modules/habits/src/focus/engine.ts", "modules/habits/src/db/focus.ts", "modules/habits/src/db/timed-sessions.ts"], "prompt": "Build a focus timer analytics screen. Show total focus time (today/week/month), session count, average session duration, and longest session. Display a calendar heatmap of focus activity. Chart focus time by tag/project. Show time-of-day productivity analysis (when the user focuses best). Include Pomodoro stats: completed pomodoros, average break adherence. Display a \"deep work\" score based on uninterrupted sessions >25min. Compare current week to previous week with delta indicators."}, {"id": "HABITS-04", "module": "habits", "title": "Habit Stacking Recommendations", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(habits)/stacking.tsx", "apps/web/app/habits/stacking/page.tsx"], "referenceLogic": ["modules/habits/src/stacking/engine.ts", "modules/habits/src/db/stacking.ts"], "prompt": "Build a habit stacking screen. Show current habit stacks (chains of habits linked together, e.g., \"After morning coffee -> meditate -> journal\"). Use the stacking engine to suggest new stacks based on habit timing patterns and completion correlations. Each stack shows the chain of habits with completion rates. Include a builder UI to create new stacks by dragging habits into sequence. Show stack success rate vs individual habit success rate. Display a \"best time to stack\" recommendation based on historical data."}, {"id": "HABITS-05", "module": "habits", "title": "Location-Based Reminders Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(habits)/locations.tsx", "apps/web/app/habits/locations/page.tsx"], "referenceLogic": ["modules/habits/src/location/engine.ts", "modules/habits/src/db/location.ts"], "prompt": "Build a location-based reminders screen. Show a map with geofence circles for each location reminder. Each pin shows the associated habit and trigger type (enter/exit/dwell). Include an \"Add Location Reminder\" form: search for location, set radius, pick habit, choose trigger type. Show location reminder history (triggered/missed). Display a list view as alternative to the map. Use the location engine for geofence calculations. Include a \"Home\" and \"Work\" quick-set for common locations."}, {"id": "HABITS-06", "module": "habits", "title": "RPG Progression Detail Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(habits)/rpg.tsx", "apps/web/app/habits/rpg/page.tsx"], "referenceLogic": ["modules/habits/src/rpg/engine.ts", "modules/habits/src/db/rpg.ts"], "prompt": "Build an RPG progression detail screen. Show character avatar, level, XP bar (current/next level), and stat breakdown (consistency, streak power, diversity, social). Display a skill tree visualization where completing habits unlocks abilities/perks. Show recent XP gains with source habit. Include a leaderboard (local/global toggle). Display achievements/titles earned. Use the RPG engine's leveling calculations and stat formulas. Add a \"Quest Board\" showing active daily/weekly quests tied to habit goals."}, {"id": "HABITS-07", "module": "habits", "title": "Pet Companion Detail Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(habits)/pet-detail.tsx", "apps/web/app/habits/pet/page.tsx"], "referenceLogic": ["modules/habits/src/pet/engine.ts", "modules/habits/src/db/pet.ts"], "prompt": "Enhance the pet companion screen. Show a larger animated pet with mood states (happy/neutral/sad/sleeping) driven by habit completion rates from the pet engine. Display pet stats: happiness, energy, hunger (all tied to habit metrics). Show pet growth stages unlocked by streak milestones. Include a \"Feed\" action (triggered by completing habits) with animation. Display pet history timeline showing mood changes. Add pet customization (name, accessories earned from achievements). Show \"pet needs\" alerts when habits are falling behind."}, {"id": "HABITS-08", "module": "habits", "title": "Program Curriculum Detail Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(habits)/program-detail.tsx", "apps/web/app/habits/programs/page.tsx"], "referenceLogic": ["modules/habits/src/challenges/engine.ts", "modules/habits/src/db/challenges.ts"], "prompt": "Enhance the program curriculum screen. Show program overview (name, duration, description), current day/week progress, daily tasks checklist, and upcoming milestones. Each day shows required habits with completion status. Include a weekly review summary showing adherence percentage. Display a progress path visualization (day 1 -> graduation). Show community stats (how many users completed this program). Add program curriculum browser with categories (30-day challenges, wellness programs, productivity programs). Include a \"Restart Program\" option."}, {"id": "HABITS-09", "module": "habits", "title": "Badge Gallery Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(habits)/badge-gallery.tsx", "apps/web/app/habits/badges/page.tsx"], "referenceLogic": ["modules/habits/src/badges/engine.ts", "modules/habits/src/db/badges.ts"], "prompt": "Enhance the badge gallery screen. Show all badges in a grid layout, earned badges in full color and locked badges grayed out with progress toward unlock. Each badge shows: icon, name, description, earned date (or progress percentage). Group badges by category: streaks, milestones, challenges, social, special events. Include a \"Featured\" section for rarest badges. Tapping a badge shows a detail modal with full-size badge art, earn conditions, date earned, and share button. Show total badges count and completion percentage."}, {"id": "HABITS-10", "module": "habits", "title": "HealthKit Integration Settings", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(habits)/healthkit.tsx"], "referenceLogic": ["modules/habits/src/healthkit/bridge.ts", "modules/habits/src/healthkit/data-sources.ts", "modules/habits/src/db/healthkit-links.ts"], "prompt": "Build a HealthKit integration settings screen (mobile only). Show a list of available HealthKit data types (steps, sleep, water, workouts, mindful minutes) with toggle switches. Each enabled type shows the linked habit and sync status. Include \"Link Habit\" picker per data type that maps HealthKit data to automatic habit completion. Show sync history (last sync time, records synced). Use the HealthKit bridge for permission requests and data reading. Display a \"Test Sync\" button and sync conflict resolution options."}, {"id": "HEALTH-01", "module": "health", "title": "HRV Analytics Dashboard", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(health)/hrv.tsx", "apps/web/app/health/hrv/page.tsx"], "referenceLogic": ["modules/health/src/hrv/analysis.ts", "modules/health/src/healthkit/adapter.ts"], "prompt": "Build an HRV analytics dashboard. Show current HRV reading, 7-day average, 30-day trend line, and personal baseline. Use the HRV analysis module for RMSSD, SDNN, and pNN50 calculations. Display HRV in context: stress level indicator (low HRV = high stress), recovery status, and training readiness. Show time-of-day HRV patterns. Include a correlation section showing HRV vs sleep quality, exercise, and alcohol/caffeine. Display a \"Your HRV Explained\" educational card."}, {"id": "HEALTH-02", "module": "health", "title": "Sleep Stage Breakdown Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(health)/sleep-stages.tsx", "apps/web/app/health/sleep/stages/page.tsx"], "referenceLogic": ["modules/health/src/sleep/analysis.ts", "modules/health/src/sleep/hr-analysis.ts", "modules/health/src/sleep/crud.ts"], "prompt": "Build a sleep stage breakdown screen. Show a hypnogram (sleep stage timeline: awake/REM/light/deep) for last night with color coding. Display stage duration percentages and compare to ideal ranges (Deep: 15-20%, REM: 20-25%). Show sleep efficiency score from the analysis engine. Include heart rate overlay on the hypnogram from `hr-analysis.ts`. Display a 7-day sleep composition stacked bar chart. Show a \"Sleep Score\" breakdown explaining each component. Add time-in-bed vs actual sleep comparison."}, {"id": "HEALTH-03", "module": "health", "title": "Breathing Coach Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(health)/breathing.tsx", "apps/web/app/health/breathing/page.tsx"], "referenceLogic": ["modules/health/src/breathing/engine.ts", "modules/health/src/breathing/crud.ts"], "prompt": "Build an interactive breathing coach screen. Show animated breathing circle that expands (inhale) and contracts (exhale) with configurable patterns from the breathing engine: 4-7-8, box breathing, coherent breathing, Wim Hof. Display session timer, breath count, and estimated heart rate effect. Include haptic feedback on mobile. Show session history with duration and pattern used. Add a \"Quick Calm\" 1-minute preset. Display a post-session calm score. Include ambient sound options (ocean, rain, silence)."}, {"id": "HEALTH-04", "module": "health", "title": "Readiness Score Explanation Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(health)/readiness.tsx", "apps/web/app/health/readiness/page.tsx"], "referenceLogic": ["modules/health/src/readiness/engine.ts", "modules/health/src/readiness/crud.ts"], "prompt": "Build a readiness score explanation screen. Show the overall readiness score (0-100) as a large gauge with color zones. Break down the score into contributing factors from the readiness engine: sleep quality, HRV, recovery time, activity balance, resting heart rate. Each factor shows its sub-score, trend arrow (improving/declining), and weight in the overall calculation. Include daily readiness history chart. Show actionable recommendations (\"Your sleep was short; consider a rest day\"). Display readiness vs actual activity correlation."}, {"id": "HEALTH-05", "module": "health", "title": "HealthKit Granular Controls Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(health)/health-sync-settings.tsx", "apps/web/app/health/sync/page.tsx"], "referenceLogic": ["modules/health/src/healthkit/permissions.ts", "modules/health/src/healthkit/sync.ts", "modules/health/src/settings/index.ts"], "prompt": "Enhance the HealthKit sync settings with granular per-data-type controls. Show a categorized list of data types (Activity, Body, Heart, Sleep, Nutrition, Mindfulness) with individual read/write toggle switches per type. Display sync frequency options (real-time, hourly, daily). Show data source priority ordering (which app's data takes precedence). Include a \"Sync Now\" button per category with progress indicator. Display last sync timestamp and record count per type. Show storage usage. Add a \"Data Quality\" indicator per type based on dedup results from `aggregation/dedup.ts`."}, {"id": "HEALTH-06", "module": "health", "title": "Grounding Techniques Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(health)/grounding.tsx", "apps/web/app/health/grounding/page.tsx"], "referenceLogic": ["modules/health/src/sos/grounding.ts", "modules/health/src/sos/crud.ts"], "prompt": "Build a grounding techniques screen for anxiety/panic management. Show a collection of guided grounding exercises from `grounding.ts`: 5-4-3-2-1 sensory technique (with step-by-step prompts), body scan, progressive muscle relaxation, cold water technique. Each exercise shows estimated duration and difficulty. Include an \"I Need Help Now\" emergency quick-access that starts the 5-4-3-2-1 exercise immediately. Track completed exercises with timestamps. Show a calming color palette and large, readable text. Include a favorites system for preferred techniques."}, {"id": "HEALTH-07", "module": "health", "title": "Smart Alarm Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(health)/smart-alarm.tsx"], "referenceLogic": ["modules/health/src/smart-alarm/engine.ts", "modules/health/src/smart-alarm/crud.ts"], "prompt": "Build a smart alarm configuration screen (mobile only, needs background wake). Show alarm time with a \"smart window\" slider (e.g., wake me between 6:30-7:00 during light sleep). Use the smart alarm engine to configure wake conditions: light sleep detection, movement detection, optimal wake phase. Display tomorrow's predicted best wake time based on typical sleep patterns. Show alarm history with actual wake times and sleep phase at wake. Include sound/vibration customization, snooze settings, and weekday/weekend schedule. Display a \"sleep debt\" indicator suggesting optimal alarm time."}, {"id": "HEALTH-08", "module": "health", "title": "Snore Detection Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(health)/snore.tsx", "apps/web/app/health/snore/page.tsx"], "referenceLogic": ["modules/health/src/snore/engine.ts", "modules/health/src/snore/crud.ts"], "prompt": "Build a snore detection results screen. Show last night's snore detection results: total snoring duration, snoring episodes count, intensity levels (mild/moderate/severe), and audio clips of detected snoring events. Display a night timeline showing when snoring occurred overlaid on sleep stages. Show 7-day and 30-day snoring trends. Include body position correlation if available. Display snoring score (0-100, lower is better). Add recommendations based on patterns (e.g., \"Snoring increases when sleeping on your back\"). Include a \"Record Tonight\" setup button."}, {"id": "HEALTH-09", "module": "health", "title": "Body Composition Tracking Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(health)/body-composition.tsx", "apps/web/app/health/body/page.tsx"], "referenceLogic": ["modules/health/src/body/engine.ts", "modules/health/src/body/crud.ts"], "prompt": "Build a body composition tracking screen. Show current measurements: weight, body fat %, muscle mass, BMI, waist circumference, and derived metrics from the body engine. Display trend charts for each metric over 3/6/12 month views. Include a body silhouette visualization with measurement points. Show goal tracking with target weight/body fat and progress percentage. Add a \"Log Measurement\" form. Include BMI category indicator and healthy range bands on charts. Display rate of change (e.g., \"-0.5 lbs/week\") and projected goal date."}, {"id": "HEALTH-10", "module": "health", "title": "Activity Analytics Dashboard", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(health)/activity.tsx", "apps/web/app/health/activity/page.tsx"], "referenceLogic": ["modules/health/src/activity/engine.ts", "modules/health/src/activity/crud.ts"], "prompt": "Build an activity analytics dashboard. Show daily step count with goal ring, active calories, exercise minutes, standing hours (Apple Watch style rings). Display weekly activity summary with day-by-day comparison. Include activity type breakdown (walking, running, cycling, etc.) with duration and calorie charts. Show movement alerts history (hourly stand reminders). Display personal records (most steps, longest workout, highest calorie burn). Include a 30-day activity trend with goal adherence percentage. Integrate with the health score engine for activity's contribution to overall health."}, {"id": "HOMES-01", "module": "homes", "title": "Maintenance Cost Predictor Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(homes)/cost-predictor.tsx", "apps/web/app/homes/cost-predictor/page.tsx"], "referenceLogic": ["modules/homes/src/engines/cost-engine.ts", "modules/homes/src/db/cost-entries.ts"], "prompt": "Build a maintenance cost predictor screen. Show predicted annual maintenance costs broken down by category (HVAC, plumbing, electrical, structural, landscaping) using the cost engine's forecasting functions. Display a timeline of upcoming predicted expenses based on appliance ages and maintenance schedules. Show historical spending vs predicted spending chart. Include a \"1% rule\" indicator (annual maintenance should be ~1% of home value). Display a 5-year cost forecast. Add per-appliance replacement cost estimates based on age and expected lifespan."}, {"id": "HOMES-02", "module": "homes", "title": "Contractor Management Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(homes)/contractor/[id].tsx", "apps/web/app/homes/contractors/page.tsx"], "referenceLogic": ["modules/homes/src/engines/contractor-engine.ts", "modules/homes/src/db/contractors.ts", "modules/homes/src/db/contractor-services.ts"], "prompt": "Enhance the contractor management screen. Show a contractor directory with name, specialty, rating, phone, email, and job history. Each contractor card shows total spent, number of jobs, average rating. Include a search/filter by specialty (plumber, electrician, HVAC, general). Add a \"Rate Contractor\" form with star rating and notes. Show contractor availability and preferred contact method. Link contractors to completed projects and maintenance records. Use the contractor engine for rating aggregation and recommendation sorting. Add a \"Find Contractor\" section for needed specialties."}, {"id": "HOMES-03", "module": "homes", "title": "Insurance Tracker Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(homes)/insurance/[id].tsx", "apps/web/app/homes/insurance/page.tsx"], "referenceLogic": ["modules/homes/src/engines/insurance-engine.ts", "modules/homes/src/db/insurance.ts"], "prompt": "Enhance the insurance tracker. Show all insurance policies per property with: policy number, provider, coverage amount, deductible, premium (monthly/annual), renewal date, and status (active/expiring/expired). Display coverage gap analysis from the insurance engine. Show claim history with date, amount, status, and resolution. Include premium comparison over time chart. Add document storage for policy PDFs. Show a renewal timeline for the next 12 months. Include a \"Coverage Review\" checklist suggesting common coverage gaps (flood, earthquake, umbrella)."}, {"id": "HOMES-04", "module": "homes", "title": "Inventory Asset Tagging Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(homes)/inventory/item/[id].tsx", "apps/web/app/homes/inventory/page.tsx"], "referenceLogic": ["modules/homes/src/engines/inventory-engine.ts", "modules/homes/src/db/inventory.ts"], "prompt": "Enhance the inventory item detail with asset tagging. Show item photo, name, category, purchase date, purchase price, current estimated value, serial number, model number, and room location. Add a barcode/QR scanner for quick item lookup. Include warranty information with expiration tracking from HOMES-05. Display depreciation estimate based on item age and category. Add custom tag fields for organization. Include a \"For Insurance\" flag that marks high-value items for insurance documentation. Show a room-by-room inventory summary with total value per room."}, {"id": "HOMES-05", "module": "homes", "title": "Warranty Tracking Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(homes)/warranties.tsx", "apps/web/app/homes/warranties/page.tsx"], "referenceLogic": ["modules/homes/src/engines/appliance-engine.ts", "modules/homes/src/db/appliances.ts"], "prompt": "Build a warranty tracking screen. Show all appliances and major items with warranty status: item name, purchase date, warranty end date, days remaining, and status badge (active/expiring-soon/expired). Sort by \"expiring soonest\" by default. Each warranty card shows manufacturer, model, serial number, and warranty document link. Include an \"Add Warranty\" form with photo capture for warranty cards/receipts. Show a calendar view of warranty expirations. Add notification settings for approaching expirations (30/60/90 day alerts). Display extended warranty options tracking."}, {"id": "HOMES-06", "module": "homes", "title": "Project Dependencies Visualization", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(homes)/project/dependencies.tsx", "apps/web/app/homes/projects/dependencies/page.tsx"], "referenceLogic": ["modules/homes/src/engines/project-engine.ts", "modules/homes/src/db/projects.ts", "modules/homes/src/db/project-phases.ts"], "prompt": "Build a project dependencies screen. Show a Gantt-style timeline of active home improvement projects with phase dependencies. Each project shows phases with start/end dates, status (planned/in-progress/blocked/complete), and dependency arrows. Use the project engine to detect dependency conflicts (e.g., \"Kitchen tile can't start until plumbing is done\"). Include a critical path highlight. Show budget tracking per project phase. Add a \"What-If\" slider to see how delaying one phase affects downstream tasks. Display a combined timeline across all projects."}, {"id": "HOMES-07", "module": "homes", "title": "Cost Forecasting Dashboard", "dependsOn": ["HOMES-01"], "filesToEdit": ["apps/mobile/app/(homes)/forecasting.tsx", "apps/web/app/homes/forecasting/page.tsx"], "referenceLogic": ["modules/homes/src/engines/cost-engine.ts", "modules/homes/src/db/cost-entries.ts"], "prompt": "Build a cost forecasting dashboard. Show monthly/annual spending projections based on historical data and scheduled maintenance. Display category-level forecasts (routine maintenance, repairs, improvements, utilities). Include a budget vs actual comparison with variance highlighting. Show a \"surprise expense\" reserve recommendation (based on home age and historical unexpected costs). Display ROI estimates for improvement projects. Add a savings goal calculator for planned renovations with monthly savings targets."}, {"id": "HOMES-08", "module": "homes", "title": "Document Organization Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(homes)/document/index.tsx", "apps/web/app/homes/documents/page.tsx"], "referenceLogic": ["modules/homes/src/engines/document-engine.ts", "modules/homes/src/db/documents.ts"], "prompt": "Enhance the document management screen. Show documents organized by category: deeds/titles, insurance policies, warranties, permits, receipts, inspection reports, floor plans, photos. Each document shows thumbnail, name, date, category, and linked property. Include a multi-file upload with auto-categorization suggestions from the document engine. Add full-text search across document names and tags. Show a \"Missing Documents\" checklist per property (common documents every homeowner should have). Include document expiration tracking for time-sensitive docs (permits, insurance)."}, {"id": "JOURNAL-01", "module": "journal", "title": "Voice Recording UI", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(journal)/voice-entry.tsx", "apps/web/app/journal/voice/page.tsx"], "referenceLogic": ["modules/journal/src/voice/recorder.ts", "modules/journal/src/voice/transcriber.ts", "modules/journal/src/db/voice.ts"], "prompt": "Build a voice journal entry screen. Show a large record button with waveform visualization during recording. Display recording duration timer. After recording, show playback controls with waveform scrubber. Include a transcription section that converts speech to text using the transcriber engine. Allow editing the transcription before saving. Show a \"Save as Entry\" button that creates a journal entry with both audio attachment and text transcription. Display voice entry history with duration and transcription preview."}, {"id": "JOURNAL-02", "module": "journal", "title": "CBT Thought Records Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(journal)/cbt.tsx", "apps/web/app/journal/cbt/page.tsx"], "referenceLogic": ["modules/journal/src/cbt/cbt-engine.ts", "modules/journal/src/cbt/distortions.ts", "modules/journal/src/db/cbt.ts"], "prompt": "Build a CBT thought record screen. Guide the user through a step-by-step thought record process: 1) Situation (what happened), 2) Automatic thought (what you thought), 3) Emotion (what you felt, intensity 0-100), 4) Cognitive distortion identification (checklist from `distortions.ts`: all-or-nothing, catastrophizing, mind-reading, etc.), 5) Rational response (balanced alternative thought), 6) New emotion (re-rated intensity). Use the CBT engine for distortion detection suggestions. Show thought record history with distortion frequency analysis."}, {"id": "JOURNAL-03", "module": "journal", "title": "Therapy Templates Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(journal)/therapy-templates.tsx", "apps/web/app/journal/therapy/page.tsx"], "referenceLogic": ["modules/journal/src/therapy/templates.ts", "modules/journal/src/therapy/session-engine.ts", "modules/journal/src/db/therapy.ts"], "prompt": "Build a therapy templates screen. Show a categorized grid of therapy journal templates from `templates.ts`: gratitude practice, anxiety log, mood diary, relationship reflection, grief processing, self-compassion letter, anger management, goal setting. Each template shows a preview with guided prompts. Tapping a template opens a pre-structured entry form with the template's sections. Include a \"My Templates\" section for user-created custom templates. Track template usage stats (most used, completion rates). Add a session log for therapy appointments with notes."}, {"id": "JOURNAL-04", "module": "journal", "title": "AI Writing Prompts Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(journal)/ai-prompts.tsx", "apps/web/app/journal/prompts/page.tsx"], "referenceLogic": ["modules/journal/src/ai-prompts/prompt-engine.ts", "modules/journal/src/ai-prompts/themes.ts"], "prompt": "Build an AI writing prompts screen. Show a daily featured prompt from the prompt engine, themed by category from `themes.ts` (self-discovery, creativity, gratitude, future-self, relationships, challenges). Include a \"Shuffle\" button for new prompt, category filter tabs, and a \"Favorites\" bookmark system. Display prompt history showing which prompts the user has written about. Show a \"Streak\" indicator for consecutive days of prompted writing. Include seasonal/holiday themed prompts. Add difficulty levels (light reflection, deep exploration, creative challenge)."}, {"id": "JOURNAL-05", "module": "journal", "title": "Philosophy Quotes and Affirmations Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(journal)/philosophy.tsx", "apps/web/app/journal/philosophy/page.tsx"], "referenceLogic": ["modules/journal/src/philosophy/quote-engine.ts", "modules/journal/src/affirmations/index.ts", "modules/journal/src/affirmations/selection.ts"], "prompt": "Build a philosophy quotes and affirmations screen. Show a daily quote from the quote engine with author attribution and philosophical tradition tag (Stoicism, Buddhism, Existentialism, etc.). Include a \"Reflect on This\" button that opens a journal entry pre-filled with the quote. Show an affirmations section with daily affirmations from the selection engine, customizable per user preference. Include a quote collection/favorites system. Display a \"Quote of the Day\" widget-style card on the journal home. Add categories: morning affirmations, evening reflections, anxiety relief, confidence building."}, {"id": "JOURNAL-06", "module": "journal", "title": "Grid Layouts Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(journal)/grid.tsx", "apps/web/app/journal/grid/page.tsx"], "referenceLogic": ["modules/journal/src/grid/grid-engine.ts", "modules/journal/src/grid/types.ts"], "prompt": "Build a grid layout journal view. Show entries in a Pinterest-style masonry grid with photo thumbnails, entry titles, mood indicators, and date stamps. Use the grid engine for layout calculations. Include filter options: by date range, mood, tags, and entry type (text/voice/photo). Add a \"Gallery Mode\" toggle for photo-heavy entries. Show mood color coding on grid cards. Include search within the grid view. Display entry word count and reading time on each card. Support drag-to-rearrange for custom curation of featured entries."}, {"id": "JOURNAL-07", "module": "journal", "title": "Vision Board Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(journal)/vision-board.tsx", "apps/web/app/journal/vision-board/page.tsx"], "referenceLogic": ["modules/journal/src/vision-board/board-engine.ts", "modules/journal/src/vision-board/types.ts"], "prompt": "Build a vision board screen. Show a freeform canvas where users can add: images (from camera/library), text blocks, stickers, and color backgrounds. Use the board engine for layout persistence and item positioning. Include zoom/pan on the canvas. Show multiple boards with thumbnails in a gallery. Add a \"New Board\" wizard with theme templates (career goals, travel dreams, fitness goals, relationships). Include a \"Daily Inspiration\" view that shows a random board item. Support board sharing as image export."}, {"id": "JOURNAL-08", "module": "journal", "title": "Book Builder Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(journal)/book-builder.tsx", "apps/web/app/journal/book/page.tsx"], "referenceLogic": ["modules/journal/src/book-builder/index.ts", "modules/journal/src/book-builder/page-layout.ts"], "prompt": "Build a journal book builder screen. Allow users to compile journal entries into a printable/exportable book. Show a book outline with chapters (auto-grouped by month or custom). Include page layout options from `page-layout.ts`: single entry per page, collage, timeline. Display a book preview with page thumbnails. Add a cover designer with title, subtitle, and cover image. Include export options: PDF, print-ready format. Show book statistics (pages, word count, photo count, date range). Allow reordering entries within chapters via drag-and-drop."}, {"id": "JOURNAL-09", "module": "journal", "title": "Writing Insights Dashboard", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(journal)/writing-insights.tsx", "apps/web/app/journal/insights/page.tsx"], "referenceLogic": ["modules/journal/src/engine/writing-insights.ts", "modules/journal/src/engine/stats.ts"], "prompt": "Build a writing insights dashboard. Show word count trends (daily/weekly/monthly), average entry length, vocabulary diversity score, and most-used words (word cloud). Use the writing insights engine for tone analysis (positive/negative/neutral trend over time). Display writing streaks and consistency metrics. Show time-of-day writing patterns. Include readability scores. Display emotional vocabulary evolution (are entries becoming more nuanced?). Add \"writing goals\" with daily word count targets and progress tracking. Show a \"Year in Review\" summary."}, {"id": "JOURNAL-10", "module": "journal", "title": "Therapeutic Progress Tracker", "dependsOn": ["JOURNAL-02"], "filesToEdit": ["apps/mobile/app/(journal)/therapy-progress.tsx", "apps/web/app/journal/therapy/progress/page.tsx"], "referenceLogic": ["modules/journal/src/engine/therapeutic-progress.ts", "modules/journal/src/therapy/session-engine.ts"], "prompt": "Build a therapeutic progress tracking screen. Show progress metrics over time: mood trend, anxiety level trend, thought record completion rate, cognitive distortion frequency changes, and coping skill usage. Use the therapeutic progress engine to generate insights like \"Your catastrophizing has decreased 40% this month.\" Display a therapy session log with notes and homework tracking. Show goal progress (therapy goals set by user). Include a \"Progress Report\" export function for sharing with a therapist. Display milestone celebrations (e.g., \"50th thought record completed\")."}, {"id": "JOURNAL-11", "module": "journal", "title": "On-This-Day Nostalgia Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(journal)/on-this-day.tsx", "apps/web/app/journal/on-this-day/page.tsx"], "referenceLogic": ["modules/journal/src/engine/nostalgia.ts", "modules/journal/src/db/crud.ts"], "prompt": "Build an \"On This Day\" nostalgia screen. Show journal entries from the same date in previous years, displayed as a timeline. Each entry card shows the year, a preview snippet, mood, and any photos. Use the nostalgia engine for content selection and ranking. Include a \"Memories\" notification setting for daily reminders. Show a \"This Week in History\" section for nearby dates. Add a \"Rediscover\" random entry feature. Include sharing capabilities for individual memories. Display a yearly comparison of how the user's writing has evolved on this date."}, {"id": "MAIL-01", "module": "mail", "title": "Email Filters and Rules Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(mail)/filters/index.tsx", "apps/mobile/app/(mail)/filters/edit.tsx", "apps/web/app/mail/filters/page.tsx"], "referenceLogic": ["modules/mail/src/engine/filters.ts", "modules/mail/src/db/crud-v2.ts"], "prompt": "Enhance the email filters screen. Show a list of active filter rules with: name, conditions summary, action summary, enabled/disabled toggle, and match count. The filter editor shows condition builder: from/to/subject/body contains/matches fields with AND/OR logic. Actions: move to folder, apply label, mark read, archive, delete, forward. Use the filters engine for rule evaluation logic. Include a \"Test Rule\" button that previews which existing emails would match. Add rule priority ordering via drag-and-drop. Show recently triggered rules with timestamps."}, {"id": "MAIL-02", "module": "mail", "title": "Calendar Integration Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(mail)/calendar-events.tsx", "apps/web/app/mail/calendar/page.tsx"], "referenceLogic": ["modules/mail/src/engine/calendar.ts", "modules/mail/src/types.ts"], "prompt": "Enhance the calendar integration screen. Show extracted calendar events from emails: flight confirmations, meeting invites, appointment reminders, delivery dates. Use the calendar engine to parse event data from email content. Each event card shows: title, date/time, location, source email link, and \"Add to Calendar\" button. Display a month calendar view with email-derived events marked. Include auto-detection settings (which email patterns to scan). Show a feed of newly detected events awaiting confirmation."}, {"id": "MAIL-03", "module": "mail", "title": "Contacts Extraction Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(mail)/contacts/index.tsx", "apps/web/app/mail/contacts/page.tsx"], "referenceLogic": ["modules/mail/src/engine/contacts.ts", "modules/mail/src/db/crud-v2.ts"], "prompt": "Enhance the contacts screen. Show a smart contacts list extracted from email correspondence using the contacts engine. Each contact shows: name, email, last contact date, message count, and relationship strength indicator. Include search and alphabetical index. Show recent contacts, frequent contacts, and \"Haven't heard from\" sections. Display contact detail with conversation history, extracted phone numbers, and organization. Add a \"Merge Duplicates\" feature for contacts detected as same person. Include contact groups and export to vCard."}, {"id": "MAIL-04", "module": "mail", "title": "Encryption Key Management Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(mail)/encryption/index.tsx", "apps/mobile/app/(mail)/encryption/add.tsx", "apps/web/app/mail/encryption/page.tsx"], "referenceLogic": ["modules/mail/src/engine/encryption.ts"], "prompt": "Enhance the encryption key management screen. Show a list of PGP/GPG keys: user's own keys (public + private) and imported contact public keys. Each key shows: fingerprint, email, expiration date, trust level, and key size. Include \"Generate New Key Pair\" wizard with key size selection and passphrase. Add \"Import Key\" from file or keyserver search. Show encryption status per contact (encrypted/unencrypted). Include a key verification flow (fingerprint comparison). Display key expiration warnings. Add \"Export Public Key\" and \"Revoke Key\" actions. Use the encryption engine for key operations."}, {"id": "MAIL-05", "module": "mail", "title": "Multi-Account Dashboard", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(mail)/accounts/index.tsx", "apps/web/app/mail/accounts/page.tsx"], "referenceLogic": ["modules/mail/src/engine/imap.ts", "modules/mail/src/db/crud-v2.ts"], "prompt": "Enhance the multi-account dashboard. Show a unified inbox view with account color-coding and per-account sidebar sections. Each account card shows: email address, provider icon, unread count, storage usage, and sync status. Include account health indicators (connection status, last sync, error flags). Display a combined statistics view: total emails, response rate, busiest hours. Add \"Unified Search\" across all accounts. Show a \"Switch Account\" quick-select in the inbox toolbar. Include account-specific settings (signature, sync frequency, notification preferences). Handle IMAP connection errors gracefully with retry UI."}, {"id": "MAIL-06", "module": "mail", "title": "Email Templates Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(mail)/templates.tsx", "apps/web/app/mail/templates/page.tsx"], "referenceLogic": ["modules/mail/src/engine/search.ts", "modules/mail/src/db/crud-v2.ts"], "prompt": "Build an email templates screen. Show a grid of saved email templates with: name, preview, category (business/personal/follow-up/thank-you), and last used date. Include a template editor with subject, body (rich text), and variable placeholders ({{name}}, {{date}}, {{company}}). Add \"Use Template\" action that opens compose with template pre-filled. Include built-in starter templates for common scenarios. Show template usage statistics. Add duplicate and edit functionality. Support organizing templates into folders/categories."}, {"id": "MAIL-07", "module": "mail", "title": "Draft Scheduling Screen", "dependsOn": [], "filesToEdit": ["apps/mobile/app/(mail)/schedule-send.tsx", "apps/web/app/mail/scheduled/page.tsx"], "referenceLogic": ["modules/mail/src/engine/notifications.ts", "modules/mail/src/db/crud-v2.ts"], "prompt": "Build a draft scheduling screen. Show a list of scheduled drafts with: recipient, subject, scheduled send time, and status (pending/sent/failed). Include a scheduler in the compose flow: \"Send Later\" button with date/time picker and suggested optimal times (based on recipient's timezone and typical response patterns). Display a calendar view of scheduled sends. Add \"Reschedule\" a
