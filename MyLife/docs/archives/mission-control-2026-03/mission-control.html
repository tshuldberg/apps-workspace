e/components/books/ProgressLogSheet.tsx"], "referenceLogic": ["modules/books/src/progress/types.ts", "apps/mobile/components/books/ProgressSlider.tsx"], "prompt": "Create `ProgressLogSheet` component. Props: `{ bookId: string, sessionId: string, pageCount: number | null, visible: boolean, onClose() }`. Uses `useProgress(bookId)` hook. Renders a bottom sheet (use a `Modal` with slide animation from bottom) containing: (1) a numeric page input field with label \"Current page\", (2) a \"Log Progress\" button calling `logProgress(page, pageCount)`, (3) a reading speed display showing `speed.averagePagesPerHour` formatted as \"X pages/hour\" if available, (4) estimated completion text: if `speed` and `pageCount`, compute `(pageCount - currentPage) / speed.averagePagesPerHour` hours remaining. Use Cool Obsidian tokens: `colors.background`, `colors.surface`, `colors.text`, `colors.modules.books` for accent, `spacing.*` for padding. Include loading and empty states."}, {"id": "BOOKS-03", "module": "books", "title": "Progress Tracking -- ProgressTimeline chart component", "dependsOn": ["BOOKS-01"], "filesToEdit": ["apps/mobile/components/books/ProgressTimeline.tsx"], "referenceLogic": ["modules/books/src/progress/types.ts"], "prompt": "Create `ProgressTimeline` component. Props: `{ timeline: ProgressTimelineEntry[], accentColor?: string }`. Renders a simple line chart showing reading progress over time. X-axis is date labels (show first, middle, last), Y-axis is page number. Use `View` + `StyleSheet` to draw horizontal bars proportional to `entry.percent` (0-100). Each row shows the date (formatted as \"MMM DD\") on the left, a horizontal bar on the right colored with `accentColor ?? colors.modules.books`. If `timeline.length === 0`, show \"Start logging progress to see your reading journey.\" in `colors.textTertiary`. Use Cool Obsidian tokens throughout. Max height 200px, scrollable if more than 10 entries."}, {"id": "BOOKS-04", "module": "books", "title": "Progress Tracking -- Wire into book detail screen", "dependsOn": ["BOOKS-02", "BOOKS-03"], "filesToEdit": ["apps/mobile/app/(books)/book/[id].tsx"], "referenceLogic": [], "prompt": "Edit `apps/mobile/app/(books)/book/[id].tsx`. Import `useProgress` from `../../../hooks/books/use-progress`. Import `ProgressLogSheet` and `ProgressTimeline` from `../../../components/books/`. Add a \"Reading Progress\" section below the existing book info section. Show: (1) `ProgressTimeline` with the `timeline` from the hook, (2) a \"Log Progress\" button that opens the `ProgressLogSheet` modal (pass the book's `page_count`, current `session.id`, and bookId). (3) If `speed` is available, show a stat card with \"Avg Speed: X pages/hr\" and \"Est. Completion: Y hours left\" (computed from remaining pages / speed.averagePagesPerHour). Use the existing `Card` component from `@mylife/ui` and maintain Cool Obsidian styling."}, {"id": "BOOKS-05", "module": "books", "title": "Discovery Engine -- useDiscovery hook", "dependsOn": [], "filesToEdit": ["apps/mobile/hooks/books/use-discovery.ts", "apps/mobile/hooks/books/index.ts"], "referenceLogic": ["modules/books/src/discovery/discovery-engine.ts", "modules/books/src/discovery/types.ts"], "prompt": "Create `useDiscovery` hook in `apps/mobile/hooks/books/use-discovery.ts`. Import `discoverBooks` and `getBookDiscoveryProfile` from `@mylife/books`. Import `getDistinctMoodValues`, `getDistinctWarnings` from `@mylife/books`. Use `useDatabase()`. Return `{ results: Book[], filters: DiscoveryFilters, setFilters(f), availableMoods: string[], availablePaces: string[], availableGenres: string[], availableWarnings: string[], loading, refresh() }`. `availableMoods` calls `getDistinctMoodValues(db, 'mood')`, similarly for paces and genres. `results` calls `discoverBooks(db, filters)`. Follow the `useState` + `useCallback` + `useEffect` pattern from `use-books.ts`. Export from the hooks barrel."}, {"id": "BOOKS-06", "module": "books", "title": "Discovery Engine -- DiscoverScreen", "dependsOn": ["BOOKS-05"], "filesToEdit": ["apps/mobile/app/(books)/discover.tsx"], "referenceLogic": ["modules/books/src/discovery/types.ts", "apps/mobile/app/(books)/library.tsx"], "prompt": "Create `DiscoverScreen` at `apps/mobile/app/(books)/discover.tsx`. Uses `useDiscovery()` hook. Layout: (1) Header \"Discover Books\" with subtitle \"Find your next read by mood, pace, or genre\". (2) Filter section: horizontal `ScrollView` chips for mood (from `availableMoods`), tappable to toggle. Second row for pace. Third row for genre. Each chip is a `Pressable` with `colors.surface` background, `colors.modules.books` when selected, `borderRadius: 999`, padding `spacing.xs` horizontal `spacing.sm`. (3) Optional \"Exclude content warnings\" expandable section showing `availableWarnings` as toggleable chips. (4) Results grid using the existing `BookGrid` component, passing `results`. Show empty state \"Adjust your filters to discover books\" when no results. Show skeleton loading state matching `library.tsx` pattern. Navigation: `onPress` goes to `/(books)/book/${id}`."}, {"id": "BOOKS-07", "module": "books", "title": "Discovery Engine -- Wire into navigation", "dependsOn": ["BOOKS-06"], "filesToEdit": ["apps/mobile/app/(books)/_layout.tsx"], "referenceLogic": [], "prompt": "Edit `apps/mobile/app/(books)/_layout.tsx`. Add a hidden screen entry for the discover route: `<Tabs.Screen name=\"discover\" options={{ href: null }} />`. This keeps discover accessible via `router.push` without adding a tab bar entry. The discover screen will be linked from the home screen's action buttons."}, {"id": "BOOKS-08", "module": "books", "title": "Reading Challenges -- useChallenges hook", "dependsOn": [], "filesToEdit": ["apps/mobile/hooks/books/use-challenges.ts", "apps/mobile/hooks/books/index.ts"], "referenceLogic": ["modules/books/src/challenges/challenge-engine.ts", "modules/books/src/db/challenges.ts", "modules/books/src/challenges/types.ts"], "prompt": "Create `useChallenges` hook. Import `getActiveChallengeStatuses`, `getChallengeStatus` from `@mylife/books`. Import `createChallenge`, `getAllChallenges`, `deactivateChallenge`, `deleteChallenge` from `@mylife/books`. Use `useDatabase()`. Return `{ activeStatuses: ChallengeStatus[], allChallenges: Challenge[], loading, refresh(), create(input), deactivate(id), remove(id) }`. `create` calls `createChallenge(db, crypto.randomUUID(), input)` then refreshes. `activeStatuses` calls `getActiveChallengeStatuses(db)`. Follow the hook pattern from `use-sessions.ts`. Export from barrel."}, {"id": "BOOKS-09", "module": "books", "title": "Reading Challenges -- ChallengesScreen", "dependsOn": ["BOOKS-08"], "filesToEdit": ["apps/mobile/app/(books)/challenges.tsx"], "referenceLogic": ["modules/books/src/challenges/types.ts"], "prompt": "Create `ChallengesScreen`. Uses `useChallenges()`. Layout: (1) Header \"Reading Challenges\" with a \"+\" button to create a new challenge. (2) Active challenges section: for each `ChallengeStatus`, render a `Card` showing challenge name, progress bar (width = `percentComplete`%), value text \"X / Y books|pages|minutes\", and a checkmark icon if `isComplete`. Progress bar uses `colors.modules.books` fill on `colors.surfaceElevated` track. (3) Completed challenges section (filtered where `isComplete === true`), shown below with muted styling. (4) Empty state: \"No active challenges. Set a reading goal to get started!\" with a \"Create Challenge\" button. (5) Create flow: \"+\" button shows a modal with fields: name (TextInput), type picker (books_count | pages_count | minutes_count | themed), target value (numeric input), and a \"Start\" button. Use Cool Obsidian tokens. Wire `deactivate` to a long-press menu on each card."}, {"id": "BOOKS-10", "module": "books", "title": "Reading Challenges -- Wire into navigation", "dependsOn": ["BOOKS-09"], "filesToEdit": ["apps/mobile/app/(books)/_layout.tsx"], "referenceLogic": [], "prompt": "Edit `apps/mobile/app/(books)/_layout.tsx`. Add hidden screen: `<Tabs.Screen name=\"challenges\" options={{ href: null }} />`. Add navigation entry point from the home screen or stats screen as a \"Challenges\" action button."}, {"id": "BOOKS-11", "module": "books", "title": "Book Clubs -- useClubs hook", "dependsOn": [], "filesToEdit": ["apps/mobile/hooks/books/use-clubs.ts", "apps/mobile/hooks/books/index.ts"], "referenceLogic": ["modules/books/src/clubs/club-engine.ts", "modules/books/src/db/clubs.ts", "modules/books/src/db/club-notes.ts", "modules/books/src/db/club-history.ts", "modules/books/src/clubs/types.ts"], "prompt": "Create `useClubs` hook. Import `getActiveClubs`, `getAllClubs`, `createClub`, `deleteClub` from `@mylife/books`. Import `getClubProgress`, `setNextBook` from `@mylife/books`. Import `createClubNote`, `getNotesForClub`, `getHistoryForClub` from `@mylife/books`. Use `useDatabase()`. Return `{ clubs: ClubWithProgress[], loading, refresh(), create(input), remove(id), setBook(clubId, bookId, start?, end?), addNote(clubId, input), getNotes(clubId), getHistory(clubId) }`. `clubs` maps `getActiveClubs(db)` through `getClubProgress(db, club.id)`. Export from barrel."}, {"id": "BOOKS-12", "module": "books", "title": "Book Clubs -- ClubsScreen (list)", "dependsOn": ["BOOKS-11"], "filesToEdit": ["apps/mobile/app/(books)/clubs.tsx"], "referenceLogic": ["modules/books/src/clubs/types.ts"], "prompt": "Create `ClubsScreen`. Uses `useClubs()`. Layout: (1) Header \"Book Clubs\" with \"+\" create button. (2) For each `ClubWithProgress`: a `Card` showing club name, current book title + cover (using `BookCover` from `@mylife/ui`), days remaining badge (red if `isOverdue`), progress bar for `readingProgress`. (3) Tap a club card to navigate to `/(books)/club/${club.club.id}`. (4) Empty state: \"Start a book club to read together. Track your group's pace and share notes.\" with \"Create Club\" button. (5) Create modal: name (TextInput), description (TextInput), \"Create\" button. Use Cool Obsidian tokens."}, {"id": "BOOKS-13", "module": "books", "title": "Book Clubs -- ClubDetailScreen", "dependsOn": ["BOOKS-11"], "filesToEdit": ["apps/mobile/app/(books)/club/[id].tsx"], "referenceLogic": ["modules/books/src/clubs/club-engine.ts", "modules/books/src/db/club-notes.ts", "modules/books/src/db/club-history.ts"], "prompt": "Create `ClubDetailScreen` at `apps/mobile/app/(books)/club/[id].tsx`. Uses `useClubs()` filtered to the route param `id`. Layout: (1) Club name header. (2) Current book section: cover image, title, author, progress bar, days remaining text (or \"Overdue\" badge in `colors.danger`). (3) \"Set Next Book\" button opening a book picker (list from `useBooks()`, tap to call `setBook`). (4) Club Notes section: list of notes for this club (call `getNotes(clubId)`), each showing content + created_at. \"Add Note\" button opens a TextInput modal. (5) Reading History section: past books list from `getHistory(clubId)`, showing title and date range. Use `Card` from `@mylife/ui`, Cool Obsidian tokens."}, {"id": "BOOKS-14", "module": "books", "title": "Book Clubs -- Wire into navigation", "dependsOn": ["BOOKS-12", "BOOKS-13"], "filesToEdit": ["apps/mobile/app/(books)/_layout.tsx"], "referenceLogic": [], "prompt": "Edit `apps/mobile/app/(books)/_layout.tsx`. Add hidden screens: `<Tabs.Screen name=\"clubs\" options={{ href: null }} />` and `<Tabs.Screen name=\"club/[id]\" options={{ href: null }} />`."}, {"id": "BOOKS-15", "module": "books", "title": "Badge System -- useBadges hook", "dependsOn": [], "filesToEdit": ["apps/mobile/hooks/books/use-badges.ts", "apps/mobile/hooks/books/index.ts"], "referenceLogic": ["modules/books/src/badges/badge-engine.ts", "modules/books/src/badges/types.ts", "modules/books/src/badges/definitions.ts", "modules/books/src/db/badges.ts"], "prompt": "Create `useBadges` hook. Import `evaluateBadges`, `gatherBadgeStats` from `@mylife/books`. Import `getAllBadges`, `getEarnedBadges`, `getBadgesByCategory` from `@mylife/books`. Import `BADGE_CATEGORIES` from `@mylife/books`. Use `useDatabase()`. Return `{ evaluation: BadgeEvaluationResult | null, stats: BadgeStats | null, categories: typeof BADGE_CATEGORIES, badgesByCategory: Record<string, BadgeProgress[]>, loading, refresh(), evaluate() }`. `evaluate` calls `evaluateBadges(db)` and sets the result. `badgesByCategory` groups `evaluation.allProgress` by `badge.category`. Export from barrel."}, {"id": "BOOKS-16", "module": "books", "title": "Badge System -- BadgeCard component", "dependsOn": ["BOOKS-15"], "filesToEdit": ["apps/mobile/components/books/BadgeCard.tsx"], "referenceLogic": ["modules/books/src/badges/types.ts", "modules/books/src/db/badges.ts"], "prompt": "Create `BadgeCard` component. Props: `{ progress: BadgeProgress }`. Renders a card showing: (1) badge icon (emoji from `badge.icon`) at 36px, (2) badge name, (3) badge description in `colors.textSecondary`, (4) progress bar: if `isEarned`, fill is 100% with a gold tint `#FFD700`, else fill width is `(currentValue / badge.threshold) * 100`%, (5) progress text from `progressText` (\"5/10\"), (6) earned date if `isEarned` formatted as \"Earned MMM DD, YYYY\", (7) tier indicator: bronze/silver/gold/platinum as a small colored dot. Unearned badges show slightly muted opacity (0.7). Card background is `colors.surface`, border `colors.border`. Size is ~160px wide for a 2-column grid."}, {"id": "BOOKS-17", "module": "books", "title": "Badge System -- BadgeGalleryScreen", "dependsOn": ["BOOKS-15", "BOOKS-16"], "filesToEdit": ["apps/mobile/app/(books)/badges.tsx"], "referenceLogic": ["modules/books/src/badges/definitions.ts"], "prompt": "Create `BadgeGalleryScreen`. Uses `useBadges()`. Layout: (1) Header \"Achievements\" with earned count \"X / 31 earned\". (2) Stats summary row: total books, total pages, current streak, genres explored (from `stats`). (3) Category sections: for each category in `BADGE_CATEGORIES`, render a section header (capitalize category name) followed by a 2-column `FlatList` of `BadgeCard` components for that category's badges. (4) Newly earned celebration: if `evaluate()` returns `newlyEarned.length > 0`, show a brief toast/animation with the badge icon and \"Badge unlocked: [name]!\". (5) Call `evaluate()` on mount and on pull-to-refresh. Skeleton loading: 6 placeholder cards in a grid. Use Cool Obsidian tokens."}, {"id": "BOOKS-18", "module": "books", "title": "Badge System -- Wire into navigation", "dependsOn": ["BOOKS-17"], "filesToEdit": ["apps/mobile/app/(books)/_layout.tsx"], "referenceLogic": [], "prompt": "Edit `apps/mobile/app/(books)/_layout.tsx`. Add hidden screen: `<Tabs.Screen name=\"badges\" options={{ href: null }} />`. The badge gallery is accessible from the stats screen or home screen via an \"Achievements\" link."}, {"id": "BOOKS-19", "module": "books", "title": "Reading Journal -- useJournal hook", "dependsOn": [], "filesToEdit": ["apps/mobile/hooks/books/use-journal.ts", "apps/mobile/hooks/books/index.ts"], "referenceLogic": ["modules/books/src/journal/journal-engine.ts", "modules/books/src/journal/types.ts", "modules/books/src/db/journal-entries.ts", "modules/books/src/db/journal-photos.ts", "modules/books/src/db/journal-book-links.ts"], "prompt": "Create `useJournal` hook. Import `createEntry`, `getDecryptedEntry`, `getJournalStats`, `getReflectionsForBook`, `exportJournalToMarkdown` from `@mylife/books`. Import `getJournalEntries`, `deleteJournalEntry`, `searchJournalEntries` from `@mylife/books`. Import `addJournalPhoto`, `getPhotosForEntry`, `removeJournalPhoto` from `@mylife/books`. Use `useDatabase()`. Return `{ entries: JournalEntry[], stats: JournalStats | null, loading, refresh(), create(content, options?: CreateEntryOptions), decrypt(entryId, passphrase?), getForBook(bookId), search(query), remove(id), addPhoto(entryId, uri), getPhotos(entryId), removePhoto(photoId), exportMarkdown(entryIds?) }`. The `create` function is async because encryption is async. Follow existing hook patterns. Export from barrel."}, {"id": "BOOKS-20", "module": "books", "title": "Reading Journal -- JournalEntryCard component", "dependsOn": ["BOOKS-19"], "filesToEdit": ["apps/mobile/components/books/JournalEntryCard.tsx"], "referenceLogic": ["modules/books/src/models/schemas.ts"], "prompt": "Create `JournalEntryCard` component. Props: `{ entry: JournalEntry, onPress(), onLongPress?() }`. Renders: (1) date header formatted \"MMM DD, YYYY\" from `entry.created_at`, (2) title if present in bold, (3) content preview (first 120 chars, truncated with ellipsis), (4) if `entry.content_encrypted === 1`, show a lock icon and \"Encrypted\" badge instead of content preview, (5) mood badge if `entry.mood` is set (colored pill), (6) word count in `colors.textTertiary` (\"X words\"), (7) favorite star indicator if `entry.is_favorite`. Background `colors.surface`, border `colors.border`, borderRadius 14. Pressable with subtle opacity feedback."}, {"id": "BOOKS-21", "module": "books", "title": "Reading Journal -- JournalScreen (list + create)", "dependsOn": ["BOOKS-19", "BOOKS-20"], "filesToEdit": ["apps/mobile/app/(books)/journal.tsx"], "referenceLogic": ["modules/books/src/journal/types.ts"], "prompt": "Create `JournalScreen`. Uses `useJournal()`. Layout: (1) Header \"Reading Journal\" with stats summary (total entries, current streak, entries this month from `stats`). (2) Search bar using `SearchBar` from `@mylife/ui`, calls `search(query)`. (3) \"New Entry\" FAB button (bottom-right, circular, `colors.modules.books` background). (4) Entry list: `FlatList` of `JournalEntryCard` components, newest first. Tap navigates to `/(books)/journal/${entry.id}`. (5) Empty state: \"Your reading journal is private and encrypted. Start writing about what you read.\" (6) \"New Entry\" flow: navigate to `/(books)/journal/new`. (7) Pull-to-refresh. Skeleton loading. Cool Obsidian tokens."}, {"id": "BOOKS-22", "module": "books", "title": "Reading Journal -- JournalEntryScreen (view/edit)", "dependsOn": ["BOOKS-19"], "filesToEdit": ["apps/mobile/app/(books)/journal/[id].tsx"], "referenceLogic": ["modules/books/src/journal/journal-engine.ts", "modules/books/src/journal/encryption.ts"], "prompt": "Create `JournalEntryScreen` at `apps/mobile/app/(books)/journal/[id].tsx`. Uses `useJournal()`. On mount, call `decrypt(id, passphrase)` if encrypted. Layout: (1) If encrypted and no passphrase provided, show a passphrase input screen with \"Enter your passphrase to decrypt this entry\" and a `TextInput` + \"Unlock\" button. (2) Once decrypted: show title (editable), full content (editable `TextInput` multiline), mood selector (horizontal chip row), linked books (from `getLinkedBooks`). (3) Photo gallery: horizontal scroll of photos from `getPhotos(id)`. \"Add Photo\" button triggers image picker. (4) Action buttons: \"Export as Markdown\", \"Delete\" (with confirmation alert). (5) Auto-save on blur. Cool Obsidian tokens."}, {"id": "BOOKS-23", "module": "books", "title": "Reading Journal -- JournalNewScreen (create)", "dependsOn": ["BOOKS-19"], "filesToEdit": ["apps/mobile/app/(books)/journal/new.tsx"], "referenceLogic": ["modules/books/src/journal/types.ts"], "prompt": "Create `JournalNewScreen`. Uses `useJournal()`. Layout: (1) Title input (optional TextInput, placeholder \"Entry title (optional)\"). (2) Content input (multiline TextInput, placeholder \"Write about what you're reading...\", auto-focus, min height 200). (3) Mood selector: horizontal row of mood chips (\"reflective\", \"excited\", \"sad\", \"inspired\", \"confused\", \"peaceful\"). (4) Book linker: \"Link to a book\" button opens a picker from `useBooks()`, multi-select, shows selected books as pills. (5) Encryption toggle: Switch labeled \"Encrypt this entry\" with a passphrase input that appears when toggled on. (6) \"Save\" button calls `create(content, { title, mood, bookIds, passphrase })`. Navigate back on success. Cool Obsidian tokens. Word count displayed in real-time at bottom."}, {"id": "BOOKS-24", "module": "books", "title": "Reading Journal -- Wire into navigation", "dependsOn": ["BOOKS-21", "BOOKS-22", "BOOKS-23"], "filesToEdit": ["apps/mobile/app/(books)/_layout.tsx"], "referenceLogic": [], "prompt": "Edit `apps/mobile/app/(books)/_layout.tsx`. Add hidden screens: `<Tabs.Screen name=\"journal\" options={{ href: null }} />`, `<Tabs.Screen name=\"journal/[id]\" options={{ href: null }} />`, `<Tabs.Screen name=\"journal/new\" options={{ href: null }} />`."}, {"id": "BOOKS-25", "module": "books", "title": "Reading Insights -- useInsights hook", "dependsOn": [], "filesToEdit": ["apps/mobile/hooks/books/use-insights.ts", "apps/mobile/hooks/books/index.ts"], "referenceLogic": ["modules/books/src/insights/insights-engine.ts", "modules/books/src/insights/genre-evolution.ts", "modules/books/src/insights/on-this-day.ts", "modules/books/src/insights/types.ts"], "prompt": "Create `useInsights` hook. Import `computeInsights`, `computeGenreEvolution`, `getOnThisDay` from `@mylife/books`. Use `useDatabase()`. Return `{ insights: InsightSet | null, genreEvolution: GenreEvolutionTimeline | null, onThisDay: OnThisDayEvent[], loading, refresh() }`. All three are computed on mount and refresh. `onThisDay` calls `getOnThisDay(db)` with no args (defaults to today). Follow existing hook patterns. Export from barrel."}, {"id": "BOOKS-26", "module": "books", "title": "Reading Insights -- InsightCard component", "dependsOn": ["BOOKS-25"], "filesToEdit": ["apps/mobile/components/books/InsightCard.tsx"], "referenceLogic": ["modules/books/src/insights/types.ts"], "prompt": "Create `InsightCard` component. Props: `{ insight: ReadingInsight }`. Renders a `Card` from `@mylife/ui` containing: (1) category icon (map: speed -> stopwatch, timing -> clock, diversity -> palette, consistency -> flame, milestones -> trophy), (2) `insight.title` as subheading, (3) `insight.description` as body text in `colors.textSecondary`, (4) if `insight.comparisonValue` exists, show a comparison badge: \"[value] [comparisonLabel]\" in a pill with `colors.modules.books` background. Card has a subtle left border accent matching the category color. Cool Obsidian tokens."}, {"id": "BOOKS-27", "module": "books", "title": "Reading Insights -- InsightsScreen", "dependsOn": ["BOOKS-25", "BOOKS-26"], "filesToEdit": ["apps/mobile/app/(books)/insights.tsx"], "referenceLogic": ["modules/books/src/insights/types.ts"], "prompt": "Create `InsightsScreen`. Uses `useInsights()`. Layout: (1) Header \"Reading Insights\". (2) If `insights.insufficientData`, show \"Read at least 5 books to unlock personalized insights\" with a book icon and `colors.textTertiary`. (3) \"On This Day\" section at top: if `onThisDay.length > 0`, show a horizontal card carousel of events. Each card shows book cover thumbnail, event type badge (\"Started\", \"Finished\", \"Added\", \"Reviewed\"), book title, year. If no events: \"Nothing on this day in years past.\" (4) Insights list: vertical `FlatList` of `InsightCard` for each insight in `insights.insights`. (5) Genre Evolution section: for each period in `genreEvolution.periods`, show the period label (year) and top 3 genres as horizontal bars. If `dominantGenreShifts.length > 0`, show shift cards \"Your top genre shifted from [from] to [to] in [period]\". (6) Pull-to-refresh. Skeleton loading. Cool Obsidian tokens."}, {"id": "BOOKS-28", "module": "books", "title": "Reading Insights -- Wire into navigation", "dependsOn": ["BOOKS-27"], "filesToEdit": ["apps/mobile/app/(books)/_layout.tsx"], "referenceLogic": [], "prompt": "Edit `apps/mobile/app/(books)/_layout.tsx`. Add hidden screen: `<Tabs.Screen name=\"insights\" options={{ href: null }} />`. Link from the stats screen with a \"View Insights\" button or card."}, {"id": "BOOKS-29", "module": "books", "title": "Quote Collection -- useQuotes hook", "dependsOn": [], "filesToEdit": ["apps/mobile/hooks/books/use-quotes.ts", "apps/mobile/hooks/books/index.ts"], "referenceLogic": ["modules/books/src/db/quotes.ts", "modules/books/src/quotes/types.ts"], "prompt": "Create `useQuotes` hook. Import all quote CRUD from `@mylife/books`: `createQuote`, `getQuotes`, `getQuoteById`, `updateQuote`, `deleteQuote`, `getRandomQuote`, `getFavoriteQuotes`, `getQuoteCount`. Use `useDatabase()`. Return `{ quotes: QuoteWithBook[], random: QuoteWithBook | null, favorites: QuoteWithBook[], count: number, loading, refresh(), create(input: CreateQuoteInput), update(id, updates), remove(id), search(text: string), toggleFavorite(id, current), refreshRandom() }`. `quotes` calls `getQuotes(db, filter)`. `search` calls `getQuotes(db, { searchText })`. `toggleFavorite` calls `updateQuote(db, id, { is_favorite: current ? 0 : 1 })`. Export from barrel."}, {"id": "BOOKS-30", "module": "books", "title": "Quote Collection -- QuoteCard component", "dependsOn": ["BOOKS-29"], "filesToEdit": ["apps/mobile/components/books/QuoteCard.tsx"], "referenceLogic": ["modules/books/src/quotes/types.ts"], "prompt": "Create `QuoteCard` component. Props: `{ item: QuoteWithBook, onPress?(), onToggleFavorite?(), showBookInfo?: boolean }`. Renders: (1) large opening quotation mark in `colors.modules.books` at 32px, (2) quote content in italic serif-style text (`fontStyle: 'italic'`), (3) attribution line: book title in bold + author in regular, (4) page reference if `quote.page_number` (\"p. X\"), chapter if `quote.chapter`, (5) personal note if `quote.note` in `colors.textTertiary`, (6) favorite heart icon (filled if `is_favorite === 1`, outline otherwise), tappable calling `onToggleFavorite`. Card: `colors.surface` background, `colors.border` border, borderRadius 14, padding `spacing.md`. If `showBookInfo` is true, include small `BookCover` thumbnail."}, {"id": "BOOKS-31", "module": "books", "title": "Quote Collection -- QuotesScreen", "dependsOn": ["BOOKS-29", "BOOKS-30"], "filesToEdit": ["apps/mobile/app/(books)/quotes.tsx"], "referenceLogic": [], "prompt": "Create `QuotesScreen`. Uses `useQuotes()`. Layout: (1) Header \"Quotes\" with count badge showing `count`. (2) \"Random Quote\" hero card at top: shows `random` quote in a larger `QuoteCard`, with a \"Shuffle\" button to call `refreshRandom()`. (3) Search bar using `SearchBar` from `@mylife/ui`, calls `search(text)`. (4) Filter tabs: \"All\", \"Favorites\", tappable to switch between `quotes` and `favorites`. (5) Quote list: `FlatList` of `QuoteCard` components. Tap opens a detail/edit modal (inline edit: content, note, page, chapter, toggle favorite). Swipe-to-delete calls `remove(id)` with confirmation. (6) \"Add Quote\" FAB button (bottom-right) navigating to `/(books)/quotes/new`. (7) Empty state: \"Save your favorite passages. Quotes you save will appear here.\" Cool Obsidian tokens."}, {"id": "BOOKS-32", "module": "books", "title": "Quote Collection -- QuoteNewScreen", "dependsOn": ["BOOKS-29"], "filesToEdit": ["apps/mobile/app/(books)/quotes/new.tsx"], "referenceLogic": ["modules/books/src/quotes/types.ts"], "prompt": "Create `QuoteNewScreen`. Uses `useQuotes()` and `useBooks()`. Layout: (1) Book selector: \"Select Book\" button opens a book picker list from `useBooks()`, shows selected book title + cover. (2) Quote content: multiline `TextInput`, placeholder \"Enter the quote...\", required. (3) Page number: numeric `TextInput`, optional. (4) Chapter: `TextInput`, optional. (5) Personal note: multiline `TextInput`, optional. (6) Favorite toggle: Switch. (7) \"Save Quote\" button calls `create({ book_id, content, page_number, chapter, note, is_favorite, source: 'manual' })`, navigates back on success. Validate: book must be selected, content must not be empty. Cool Obsidian tokens."}, {"id": "BOOKS-33", "module": "books", "title": "Quote Collection -- Wire into navigation", "dependsOn": ["BOOKS-31", "BOOKS-32"], "filesToEdit": ["apps/mobile/app/(books)/_layout.tsx"], "referenceLogic": [], "prompt": "Edit `apps/mobile/app/(books)/_layout.tsx`. Add hidden screens: `<Tabs.Screen name=\"quotes\" options={{ href: null }} />`, `<Tabs.Screen name=\"quotes/new\" options={{ href: null }} />`."}, {"id": "BOOKS-34", "module": "books", "title": "Sharing Cards -- useSharing hook", "dependsOn": [], "filesToEdit": ["apps/mobile/hooks/books/use-sharing.ts", "apps/mobile/hooks/books/index.ts"], "referenceLogic": ["modules/books/src/sharing/card-renderer.ts", "modules/books/src/sharing/templates.ts", "modules/books/src/sharing/types.ts"], "prompt": "Create `useSharing` hook. Import `getTemplateAvailability`, `buildCardData`, `getCardThemeColors`, `getCardDimensions` from `@mylife/books`. Import `CARD_TEMPLATES` from `@mylife/books`. Import `calculateReadingStats` from `@mylife/books`. Import `gatherBadgeStats` from `@mylife/books`. Use `useDatabase()`. Return `{ templates: TemplateAvailability[], buildCard(templateId, theme, displayName, showName): CardData, themeColors(theme): ReturnType<typeof getCardThemeColors>, dimensions: { width, height } }`. `templates` computes from `calculateReadingStats(db)` + `gatherBadgeStats(db)` for genre/author counts. Export from barrel."}, {"id": "BOOKS-35", "module": "books", "title": "Sharing Cards -- ShareCardPreview component", "dependsOn": ["BOOKS-34"], "filesToEdit": ["apps/mobile/components/books/ShareCardPreview.tsx"], "referenceLogic": ["modules/books/src/sharing/types.ts"], "prompt": "Create `ShareCardPreview` component. Props: `{ data: CardData, width?: number }`. Renders a visual preview of the share card matching the template. The component scales to fit the given width (default 300) while maintaining 9:16 aspect ratio. Background uses `getCardThemeColors(data.theme)`. Layout varies by `data.templateId`: (1) `year_summary`: display name, total books count, total pages, average rating, top books list. (2) `monthly_chart`: bar chart of monthly books. (3) `genre_breakdown`: horizontal bars for genre distribution. (4) `top_authors`: ranked list with counts. (5) `reading_streak`: current/longest streak numbers with dot grid for recent days. Use `View` + `StyleSheet` for layout. Text colors from theme. \"MyBooks\" watermark at bottom."}, {"id": "BOOKS-36", "module": "books", "title": "Sharing Cards -- ShareScreen", "dependsOn": ["BOOKS-34", "BOOKS-35"], "filesToEdit": ["apps/mobile/app/(books)/share.tsx"], "referenceLogic": ["modules/books/src/sharing/types.ts"], "prompt": "Create `ShareScreen`. Uses `useSharing()`. Layout: (1) Header \"Share Your Reading\". (2) Template selector: horizontal scroll of template cards. Each shows template name, a mini preview, and \"Available\" / \"Locked\" badge based on `templates` availability. Locked templates show the `reason` text. (3) Theme picker: 3 tappable circles for dark/accent/light themes. (4) Display name input and \"Show name\" toggle. (5) Full-size `ShareCardPreview` of the selected template + theme. (6) \"Share\" button: uses `expo-sharing` to capture the preview as an image (via `react-native-view-shot` or `captureRef`) and share via system share sheet. No data sent to any server. Cool Obsidian tokens."}, {"id": "BOOKS-37", "module": "books", "title": "Sharing Cards -- Wire into navigation", "dependsOn": ["BOOKS-36"], "filesToEdit": ["apps/mobile/app/(books)/_layout.tsx"], "referenceLogic": [], "prompt": "Edit `apps/mobile/app/(books)/_layout.tsx`. Add hidden screen: `<Tabs.Screen name=\"share\" options={{ href: null }} />`. Accessible from the stats screen via a \"Share Stats\" button."}, {"id": "BOOKS-38", "module": "books", "title": "Recommendations -- useRecommendations hook", "dependsOn": [], "filesToEdit": ["apps/mobile/hooks/books/use-recommendations.ts", "apps/mobile/hooks/books/index.ts"], "referenceLogic": ["modules/books/src/recommendations/engine.ts", "modules/books/src/recommendations/types.ts"], "prompt": "Create `useRecommendations` hook. Import `computeRecommendations` from `@mylife/books`. Use `useDatabase()`. Return `{ recommendations: RecommendationSet | null, loading, refresh() }`. Calls `computeRecommendations(db)` on mount and refresh. The computation is synchronous (all local SQLite), so wrap in `useEffect` with a loading state. Export from barrel."}, {"id": "BOOKS-39", "module": "books", "title": "Recommendations -- RecommendationCard component", "dependsOn": ["BOOKS-38"], "filesToEdit": ["apps/mobile/components/books/RecommendationCard.tsx"], "referenceLogic": ["modules/books/src/recommendations/types.ts"], "prompt": "Create `RecommendationCard` component. Props: `{ recommendation: Recommendation, onPress() }`. Renders: (1) `BookCover` from `@mylife/ui` with `coverUrl`, size \"medium\". (2) Book title (bold, 1 line). (3) Authors joined by \", \". (4) Reason badge: `recommendation.reason` in a pill with `colors.modules.books` background at 0.15 opacity, text in `colors.modules.books`. (5) Source indicator: small text \"Author match\" / \"Genre match\" / \"Similar taste\" based on `recommendation.source`. Pressable, navigates to book detail. Card style: horizontal layout, `colors.surface` background, borderRadius 14."}, {"id": "BOOKS-40", "module": "books", "title": "Recommendations -- RecommendationsScreen", "dependsOn": ["BOOKS-38", "BOOKS-39"], "filesToEdit": ["apps/mobile/app/(books)/recommendations.tsx"], "referenceLogic": ["modules/books/src/recommendations/types.ts"], "prompt": "Create `RecommendationsScreen`. Uses `useRecommendations()`. Layout: (1) Header \"For You\" with subtitle \"Personalized recommendations based on your reading\". (2) If `insufficientData`, show \"Rate at least 5 books to unlock recommendations\" with a rating icon and progress text \"You've rated X books\". (3) Three sections with headers: \"More from authors you love\" (`authorAffinity`), \"Popular in your favorite genres\" (`genreAffinity`), \"Similar to books you liked\" (`similarBooks`). (4) Each section: horizontal `FlatList` of `RecommendationCard` components, snap-to-item scrolling. (5) Tap navigates to `/(books)/book/${bookId}`. (6) Pull-to-refresh calls `refresh()`. Empty sections are hidden. Skeleton loading. Cool Obsidian tokens."}, {"id": "BOOKS-41", "module": "books", "title": "Recommendations -- Wire into navigation", "dependsOn": ["BOOKS-40"], "filesToEdit": ["apps/mobile/app/(books)/_layout.tsx"], "referenceLogic": [], "prompt": "Edit `apps/mobile/app/(books)/_layout.tsx`. Add hidden screen: `<Tabs.Screen name=\"recommendations\" options={{ href: null }} />`. Accessible from the home screen as a \"For You\" card/button."}, {"id": "BOOKS-42", "module": "books", "title": "Series Tracking -- useSeries hook", "dependsOn": [], "filesToEdit": ["apps/mobile/hooks/books/use-series.ts", "apps/mobile/hooks/books/index.ts"], "referenceLogic": ["modules/books/src/db/series.ts", "modules/books/src/db/series-books.ts"], "prompt": "Create `useSeries` hook. Import series CRUD from `@mylife/books`: `createSeries`, `getAllSeries`, `getSeries`, `updateSeries`, `deleteSeries`, `addBookToSeries`, `removeBookFromSeries`, `getBooksInSeries`, `reorderSeriesBook`, `getNextUnread`. Use `useDatabase()`. Return `{ allSeries: Series[], loading, refresh(), create(name, author?), remove(id), addBook(seriesId, bookId, order), removeBook(seriesId, bookId), getBooks(seriesId), nextUnread(seriesId) }`. Follow existing hook patterns. Export from barrel."}, {"id": "BOOKS-43", "module": "books", "title": "Series Tracking -- SeriesScreen (list)", "dependsOn": ["BOOKS-42"], "filesToEdit": ["apps/mobile/app/(books)/series.tsx"], "referenceLogic": ["modules/books/src/models/schemas.ts"], "prompt": "Create `SeriesScreen`. Uses `useSeries()`. Layout: (1) Header \"Series\" with \"+\" create button. (2) Series list: for each series, show a `Card` with series name, author (if set), book count (from `getBooks(seriesId).length`). Tap navigates to `/(books)/series/${series.id}`. (3) Empty state: \"Track book series to keep your reading order straight.\" with \"Create Series\" button. (4) Create modal: name TextInput, author TextInput (optional), \"Create\" button. (5) Swipe-to-delete with confirmation. Skeleton loading. Cool Obsidian tokens."}, {"id": "BOOKS-44", "module": "books", "title": "Series Tracking -- SeriesDetailScreen", "dependsOn": ["BOOKS-42"], "filesToEdit": ["apps/mobile/app/(books)/series/[id].tsx"], "referenceLogic": ["modules/books/src/db/series-books.ts"], "prompt": "Create `SeriesDetailScreen` at `apps/mobile/app/(books)/series/[id].tsx`. Uses `useSeries()`. Layout: (1) Series name as header, author subtitle. (2) \"Next Unread\" hero card: calls `nextUnread(seriesId)`, shows the book cover + title + \"Start Reading\" button navigating to `/(books)/book/${id}`. If all read, show \"Series Complete!\" badge. (3) Ordered book list: numbered list (1, 2, 3...) of books from `getBooks(seriesId)`, each showing cover, title, author, and status badge (read = green checkmark, unread = gray circle). Tap navigates to book detail. (4) \"Add Book\" button opens a picker from `useBooks()` to add a book with the next sort_order. (5) Reorder: long-press to drag-reorder (or up/down arrow buttons). Cool Obsidian tokens."}, {"id": "BOOKS-45", "module": "books", "title": "Series Tracking -- Wire into navigation", "dependsOn": ["BOOKS-43", "BOOKS-44"], "filesToEdit": ["apps/mobile/app/(books)/_layout.tsx"], "referenceLogic": [], "prompt": "Edit `apps/mobile/app/(books)/_layout.tsx`. Add hidden screens: `<Tabs.Screen name=\"series\" options={{ href: null }} />`, `<Tabs.Screen name=\"series/[id]\" options={{ href: null }} />`."}, {"id": "BOOKS-46", "module": "books", "title": "Social Feed -- useSocialFeed hook", "dependsOn": [], "filesToEdit": ["apps/mobile/hooks/books/use-social.ts", "apps/mobile/hooks/books/index.ts"], "referenceLogic": ["modules/books/src/social/feed-engine.ts", "modules/books/src/social/types.ts"], "prompt": "Create `useSocialFeed` hook. This hook requires a Supabase client injected from the app layer. Accept optional `supabaseClient` prop (type `SocialSupabaseClient` from `@mylife/books`). Import all social functions from `@mylife/books`. Return `{ feed: FeedResult | null, friends: FriendConnection[], loading, error: string | null, enabled: boolean, refresh(), sendRequest(responderId), acceptRequest(connectionId), rejectRequest(connectionId), block(connectionId), unfriend(connectionId), syncEvent(input: SyncShareEventInput) }`. `enabled` is `!!supabaseClient`. If not enabled, all functions are no-ops and feed is null. Wrap all async calls in try/catch setting `error`. Export from barrel."}, {"id": "BOOKS-47", "module": "books", "title": "Social Feed -- FeedItemCard component", "dependsOn": ["BOOKS-46"], "filesToEdit": ["apps/mobile/components/books/FeedItemCard.tsx"], "referenceLogic": ["modules/books/src/social/types.ts"], "prompt": "Create `FeedItemCard` component. Props: `{ item: FeedItem, onBookPress?(bookId: string) }`. Renders: (1) User row: avatar circle (first letter of `displayName` if no `avatarUrl`), display name, time ago string from `createdAt`. (2) Event content varies by `eventType`: `book_finished` -> \"Finished [title]\" with cover, `book_rating` -> \"Rated [title]\" with star display, `book_review` -> \"Reviewed [title]\" with excerpt preview, `book_started` -> \"Started reading [title]\", `book_added` -> \"Added [title] to library\". (3) Book cover thumbnail from `bookCoverUrl` if available. (4) Author text from `bookAuthors`. Card: `colors.surface` background, borderRadius 14, padding `spacing.md`."}, {"id": "BOOKS-48", "module": "books", "title": "Social Feed -- SocialScreen", "dependsOn": ["BOOKS-46", "BOOKS-47"], "filesToEdit": ["apps/mobile/app/(books)/social.tsx"], "referenceLogic": ["modules/books/src/social/types.ts"], "prompt": "Create `SocialScreen`. Uses `useSocialFeed()`. Layout: (1) If `!enabled`, show opt-in screen: \"Social features require signing in and enabling Supabase sync. Your data stays private by default.\" with \"Enable Social\" button (which would trigger auth flow -- for now, show placeholder). (2) If enabled: Header \"Reading Feed\" with friends count. (3) Feed: `FlatList` of `FeedItemCard` components from `feed.items`. Load more on scroll if `feed.hasMore`. (4) \"Friends\" tab: list of `friends` with accept/reject buttons for pending requests, remove button for accepted. Friend count / MAX_FRIENDS shown. (5) \"Add Friend\" button at top. (6) Empty feed: \"Your feed is empty. Connect with friends to see what they're reading.\" (7) Stale indicator if `feed.isStale`. Pull-to-refresh. Cool Obsidian tokens."}, {"id": "BOOKS-49", "module": "books", "title": "Social Feed -- Wire into navigation", "dependsOn": ["BOOKS-48"], "filesToEdit": ["apps/mobile/app/(books)/_layout.tsx"], "referenceLogic": [], "prompt": "Edit `apps/mobile/app/(books)/_layout.tsx`. Add hidden screen: `<Tabs.Screen name=\"social\" options={{ href: null }} />`."}, {"id": "BOOKS-50", "module": "books", "title": "Community Challenges -- useCommunity hook", "dependsOn": [], "filesToEdit": ["apps/mobile/hooks/books/use-community-challenges.ts", "apps/mobile/hooks/books/index.ts"], "referenceLogic": ["modules/books/src/community-challenges/engine.ts", "modules/books/src/db/community-challenges.ts", "modules/books/src/community-challenges/types.ts"], "prompt": "Create `useCommunityChallenge` hook. Import `getCommunityChallengesWithProgress`, `getPresetChallenges`, `joinChallenge`, `abandonParticipation` from `@mylife/books`. Use `useDatabase()`. Return `{ challenges: CommunityChallengeWithProgress[], presets: CommunityChallenge[], loading, refresh(), join(challengeId), abandon(participationId) }`. `challenges` calls `getCommunityChallengesWithProgress(db)`. `presets` calls `getPresetChallenges(db)`. `join` calls `joinChallenge(db, crypto.randomUUID(), { challenge_id, current_value: 0, status: 'active' })`. Export from barrel."}, {"id": "BOOKS-51", "module": "books", "title": "Community Challenges -- CommunityScreen", "dependsOn": ["BOOKS-50"], "filesToEdit": ["apps/mobile/app/(books)/community.tsx"], "referenceLogic": ["modules/books/src/community-challenges/types.ts", "modules/books/src/community-challenges/templates.ts"], "prompt": "Create `CommunityScreen`. Uses `useCommunityChallenge()`. Layout: (1) Header \"Community Challenges\". (2) \"Your Challenges\" section: active participations from `challenges` where `participation !== null`. Each card shows: challenge name, type badge, progress bar (`percentComplete`), days remaining (or \"Expired\" badge if `isExpired`), \"Abandon\" action on long-press. (3) \"Browse Challenges\" section: `presets` list showing available challenges. Each shows name, description, type, target value. \"Join\" button calls `join(challengeId)`. Already-joined challenges show \"Joined\" badge instead. (4) Completed challenges section (muted). (5) Empty state: \"Join community reading challenges and track your progress.\" Cool Obsidian tokens."}, {"id": "BOOKS-52", "module": "books", "title": "Community Challenges -- Wire into navigation", "dependsOn": ["BOOKS-51"], "filesToEdit": ["apps/mobile/app/(books)/_layout.tsx"], "referenceLogic": [], "prompt": "Edit `apps/mobile/app/(books)/_layout.tsx`. Add hidden screen: `<Tabs.Screen name=\"community\" options={{ href: null }} />`."}, {"id": "BOOKS-53", "module": "books", "title": "Reader Notes/Highlights -- useReaderHighlights hook enhancement", "dependsOn": [], "filesToEdit": ["apps/mobile/hooks/books/use-reader-notes.ts"], "referenceLogic": ["modules/books/src/db/reader-notes.ts", "apps/mobile/hooks/books/use-reader-notes.ts"], "prompt": "Review and enhance the existing `use-reader-notes.ts` hook. Ensure it exports: `{ notes: ReaderNote[], loading, refresh(), create(input), update(id, updates), remove(id), getForDocument(docId) }`. Import `createReaderNote`, `getReaderNotes`, `updateReaderNote`, `deleteReaderNote` from `@mylife/books`. If the hook already covers basic CRUD, add a `getForDocument(docId)` method that filters notes by document_id. Also add a `highlights` computed property that filters notes where `note_type = 'highlight'` (vs `note_type = 'note'`). Update the barrel export in `index.ts` if needed."}, {"id": "BOOKS-54", "module": "books", "title": "Reader Notes/Highlights -- HighlightViewer component", "dependsOn": ["BOOKS-53"], "filesToEdit": ["apps/mobile/components/books/HighlightViewer.tsx"], "referenceLogic": ["modules/books/src/db/reader-notes.ts"], "prompt": "Create `HighlightViewer` component. Props: `{ documentId: string }`. Uses `useReaderNotes()` hook, calls `getForDocument(documentId)`. Layout: (1) Section header \"Highlights & Notes\" with count badge. (2) List of highlights: each shows the highlighted text excerpt in italic with a yellow left border (4px, `#FFD700`), the personal note below in regular text, and a page/position reference. (3) Notes (non-highlight type) show with a blue left border (`colors.modules.books`). (4) \"Add Note\" inline button at bottom. (5) Swipe to delete with confirmation. (6) Empty state: \"No highlights yet. Highlight text while reading to save passages.\" Cool Obsidian tokens."}, {"id": "BOOKS-55", "module": "books", "title": "Reader Notes/Highlights -- Wire into reader view", "dependsOn": ["BOOKS-54"], "filesToEdit": ["apps/mobile/app/(books)/reader/[id].tsx"], "referenceLogic": [], "prompt": "Edit `apps/mobile/app/(books)/reader/[id].tsx`. Import `HighlightViewer` from `../../../components/books/HighlightViewer`. Add a \"Notes\" tab or expandable section at the bottom of the reader view that renders `<HighlightViewer documentId={id} />`. Also add text selection handling: when the user selects text in the reader content, show a floating toolbar with \"Highlight\" and \"Note\" buttons that create reader notes via the hook. The highlight saves `{ document_id, position, text_excerpt, note_type: 'highlight' }`."}, {"id": "BOOKS-56", "module": "books", "title": "Reader Preferences -- useReaderPreferences hook enhancement", "dependsOn": [], "filesToEdit": ["apps/mobile/hooks/books/use-reader-preferences.ts"], "referenceLogic": ["modules/books/src/db/reader-preferences.ts", "modules/books/src/models/schemas.ts", "apps/mobile/hooks/books/use-reader-preferences.ts"], "prompt": "Review and enhance the existing `use-reader-preferences.ts` hook. Ensure it exports: `{ preferences: ReaderDocumentPreference | null, loading, refresh(), update(input: Partial<ReaderDocumentPreferenceInsert>) }`. The `update` function should call `upsertReaderPreferences(db, { document_id, ...mergedPrefs })` merging current preferences with the partial update. Defaults from the DB layer: font_size 20, line_height 1.6, font_family 'serif', theme 'sepia', margin_size 20. Available themes: 'light', 'dark', 'sepia'. Available font families: 'serif', 'sans-serif', 'monospace'. Update barrel export if needed."}, {"id": "BOOKS-57", "module": "books", "title": "Reader Preferences -- ReaderSettingsSheet component", "dependsOn": ["BOOKS-56"], "filesToEdit": ["apps/mobile/components/books/ReaderSettingsSheet.tsx"], "referenceLogic": ["modules/books/src/models/schemas.ts"], "prompt": "Create `ReaderSettingsSheet` component. Props: `{ documentId: string, visible: boolean, onClose() }`. Uses `useReaderPreferences(documentId)`. Renders a bottom sheet modal containing: (1) Font size slider: range 12-48, current value displayed, +/- buttons for fine control. (2) Line height slider: range 1.0-3.0, step 0.1. (3) Font family picker: three buttons for 'serif', 'sans-serif', 'monospace' with preview text in each. (4) Theme picker: three theme swatches -- light (#F5F5F0 bg), dark (#1A1A24 bg), sepia (#F5E6C8 bg). (5) Margin size slider: range 0-64. Each change calls `update({...})` immediately (no save button needed). Use Cool Obsidian tokens for the sheet itself. Show a live preview text block that reflects current settings."}, {"id": "BOOKS-58", "module": "books", "title": "Reader Preferences -- Wire into reader view", "dependsOn": ["BOOKS-57"], "filesToEdit": ["apps/mobile/app/(books)/reader/[id].tsx"], "referenceLogic": [], "prompt": "Edit `apps/mobile/app/(books)/reader/[id].tsx`. Import `ReaderSettingsSheet` from `../../../components/books/ReaderSettingsSheet`. Add a settings gear icon button in the header that toggles the `ReaderSettingsSheet` visibility. Apply the reader preferences to the reading content view: set `fontSize` from `preferences.font_size`, `lineHeight` from `preferences.line_height`, `fontFamily` from `preferences.font_family`, background color from theme mapping (light -> #F5F5F0, dark -> #1A1A24, sepia -> #F5E6C8), text color accordingly, and padding from `preferences.margin_size`."}, {"id": "BOOKS-59", "module": "books", "title": "Content Warnings & Mood Tags -- useContentWarnings hook", "dependsOn": [], "filesToEdit": ["apps/mobile/hooks/books/use-content-warnings.ts", "apps/mobile/hooks/books/index.ts"], "referenceLogic": ["modules/books/src/db/content-warnings.ts", "modules/books/src/db/mood-tags.ts"], "prompt": "Create `useContentWarnings` hook. Import from `@mylife/books`: `addContentWarning`, `removeContentWarning`, `getContentWarningsForBook`, `getDistinctWarnings`, `addMoodTag`, `removeMoodTag`, `getMoodTagsForBook`, `getDistinctMoodValues`. Use `useDatabase()`. Return `{ warnings: ContentWarning[], moods: MoodTag[], distinctWarnings: string[], distinctMoods: string[], distinctPaces: string[], distinctGenres: string[], loading, refresh(), addWarning(bookId, warning, severity?), removeWarning(bookId, warning), addMood(bookId, type, value), removeMood(bookId, type, value) }`. `moods` calls `getMoodTagsForBook(db, bookId)`. `distinctMoods` calls `getDistinctMoodValues(db, 'mood')`. Export from barrel."}, {"id": "BOOKS-60", "module": "books", "title": "Content Warnings & Mood Tags -- TagEditor component", "dependsOn": ["BOOKS-59"], "filesToEdit": ["apps/mobile/components/books/TagEditor.tsx"], "referenceLogic": ["modules/books/src/models/schemas.ts"], "prompt": "Create `TagEditor` component. Props: `{ bookId: string }`. Uses `useContentWarnings(bookId)`. Layout: (1) \"Mood Tags\" section: three sub-sections for mood, pace, genre. Each shows existing tags as colored pills (mood = purple, pace = blue, genre = green). \"+\" button opens a picker with `distinctMoods`/`distinctPaces`/`distinctGenres` as suggestions, plus a TextInput for custom values. Tap a tag to remove it. (2) \"Content Warnings\" section: existing warnings shown as red-tinted pills with severity indicator (1-3 dots). \"+\" button to add from `distinctWarnings` suggestions or custom input with severity picker (low/medium/high). Tap to remove. (3) All add/remove operations call the hook methods. Cool Obsidian tokens. Compact design to fit within book detail view."}, {"id": "BOOKS-61", "module": "books", "title": "Content Warnings & Mood Tags -- Wire into book detail", "dependsOn": ["BOOKS-60"], "filesToEdit": ["apps/mobile/app/(books)/book/[id].tsx"], "referenceLogic": [], "prompt": "Edit `apps/mobile/app/(books)/book/[id].tsx`. Import `TagEditor` from `../../../components/books/TagEditor`. Add a \"Tags & Warnings\" section below the existing book metadata section. Render `<TagEditor bookId={id} />`. This section should be collapsible (default collapsed to save space), with a section header showing tag count and warning count."}, {"id": "BOOKS-62", "module": "books", "title": "Home Screen -- Feature Discovery Hub", "dependsOn": ["BOOKS-07", "BOOKS-10", "BOOKS-14", "BOOKS-18", "BOOKS-24", "BOOKS-28", "BOOKS-33", "BOOKS-37", "BOOKS-41", "BOOKS-45", "BOOKS-49", "BOOKS-52"], "filesToEdit": ["apps/mobile/app/(books)/index.tsx"], "referenceLogic": [], "prompt": "Edit `apps/mobile/app/(books)/index.tsx` to add feature discovery cards below the existing sections. Add a \"Quick Actions\" section with a 2x3 grid of action cards linking to new features: (1) \"Challenges\" -> `/(books)/challenges`, icon target emoji, (2) \"Journal\" -> `/(books)/journal`, icon notebook emoji, (3) \"Insights\" -> `/(books)/insights`, icon lightbulb emoji, (4) \"Quotes\" -> `/(books)/quotes`, icon quote emoji, (5) \"For You\" -> `/(books)/recommendations`, icon sparkle emoji, (6) \"Series\" -> `/(books)/series`, icon books emoji. Each card is a `Pressable` with `colors.surface` background, icon at 28px, label text below, borderRadius 14, width ~30%. Also add conditional cards: \"Clubs\" if any clubs exist, \"Badges\" showing earned count, \"Community\" for community challenges, \"Share\" for sharing cards, \"Social\" for the feed. Import `useRouter` for navigation. Cool Obsidian tokens."}, {"id": "BOOKS-63", "module": "books", "title": "Home Screen -- On This Day card", "dependsOn": ["BOOKS-25"], "filesToEdit": ["apps/mobile/app/(books)/index.tsx"], "referenceLogic": ["modules/books/src/insights/on-this-day.ts"], "prompt": "Edit `apps/mobile/app/(books)/index.tsx`. Import `useInsights` from the insights hook. Add an \"On This Day\" card above the \"Currently Reading\" section. If `onThisDay.length > 0`, show a `Card` with header \"On This Day\" and a horizontal scroll of events: each event shows a small book cover, event type (\"Started\", \"Finished\"), book title, and year. Style event type badges: `started` = blue, `finished` = green, `added` = gray, `reviewed` = amber. If no events, hide the section entirely (do not show empty state for this one). Use `BookCover` from `@mylife/ui` at size \"tiny\". Cool Obsidian tokens."}, {"id": "BOOKS-64", "module": "books", "title": "Home Screen -- Random Quote card", "dependsOn": ["BOOKS-29"], "filesToEdit": ["apps/mobile/app/(books)/index.tsx"], "referenceLogic": ["modules/books/src/db/quotes.ts"], "prompt": "Edit `apps/mobile/app/(books)/index.tsx`. Import `useQuotes` from the quotes hook. Add a \"Daily Quote\" card between the reading goal and currently reading sections. If `random` is not null, show a `Card` with: opening quote mark in `colors.modules.books`, quote content in italic (truncated to 120 chars), attribution \"-- [bookTitle]\", and a \"Shuffle\" button. Tap the card navigates to `/(books)/quotes`. If no quotes exist, hide the section. Cool Obsidian tokens."}, {"id": "BOOKS-65", "module": "books", "title": "Stats Screen -- Feature links", "dependsOn": ["BOOKS-17", "BOOKS-27", "BOOKS-36", "BOOKS-09"], "filesToEdit": ["apps/mobile/app/(books)/stats.tsx"], "referenceLogic": [], "prompt": "Edit `apps/mobile/app/(books)/stats.tsx`. Below the existing \"View Year in Review\" button, add a row of navigation cards: (1) \"Achievements\" showing earned badge count -> `/(books)/badges`, (2) \"Reading Insights\" -> `/(books)/insights`, (3) \"Share Stats\" -> `/(books)/share`, (4) \"Challenges\" showing active count -> `/(books)/challenges`. Each card uses the existing `Card` component with an icon, label, and optional count badge. Import `useBadges`, `useChallenges` hooks to get the earned/active counts. Arrange in a 2-column grid matching the existing `statGrid` style. Cool Obsidian tokens."}, {"id": "FAST-01", "module": "fast", "title": "Caffeine Tracker Dashboard -- Server Actions + Data Layer", "dependsOn": [], "filesToEdit": ["apps/web/app/fast/actions.ts", "apps/web/app/fast/caffeine/page.tsx"], "referenceLogic": ["modules/fast/src/engines/caffeine-engine.ts", "modules/fast/src/db/beverages.ts"], "prompt": "Add server actions to `apps/web/app/fast/actions.ts`: `fetchCaffeineSummary(date?)` that calls `getCaffeineLogsForDate` then `buildCaffeineSummary` with the user's `caffeineDailyLimitMg` and `caffeineCutoffTime` settings, and `fetchBeverageLogs(date?)`. Then create `apps/web/app/fast/caffeine/page.tsx` as a `'use client'` page that calls these actions on mount and renders: (1) a \"Daily Caffeine\" header showing totalMg / dailyLimit and the CaffeineStatus badge (empty/normal/high/late/critical with color coding), (2) a vertical metabolization timeline showing each drink with logged time, caffeine amount, and a decay curve visualization (use a simple CSS bar that shrinks proportionally to remainingFromDose), (3) a \"Clear by\" time display from `clearByTime`, (4) a late-caffeine warning banner when `status === 'late'`. Use Cool Obsidian glass cards and the `var(--accent-fast)` accent. Add a nav link in the fast layout."}, {"id": "FAST-02", "module": "fast", "title": "Quality Score Display", "dependsOn": [], "filesToEdit": ["apps/web/app/fast/actions.ts", "apps/web/app/fast/history/page.tsx", "apps/mobile/app/(health)/fasting.tsx"], "referenceLogic": ["modules/fast/src/engines/quality-score.ts", "modules/fast/src/db/beverages.ts", "modules/fast/src/db/fasts.ts", "modules/fast/src/stats/streaks.ts"], "prompt": "Add a server action `fetchFastQualityScores(fastIds: string[])` to `apps/web/app/fast/actions.ts` that, for each completed fast, gathers the four inputs (`hitTarget` from `fast.hit_target`, `hydrationMet` by checking `getDailyHydration` for the fast's date against the user's target, `noLateCaffeine` from `getCaffeineLogsForDate` + `hasLateCaffeine`, `streakMaintained` from streak cache) and calls `computeFastQualityScore`. Return an array of `{ fastId, score: FastQualityScore }`. Then edit the web history page (`apps/web/app/fast/history/page.tsx`) to call this action for the displayed fasts and render a circular score badge (0-100) with the letter grade (A/B/C/D/F) next to each fast row. Use color: A=green, B=blue, C=yellow, D=orange, F=red. Also add the score badge to the mobile fasting screen's recent fasts list."}, {"id": "FAST-03", "module": "fast", "title": "Protocol Progression Card", "dependsOn": [], "filesToEdit": ["apps/web/app/fast/actions.ts", "apps/web/app/fast/page.tsx", "apps/mobile/app/(health)/fasting.tsx"], "referenceLogic": ["modules/fast/src/engines/protocol-progression.ts", "modules/fast/src/protocols.ts", "modules/fast/src/stats/streaks.ts"], "prompt": "Add server action `fetchProtocolProgression()` to `apps/web/app/fast/actions.ts`. It reads the user's `defaultProtocol` setting, calculates consecutive successes from `listFasts` (count consecutive fasts where `hit_target === 1` from newest backward), and calls `suggestNextProtocol`. Return the `ProtocolSuggestion`. Edit `apps/web/app/fast/page.tsx` to display a progression card below the stats grid: show a progress bar from 0 to threshold (e.g., \"5/7 successful fasts\"), the current protocol name, and if `suggestedProtocolId` is not null, a \"Ready to level up\" banner with the next protocol name and a \"Try it\" button that updates the default protocol setting. On mobile, add a compact banner above the protocol selector showing \"X more fasts to unlock [next protocol]\" or \"Ready to level up!\" if threshold is met."}, {"id": "FAST-04", "module": "fast", "title": "Week-in-Review Summary Card", "dependsOn": ["FAST-02"], "filesToEdit": ["apps/web/app/fast/actions.ts", "apps/web/app/fast/stats/page.tsx", "apps/mobile/app/(health)/fasting.tsx"], "referenceLogic": ["modules/fast/src/engines/week-in-review.ts", "modules/fast/src/db/fasts.ts", "modules/fast/src/db/beverages.ts", "modules/fast/src/db/water.ts"], "prompt": "Add server action `fetchWeekInReview()` that computes the current week's Monday-Sunday range, queries fasts for that period, aggregates daily hydration from beverage logs, daily caffeine from caffeine logs, weight entries, and passes all inputs to `computeWeekInReview`. Return the `WeekInReview` object. Edit `apps/web/app/fast/stats/page.tsx` to render a \"Week in Review\" glass card showing: total fasting hours, completed vs started fasts, average hydration (with target comparison), average caffeine, weight delta (if available, with green/red arrow), average quality score, best day highlight, and current streak. On mobile, add a compact weekly summary card below the timer section showing key metrics (fasting hours, quality score, streak)."}, {"id": "FAST-05", "module": "fast", "title": "Weight Logging + Trends", "dependsOn": [], "filesToEdit": ["apps/web/app/fast/actions.ts", "apps/web/app/fast/weight/page.tsx", "apps/web/app/fast/layout.tsx"], "referenceLogic": ["modules/fast/src/db/fasts.ts", "modules/fast/src/engines/healthkit-sync.ts", "modules/fast/src/types.ts"], "prompt": "Add server actions for weight: `fetchWeightEntries(days?: number)`, `doCreateWeightEntry(value, unit, date?, notes?)`, `doDeleteWeightEntry(id)`. Create `apps/web/app/fast/weight/page.tsx` as a `'use client'` page with: (1) a manual entry form (weight input, unit toggle lbs/kg, date picker defaulting to today, optional notes), (2) a weight trend chart using a simple SVG line chart -- plot entries over the last 30/60/90 days (toggle), show min/max/current annotations, (3) a sortable weight log table below the chart showing date, value, unit, source (manual/healthkit badge), and delete button. Add a \"Weight\" nav link in the fast layout. Style with Cool Obsidian tokens. The chart should use `var(--accent-fast)` for the line color and `var(--glass)` for the background."}, {"id": "FAST-06", "module": "fast", "title": "Beverage Type Manager", "dependsOn": [], "filesToEdit": ["apps/web/app/fast/actions.ts", "apps/web/app/fast/settings/page.tsx"], "referenceLogic": ["modules/fast/src/db/beverages.ts", "modules/fast/src/db/schema.ts", "modules/fast/src/types.ts"], "prompt": "Add server actions: `fetchBeverageTypes()`, `doCreateBeverageType(input)`, `doUpdateBeverageType(id, updates)`, `doDeleteBeverageType(id)`. Edit `apps/web/app/fast/settings/page.tsx` to add a \"Beverage Types\" management section. Display all 12 built-in types in a grid (icon, name, default oz, coefficient, caffeine mg) with edit buttons (built-in types can only edit defaultOz). Add a \"Custom Type\" form at the bottom with fields: name, icon picker (emoji), default oz, hydration coefficient (slider 0.0-2.0 with labels like \"dehydrating\" at -1.0 to \"super hydrating\" at 2.0), optional caffeine mg. Show a preview of the new type before saving. Custom types show a delete button (with confirmation). Use Cool Obsidian glass cards."}, {"id": "FAST-07", "module": "fast", "title": "Container Presets Manager", "dependsOn": [], "filesToEdit": ["apps/web/app/fast/actions.ts", "apps/web/app/fast/settings/page.tsx"], "referenceLogic": ["modules/fast/src/db/containers.ts", "modules/fast/src/db/schema.ts", "modules/fast/src/types.ts"], "prompt": "Add server actions: `fetchContainerPresets()`, `doCreateContainerPreset(input)`, `doUpdateContainerPreset(id, updates)`, `doDeleteContainerPreset(id)`, `doReorderContainerPresets(orderedIds)`. Edit `apps/web/app/fast/settings/page.tsx` to add a \"Container Presets\" section below Beverage Types. Show the 5 built-in presets and any custom ones in a draggable list (icon, name, volume oz, glass equivalent via `volumeToGlasses`). Built-in presets allow editing volume and icon. Custom presets allow full edit and delete. Add a \"New Container\" form: name (max 30 chars), volume oz (slider 4-128), icon picker. Show glass equivalent preview next to volume input. Style as Cool Obsidian cards."}, {"id": "FAST-08", "module": "fast", "title": "Smart Water Reminders Settings", "dependsOn": [], "filesToEdit": ["apps/web/app/fast/actions.ts", "apps/web/app/fast/settings/page.tsx"], "referenceLogic": ["modules/fast/src/engines/water-reminder-engine.ts", "modules/fast/src/db/water.ts", "modules/fast/src/types.ts"], "prompt": "Add server actions: `fetchWaterReminderConfig()` (reads settings keys: `waterRemindersEnabled`, `waterReminderInterval`, `waterWakeStart`, `waterWakeEnd`, `waterPauseDuringDryFast`, `waterPersonalizedGoal`), `updateWaterReminderConfig(config)` (writes each setting key), `calculateTarget(weight, unit)` (calls `calculatePersonalizedTarget`). Edit `apps/web/app/fast/settings/page.tsx` to add a \"Smart Water Reminders\" section. Show: (1) enable/disable toggle, (2) interval picker (30/45/60/90/120 min), (3) waking hours range (two time pickers for wake start/end), (4) \"Pause during dry fast\" toggle, (5) \"Personalized target\" toggle that reveals a weight input + unit selector, showing the calculated target from `calculatePersonalizedTarget`, (6) a preview of all reminder slots for today via `generateReminderSlots`, displayed as a horizontal timeline. Save button persists all settings and optionally updates the daily water target."}, {"id": "RECIPES-01", "module": "recipes", "title": "Collections -- Server Actions", "dependsOn": [], "filesToEdit": ["apps/web/app/recipes/actions.ts"], "referenceLogic": ["modules/recipes/src/db/collections.ts", "modules/recipes/src/types.ts"], "prompt": "Add server actions to `apps/web/app/recipes/actions.ts`: `fetchCollections()`, `doCreateCollection(name, description?)`, `doUpdateCollection(id, updates)`, `doDeleteCollection(id)`, `doAddRecipeToCollection(recipeId, collectionId)`, `doRemoveRecipeFromCollection(recipeId, collectionId)`, `fetchCollectionRecipes(collectionId)` (query `rc_recipe_collections` joined with `rc_recipes` to get recipes in a collection). Follow the existing error handling pattern (try/catch returning empty array or null on failure). Generate UUID for new collections using the same pattern as existing actions."}, {"id": "RECIPES-02", "module": "recipes", "title": "Collections -- Browse + Organize UI", "dependsOn": ["RECIPES-01"], "filesToEdit": ["apps/web/app/recipes/collections/page.tsx", "apps/web/app/recipes/collections/[id]/page.tsx", "apps/web/app/recipes/page.tsx", "apps/web/app/recipes/library/[id]/page.tsx"], "referenceLogic": ["modules/recipes/src/db/collections.ts", "modules/recipes/src/types.ts"], "prompt": "Create `apps/web/app/recipes/collections/page.tsx`: list all collections as grid cards (name, description, cover image from cover_recipe_id, recipe count). Include a \"New Collection\" button that opens an inline form (name, optional description). Each card links to the collection detail page. Create `apps/web/app/recipes/collections/[id]/page.tsx`: show collection header (editable name/description, delete button with confirmation), then a recipe grid identical to the library page but filtered to the collection. Include a \"Remove\" button per recipe. Edit the recipe detail page (`library/[id]/page.tsx`) to add an \"Add to Collection\" dropdown that lists available collections and calls `doAddRecipeToCollection`. Edit the recipes landing page to add a \"Collections\" nav card. Use Cool Obsidian glass cards throughout."}, {"id": "RECIPES-03", "module": "recipes", "title": "Nutrition Display on Recipe Detail", "dependsOn": [], "filesToEdit": ["apps/web/app/recipes/actions.ts", "apps/web/app/recipes/library/[id]/page.tsx"], "referenceLogic": ["modules/recipes/src/db/nutrition.ts", "modules/recipes/src/types.ts", "modules/recipes/src/db/pantry.ts"], "prompt": "Add server actions: `fetchRecipeNutrition(recipeId)` that queries ingredients for the recipe, looks up each ingredient's pantry item match, checks for nutrition data via `getNutritionForItem`, and aggregates into a `RecipeNutritionSummary` (per-serving and total macros: calories, fat, carbs, protein, fiber, sodium). Return `{ perServing, total, coverage, missingIngredients }`. Edit `apps/web/app/recipes/library/[id]/page.tsx` to add a \"Nutrition\" collapsible section below ingredients. Display per-serving macros in a horizontal bar chart (calories prominent, macros as colored bars: fat=yellow, carbs=blue, protein=red, fiber=green). Show coverage percentage (\"Based on X of Y ingredients\"). If coverage < 50%, show a \"Limited data\" disclaimer. If no nutrition data exists, show \"No nutrition data available\" with a prompt to add pantry items with barcodes."}, {"id": "RECIPES-04", "module": "recipes", "title": "Recipe Print Page", "dependsOn": [], "filesToEdit": ["apps/web/app/recipes/library/[id]/print/page.tsx", "apps/web/app/recipes/actions.ts"], "referenceLogic": ["modules/recipes/src/print/recipe-template.ts", "modules/recipes/src/db/crud.ts", "modules/recipes/src/types.ts"], "prompt": "Edit `apps/web/app/recipes/library/[id]/print/page.tsx` to be a dedicated print-optimized page. Add a server action `fetchPrintHtml(recipeId)` that calls `getRecipeById`, gets structured ingredients and steps, gets tags, and calls `generatePrintHtml` with `{ includePhoto: true }`. The page should render: (1) a \"Print\" button at the top (hidden in print media), (2) the generated HTML rendered via `dangerouslySetInnerHTML` inside a print-friendly container, (3) `@media print` CSS that hides the sidebar, header, and button, sets white background, and optimizes for A4/Letter paper. Add a print button to the recipe detail page that links to this route. The print template already exists in the module -- just wire it to the web UI."}, {"id": "RECIPES-05", "module": "recipes", "title": "Recipe Sharing -- Token + Card UI", "dependsOn": [], "filesToEdit": ["apps/web/app/recipes/actions.ts", "apps/web/app/recipes/library/[id]/page.tsx", "apps/web/app/recipes/share/[token]/page.tsx"], "referenceLogic": ["modules/recipes/src/types.ts", "modules/recipes/src/db/schema.ts", "modules/recipes/src/db/crud.ts"], "prompt": "Add server actions: `doCreateShareToken(recipeId)` that generates a random token, inserts into `rc_share_tokens` with 30-day expiry, and returns the token string; `fetchSharedRecipe(token)` that looks up the token, increments view_count, checks expiry, and returns the full recipe with ingredients and steps; `doRevokeShareToken(tokenId)`. Edit the recipe detail page to add a \"Share\" button that creates a token and shows a modal with: (1) a copy-to-clipboard share URL (`/recipes/share/[token]`), (2) a recipe card preview (title, image, description, servings, cook time). Create `apps/web/app/recipes/share/[token]/page.tsx` as a public page (no auth required) that fetches the shared recipe and renders it in a clean, branded read-only view with \"Made with MyLife\" footer. Handle expired/invalid tokens with a friendly message."}, {"id": "RECIPES-06", "module": "recipes", "title": "Voice Commands in Cooking Mode", "dependsOn": [], "filesToEdit": ["apps/web/app/recipes/library/[id]/cook/page.tsx"], "referenceLogic": ["modules/recipes/src/voice/voice-commands.ts", "modules/recipes/src/types.ts"], "prompt": "Edit `apps/web/app/recipes/library/[id]/cook/page.tsx` to add voice command support. Add a \"Voice\" toggle button in the cooking mode toolbar. When enabled, use the Web Speech API (`SpeechRecognition`) to listen continuously for voice input. On each recognized phrase, call `parseVoiceCommand(transcript)` and dispatch the result: `next_step` advances the step, `previous_step` goes back, `start_timer`/`stop_timer` controls the step timer, `repeat_step` uses `SpeechSynthesis` to read the current step aloud, `read_ingredients` reads the ingredient list, `go_to_step N` jumps to step N. Show a floating voice indicator (pulsing microphone icon when listening, recognized command text briefly). Handle `null` returns (unrecognized) with a gentle \"Didn't catch that\" toast. Add a \"Supported commands\" help tooltip listing all 7 command types."}, {"id": "RECIPES-07", "module": "recipes", "title": "Ingredient Substitutions Display", "dependsOn": [], "filesToEdit": ["modules/recipes/src/substitutions/suggestions.ts", "modules/recipes/src/__tests__/substitutions.test.ts", "apps/web/app/recipes/library/[id]/page.tsx"], "referenceLogic": ["modules/recipes/src/types.ts", "modules/recipes/src/pantry/matching.ts", "modules/recipes/src/db/pantry.ts"], "prompt": "Create `modules/recipes/src/substitutions/suggestions.ts` with a pure function `getSubstitutionSuggestions(ingredientName: string, pantryItems?: string[]): SubstitutionSuggestion[]`. Build a static substitution map covering 30+ common ingredients (e.g., butter -> coconut oil/applesauce, eggs -> flax egg/banana, milk -> almond milk/oat milk, all-purpose flour -> whole wheat/almond flour). For each match, return `{ substitute, quantity_hint, reason, in_pantry }` where `in_pantry` is true if the substitute exists in the user's pantry items list. Write tests for 10+ ingredient lookups. Then edit the recipe detail page to show a small \"Swap\" icon next to each ingredient that, on click, reveals a dropdown of substitution suggestions. Highlight in-pantry substitutes with a green badge."}, {"id": "RECIPES-08", "module": "recipes", "title": "Barcode Pantry Lookup", "dependsOn": [], "filesToEdit": ["apps/web/app/recipes/pantry/page.tsx", "apps/web/app/recipes/actions.ts"], "referenceLogic": ["modules/recipes/src/pantry/open-food-facts.ts", "modules/recipes/src/db/pantry.ts", "modules/recipes/src/db/nutrition.ts"], "prompt": "Add server action `doBarcodeLookup(barcode: string)` that calls `lookupBarcode` from the Open Food Facts module, returns the product info (name, brand, category, nutrition data). Edit `apps/web/app/recipes/pantry/page.tsx` to add a \"Scan Barcode\" button that opens a text input for manual barcode entry (camera scanning is mobile-only). On submit, call the action. If found, show a preview card (product name, brand, category, nutrition summary) with \"Add to Pantry\" button that creates the pantry item and nutrition data record in one action. If not found, show \"Not found in database\" with a manual entry fallback. On mobile, this should use the device camera for barcode scanning via `expo-camera` BarCodeScanner."}, {"id": "RECIPES-09", "module": "recipes", "title": "AI Food Recognition for Pantry", "dependsOn": [], "filesToEdit": ["apps/web/app/recipes/pantry/page.tsx", "apps/web/app/recipes/actions.ts"], "referenceLogic": ["modules/recipes/src/pantry/food-recognition.ts", "modules/recipes/src/db/pantry.ts", "modules/recipes/src/pantry/open-food-facts.ts"], "prompt": "Add server action `doIdentifyFood(imageBase64: string)` that reads the user's Claude API key from `rc_settings` and calls `identifyFood`. Return the `FoodRecognitionResult`. Edit `apps/web/app/recipes/pantry/page.tsx` to add an \"Identify Food\" button that opens a file picker for image upload. On selection, convert to base64, call the action. If the API key is not set, prompt the user to add it in settings. If identified (confidence > 0.5), show: suggested name (editable), category, confidence bar, and all detected labels. \"Add to Pantry\" button creates the item with pre-filled fields. If low confidence or no result, show \"Could not identify\" with manual entry. Privacy note: \"Photo is sent to Claude API for identification and is not stored.\""}, {"id": "RECIPES-10", "module": "recipes", "title": "Pantry Deduction -- \"I Cooked This\" Button", "dependsOn": [], "filesToEdit": ["apps/web/app/recipes/actions.ts", "apps/web/app/recipes/library/[id]/page.tsx"], "referenceLogic": ["modules/recipes/src/pantry/deduction.ts", "modules/recipes/src/types.ts"], "prompt": "Add server actions: `doPreviewDeduction(recipeId, servings?)` that calls `previewDeduction` and returns the `DeductionResult`; `doDeductPantry(recipeId, servings?)` that calls `deductPantryForRecipe`. Edit the recipe detail page to add an \"I Cooked This\" button (with a pot icon). On click, first call preview and show a confirmation modal listing: each matched ingredient with before/after quantities (green for partial deduction, red for \"will be removed\"), and any unmatched ingredients. Include a servings multiplier input. On confirm, call `doDeductPantry`. Show a success toast with summary: \"Updated X pantry items, Y unmatched.\" The preview step prevents surprise pantry changes."}, {"id": "RECIPES-11", "module": "recipes", "title": "Expiring Item Recipe Suggestions", "dependsOn": [], "filesToEdit": ["apps/web/app/recipes/pantry/page.tsx", "apps/web/app/recipes/actions.ts"], "referenceLogic": ["modules/recipes/src/pantry/expiration.ts", "modules/recipes/src/pantry/matching.ts", "modules/recipes/src/types.ts"], "prompt": "Add server action `fetchExpiringItemSuggestions()` that: (1) gets all pantry items, (2) filters to `expiring_soon` status (within 3 days), (3) for each expiring item, finds recipes that use that ingredient via fuzzy matching against `rc_ingredients`, (4) returns `ExpiringRecipeSuggestion[]` (recipe match + which expiring items it uses + days left). Edit `apps/web/app/recipes/pantry/page.tsx` to add an \"Use It Up\" section at the top when there are expiring items. Show a card per expiring item with: item name, days left (color coded), and suggested recipes as clickable links. If no recipes match, show \"No recipe matches -- consider adding a recipe with [item].\" Sort by urgency (fewest days first)."}, {"id": "RECIPES-12", "module": "recipes", "title": "Recipe Tags Management", "dependsOn": [], "filesToEdit": ["apps/web/app/recipes/actions.ts", "apps/web/app/recipes/library/[id]/page.tsx", "apps/web/app/recipes/library/page.tsx"], "referenceLogic": ["modules/recipes/src/db/crud.ts", "modules/recipes/src/types.ts"], "prompt": "Add server actions: `fetchTags(recipeId)`, `doAddTag(recipeId, tag)`, `doDeleteTag(tagId)`, `fetchAllTags()` (SELECT DISTINCT tag from rc_recipe_tags). Edit the recipe detail page to show tags below the title as colored pills. Add an inline \"Add tag\" input with autocomplete from existing tags. Tags can be deleted by clicking an \"x\" on the pill. Edit the recipe library page to add a tag filter bar at the top -- show all unique tags as toggleable pills, clicking one filters the recipe list to that tag. Multiple tags can be active (AND filter). Style tags with `var(--glass-strong)` background and `var(--accent-recipes)` text when active."}, {"id": "WORKOUTS-01", "module": "workouts", "title": "Progressive Overload -- Rule Display in Settings", "dependsOn": [], "filesToEdit": ["apps/web/app/workouts/actions.ts", "apps/web/app/workouts/settings/page.tsx", "apps/web/app/workouts/layout.tsx"], "referenceLogic": ["modules/workouts/src/db/crud.ts", "modules/workouts/src/types.ts"], "prompt": "Add server actions: `fetchOverloadRules()`, `doCreateOverloadRule(rule)`, `doUpdateOverloadRule(id, updates)`, `doDeleteOverloadRule(id)`. Create `apps/web/app/workouts/settings/page.tsx` with an \"Overload Rules\" section. Show existing rules in a list: each row shows the rule type (weight/rep/set/percentage increment), trigger condition (all_sets_hit/any_set_hit/average_reps_hit), target reps, increment value+unit, minimum sessions, and active toggle. Add a \"New Rule\" form with: optional exercise selector (null = global), rule type dropdown, trigger condition dropdown, target reps input, increment value input, unit dropdown, min sessions input. Rules can be edited inline or deleted. Add a nav link in the workouts layout."}, {"id": "WORKOUTS-02", "module": "workouts", "title": "Progressive Overload -- Suggestions During Session", "dependsOn": ["WORKOUTS-01"], "filesToEdit": ["apps/web/app/workouts/session/page.tsx", "apps/web/app/workouts/actions.ts"], "referenceLogic": ["modules/workouts/src/overload/engine.ts", "modules/workouts/src/types.ts"], "prompt": "Add server action `fetchOverloadSuggestions(exerciseId)` that gets the effective overload rule for the exercise, queries the last N sessions of set weights for that exercise, and calls `generateOverloadSuggestion`. Return `{ suggestion: string | null, currentWeight, suggestedWeight, suggestedReps }`. Edit the session page to show an overload suggestion banner for each exercise that has one: \"Increase to X lbs\" or \"Try X+2 reps\" with an \"Accept\" button that pre-fills the weight/reps for the next set. Show the suggestion in a subtle accent-colored bar above the set entry row. If no suggestion (not enough data or threshold not met), show nothing."}, {"id": "WORKOUTS-03", "module": "workouts", "title": "Muscle Recovery Heatmap", "dependsOn": [], "filesToEdit": ["apps/web/app/workouts/recovery/page.tsx", "apps/web/app/workouts/actions.ts", "apps/web/app/workouts/layout.tsx"], "referenceLogic": ["modules/workouts/src/recovery/engine.ts", "modules/workouts/src/recovery/types.ts", "modules/workouts/src/body-map.ts"], "prompt": "Add server actions: `fetchRecoveryMap()` that queries recent sessions (last 14 days), builds `SessionMuscleData[]` from set weights joined with exercise muscle groups, and calls `buildRecoveryMap`; `fetchTrainingSugge
