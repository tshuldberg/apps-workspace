<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Meerkat server</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="brand">
        <h1>Meerkat Host</h1>
        <span class="sub">your server</span>
      </header>

      <!-- Connectivity: state only, never a peer count. -->
      <section class="card">
        <div class="status-line">
          <span class="state-dot offline" id="state-dot"></span>
          <span id="status-label">Loading…</span>
        </div>
        <ul class="services" id="services"></ul>
        <div class="row">
          <button class="btn" id="start" type="button">Start</button>
          <button class="btn danger" id="stop" type="button">Stop</button>
          <a class="btn secondary" href="wizard.html">Reconfigure</a>
        </div>
      </section>

      <!-- Offline notice (shown when stopped/errored or card unavailable). -->
      <div class="notice warn hidden" id="offline">
        Your server is offline right now. Members cannot reach it until you press
        Start and it comes back online.
      </div>

      <!-- Connection card + QR: rendered ONLY when cardView(...).show === true. -->
      <section class="card glass hidden" id="card-section">
        <h2>Invite members</h2>
        <p class="muted tiny" id="card-scope"></p>
        <div class="qr" id="qr"></div>
        <p class="tiny muted">Members scan this, or paste the address below:</p>
        <code class="cardstr" id="card-string"></code>
      </section>

      <!-- Card withheld reason (candidate URL / setup steps, never a card). -->
      <section class="card hidden" id="withheld-section">
        <h2>Not ready to share yet</h2>
        <p id="withheld-reason" class="muted"></p>
        <p class="tiny muted hidden" id="withheld-candidate"></p>
        <ol class="setup-steps hidden" id="withheld-steps"></ol>
      </section>

      <div class="lifecycle">
        <span class="dot">&#9432;</span>
        <span id="lifecycle-text"></span>
      </div>
    </div>

    <script type="module" src="dashboard.js"></script>
  </body>
</html>
