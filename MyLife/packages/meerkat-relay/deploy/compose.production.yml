name: meerkat-production

x-platform: &platform
  build:
    context: ../../..
    dockerfile: packages/meerkat-relay/Dockerfile.platform
  image: meerkat-platform:${MEERKAT_RELEASE_TAG:?set MEERKAT_RELEASE_TAG to the immutable release SHA}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - private

services:
  edge:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN}
      HUMANITY_DOMAIN: ${HUMANITY_DOMAIN:?set HUMANITY_DOMAIN}
      HOSTED_DOMAIN: ${HOSTED_DOMAIN:?set HOSTED_DOMAIN}
      PERSONA_DOMAIN: ${PERSONA_DOMAIN:?set PERSONA_DOMAIN}
      COMMUNITY_DOMAIN: ${COMMUNITY_DOMAIN:?set COMMUNITY_DOMAIN}
      DIRECTORY_DOMAIN: ${DIRECTORY_DOMAIN:?set DIRECTORY_DOMAIN}
      MODERATION_DOMAIN: ${MODERATION_DOMAIN:?set MODERATION_DOMAIN}
      MODERATION_ALLOWED_CIDRS: ${MODERATION_ALLOWED_CIDRS:?set MODERATION_ALLOWED_CIDRS to the VPN or operator network ranges}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:?set LIVEKIT_DOMAIN}
      ACCOUNT_DOMAIN: ${ACCOUNT_DOMAIN:?set ACCOUNT_DOMAIN for the plan 51 verification-account service}
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - edge
      - private
    depends_on:
      relay:
        condition: service_healthy
      humanity:
        condition: service_healthy
      hosted:
        condition: service_healthy
      persona:
        condition: service_healthy
      push:
        condition: service_healthy
      account:
        condition: service_healthy
      community:
        condition: service_healthy
      directory:
        condition: service_healthy
      livekit:
        condition: service_healthy
      archive-scanner:
        condition: service_healthy
      archive-seeder:
        condition: service_healthy
      ncmec-filer:
        condition: service_healthy

  relay:
    <<: *platform
    command: ["./node_modules/.bin/tsx", "bin/meerkat-relay-server.mjs"]
    environment:
      PORT: "8787"
      MEERKAT_TRUST_PROXY_HOPS: "1"
      HOST: 0.0.0.0
      MEERKAT_HOSTED_ENTITLEMENT_REQUIRED: "1"
      ENTITLEMENT_SECRET: ${ENTITLEMENT_SECRET:?set ENTITLEMENT_SECRET}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  humanity:
    <<: *platform
    command: ["./node_modules/.bin/tsx", "bin/meerkat-verification-service.mjs"]
    environment:
      PORT: "8892"
      MEERKAT_TRUST_PROXY_HOPS: "1"
      HOST: 0.0.0.0
      NODE_ENV: production
      MEERKAT_DEPLOYMENT_PROFILE: first-party
      MEERKAT_STORE_BACKEND: postgres
      MEERKAT_POSTGRES_URL: ${HUMANITY_DATABASE_URL:?set HUMANITY_DATABASE_URL for the meerkat_humanity role}
      MEERKAT_POSTGRES_SSL_CA_FILE: /run/secrets/postgres-ca.pem
      HUMANITY_SIGNING_KEY: ${HUMANITY_SIGNING_KEY:?set HUMANITY_SIGNING_KEY}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:?set TURNSTILE_SECRET}
      MEERKAT_ALLOWED_ORIGINS: ${WEB_ORIGIN:?set WEB_ORIGIN}
      # Plan 44 WP-4A: private Prometheus /metrics on the internal network only. This
      # port is intentionally NOT published (no ports: entry), so it is reachable only
      # from inside the `private` network by a scraper, never from the public edge.
      MEERKAT_METRICS_HOST: 0.0.0.0
      MEERKAT_METRICS_PORT: "9892"
    secrets:
      - source: postgres_ca
        target: postgres-ca.pem
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8892/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  hosted:
    <<: *platform
    command: ["./node_modules/.bin/tsx", "bin/meerkat-hosted-service.mjs"]
    environment:
      PORT: "8893"
      HOST: 0.0.0.0
      NODE_ENV: production
      DATA_DIR: /data/hosted
      MEERKAT_DEPLOYMENT_PROFILE: first-party
      MEERKAT_STORE_BACKEND: postgres
      MEERKAT_POSTGRES_URL: ${HOSTED_DATABASE_URL:?set HOSTED_DATABASE_URL for the meerkat_hosted role}
      MEERKAT_POSTGRES_SSL_MODE: verify-full
      MEERKAT_POSTGRES_SSL_CA_FILE: /run/secrets/postgres-ca.pem
      ENTITLEMENT_SECRET: ${ENTITLEMENT_SECRET:?set ENTITLEMENT_SECRET}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY}
      STRIPE_MONTHLY_PRICE_ID: ${STRIPE_MONTHLY_PRICE_ID:?set STRIPE_MONTHLY_PRICE_ID}
      STRIPE_APP_UNLOCK_PRICE_ID: ${STRIPE_APP_UNLOCK_PRICE_ID:?set STRIPE_APP_UNLOCK_PRICE_ID}
      REVENUECAT_REST_API_KEY: ${REVENUECAT_REST_API_KEY:?set REVENUECAT_REST_API_KEY}
      MEERKAT_APP_UNLOCK_TOKEN_SECRET: ${MEERKAT_APP_UNLOCK_TOKEN_SECRET:?set MEERKAT_APP_UNLOCK_TOKEN_SECRET}
      MEERKAT_ALLOWED_ORIGINS: ${WEB_ORIGIN:?set WEB_ORIGIN}
      MEERKAT_TRUST_PROXY_HOPS: "1"
      # First-party hosted byte path: tenant bytes land on the real object store (S3), not the
      # local volume. The service fails closed (before any server opens) if s3 is selected but
      # incomplete. BOTH credentials are MOUNTED SECRET files (never plain env), matching the
      # postgres-ca.pem convention.
      MEERKAT_OBJECT_STORE_BACKEND: s3
      MEERKAT_OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:?set OBJECT_STORE_ENDPOINT for the hosted object store}
      MEERKAT_OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:?set OBJECT_STORE_REGION}
      MEERKAT_OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:?set OBJECT_STORE_BUCKET}
      MEERKAT_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/object-store-access-key
      MEERKAT_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/object-store-secret-key
      # Signed storage:v1 discovery and the hosted OAuth broker. Every private key/secret is a
      # mounted file; provider ids and public endpoints are configuration only.
      MEERKAT_STORAGE_OPERATOR_KEY_FILE: /run/secrets/storage-operator-key
      MEERKAT_STORAGE_PUBLIC_ENDPOINT: https://${HOSTED_DOMAIN:?set HOSTED_DOMAIN}
      MEERKAT_OAUTH_KMS_KEY_FILE: /run/secrets/oauth-kms-key
      MEERKAT_OAUTH_PROVIDERS: google,dropbox,onedrive,box
      MEERKAT_OAUTH_GOOGLE_AUTH_URL: https://accounts.google.com/o/oauth2/v2/auth
      MEERKAT_OAUTH_GOOGLE_TOKEN_URL: https://oauth2.googleapis.com/token
      MEERKAT_OAUTH_GOOGLE_REVOKE_URL: https://oauth2.googleapis.com/revoke
      MEERKAT_OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:?set OAUTH_GOOGLE_CLIENT_ID}
      MEERKAT_OAUTH_GOOGLE_CLIENT_SECRET_FILE: /run/secrets/oauth-google-client-secret
      MEERKAT_OAUTH_GOOGLE_REDIRECT_ALLOWLIST: ${OAUTH_GOOGLE_REDIRECT_ALLOWLIST:?set OAUTH_GOOGLE_REDIRECT_ALLOWLIST}
      MEERKAT_OAUTH_DROPBOX_AUTH_URL: https://www.dropbox.com/oauth2/authorize
      MEERKAT_OAUTH_DROPBOX_TOKEN_URL: https://api.dropboxapi.com/oauth2/token
      MEERKAT_OAUTH_DROPBOX_CLIENT_ID: ${OAUTH_DROPBOX_CLIENT_ID:?set OAUTH_DROPBOX_CLIENT_ID}
      MEERKAT_OAUTH_DROPBOX_CLIENT_SECRET_FILE: /run/secrets/oauth-dropbox-client-secret
      MEERKAT_OAUTH_DROPBOX_REDIRECT_ALLOWLIST: ${OAUTH_DROPBOX_REDIRECT_ALLOWLIST:?set OAUTH_DROPBOX_REDIRECT_ALLOWLIST}
      MEERKAT_OAUTH_ONEDRIVE_AUTH_URL: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
      MEERKAT_OAUTH_ONEDRIVE_TOKEN_URL: https://login.microsoftonline.com/common/oauth2/v2.0/token
      MEERKAT_OAUTH_ONEDRIVE_CLIENT_ID: ${OAUTH_ONEDRIVE_CLIENT_ID:?set OAUTH_ONEDRIVE_CLIENT_ID}
      MEERKAT_OAUTH_ONEDRIVE_CLIENT_SECRET_FILE: /run/secrets/oauth-onedrive-client-secret
      MEERKAT_OAUTH_ONEDRIVE_REDIRECT_ALLOWLIST: ${OAUTH_ONEDRIVE_REDIRECT_ALLOWLIST:?set OAUTH_ONEDRIVE_REDIRECT_ALLOWLIST}
      MEERKAT_OAUTH_BOX_AUTH_URL: https://account.box.com/api/oauth2/authorize
      MEERKAT_OAUTH_BOX_TOKEN_URL: https://api.box.com/oauth2/token
      MEERKAT_OAUTH_BOX_REVOKE_URL: https://api.box.com/oauth2/revoke
      MEERKAT_OAUTH_BOX_CLIENT_ID: ${OAUTH_BOX_CLIENT_ID:?set OAUTH_BOX_CLIENT_ID}
      MEERKAT_OAUTH_BOX_CLIENT_SECRET_FILE: /run/secrets/oauth-box-client-secret
      MEERKAT_OAUTH_BOX_REDIRECT_ALLOWLIST: ${OAUTH_BOX_REDIRECT_ALLOWLIST:?set OAUTH_BOX_REDIRECT_ALLOWLIST}
      # Private Prometheus /metrics on the internal network only (not published).
      MEERKAT_METRICS_HOST: 0.0.0.0
      MEERKAT_METRICS_PORT: "9893"
    secrets:
      - source: postgres_ca
        target: postgres-ca.pem
      - source: object_store_access_key
        target: object-store-access-key
      - source: object_store_secret_key
        target: object-store-secret-key
      - source: storage_operator_key
        target: storage-operator-key
      - source: oauth_kms_key
        target: oauth-kms-key
      - source: oauth_google_client_secret
        target: oauth-google-client-secret
      - source: oauth_dropbox_client_secret
        target: oauth-dropbox-client-secret
      - source: oauth_onedrive_client_secret
        target: oauth-onedrive-client-secret
      - source: oauth_box_client_secret
        target: oauth-box-client-secret
    volumes:
      - hosted_data:/data/hosted
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8893/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  persona:
    <<: *platform
    command: ["./node_modules/.bin/tsx", "bin/meerkat-persona-service.mjs"]
    environment:
      PORT: "8894"
      MEERKAT_TRUST_PROXY_HOPS: "1"
      HOST: 0.0.0.0
      NODE_ENV: production
      MEERKAT_DEPLOYMENT_PROFILE: first-party
      MEERKAT_STORE_BACKEND: postgres
      MEERKAT_POSTGRES_URL: ${PERSONA_DATABASE_URL:?set PERSONA_DATABASE_URL for the meerkat_persona role}
      MEERKAT_POSTGRES_SSL_CA_FILE: /run/secrets/postgres-ca.pem
      MEERKAT_OPERATOR_AUTHORITY_SEED: ${MEERKAT_OPERATOR_AUTHORITY_SEED:?set MEERKAT_OPERATOR_AUTHORITY_SEED}
      MEERKAT_PERSONA_SESSION_SECRET: ${MEERKAT_PERSONA_SESSION_SECRET:?set MEERKAT_PERSONA_SESSION_SECRET}
      MEERKAT_PERSONA_ADMIN_SECRET: ${MEERKAT_PERSONA_ADMIN_SECRET:?set MEERKAT_PERSONA_ADMIN_SECRET}
      HUMANITY_VERIFY_URL: http://humanity:8892
      MEERKAT_HUMANITY_ALLOW_INSECURE_HTTP: "1"
      HUMANITY_SERVICE_PUBLIC_KEY: ${HUMANITY_SERVICE_PUBLIC_KEY:?set HUMANITY_SERVICE_PUBLIC_KEY}
      MEERKAT_ALLOWED_ORIGINS: ${WEB_ORIGIN:?set WEB_ORIGIN}
      # Private Prometheus /metrics on the internal network only (not published).
      MEERKAT_METRICS_HOST: 0.0.0.0
      MEERKAT_METRICS_PORT: "9894"
    secrets:
      - source: postgres_ca
        target: postgres-ca.pem
    depends_on:
      humanity:
        condition: service_healthy
      hosted:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8894/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  push:
    <<: *platform
    command: ["./node_modules/.bin/tsx", "bin/meerkat-push-gateway.mjs"]
    environment:
      PORT: "8895"
      HOST: 0.0.0.0
      NODE_ENV: production
      MEERKAT_DEPLOYMENT_PROFILE: first-party
      MEERKAT_STORE_BACKEND: postgres
      MEERKAT_POSTGRES_URL: ${PUSH_DATABASE_URL:?set PUSH_DATABASE_URL for the meerkat_push role}
      MEERKAT_POSTGRES_SSL_MODE: verify-full
      MEERKAT_POSTGRES_SSL_CA_FILE: /run/secrets/postgres-ca.pem
      # Provider-token envelope cipher. The key files are MOUNTED SECRETS (never plain
      # env), matching the postgres-ca.pem convention. Rotation: add a higher-numbered
      # <version>.key into the mounted keyring and bump MEERKAT_PUSH_TOKEN_ACTIVE_VERSION;
      # tokens sealed under an older version keep decrypting. A managed KMS can replace
      # this cipher behind the same PushTokenCipher interface as founder-ops hardening.
      MEERKAT_PUSH_TOKEN_KEYS_DIR: /run/secrets/push-token-keys
      MEERKAT_PUSH_TOKEN_ACTIVE_VERSION: "${PUSH_TOKEN_ACTIVE_VERSION:?set PUSH_TOKEN_ACTIVE_VERSION to the active push token key version}"
      # APNs credentials (mounted .p8 signing key + metadata). A provider with no mounted
      # credential is honestly OFF; its wakes answer wake_unavailable.
      MEERKAT_PUSH_APNS_KEY_FILE: /run/secrets/push-apns-key
      MEERKAT_PUSH_APNS_KEY_ID: "${PUSH_APNS_KEY_ID:?set PUSH_APNS_KEY_ID}"
      MEERKAT_PUSH_APNS_TEAM_ID: "${PUSH_APNS_TEAM_ID:?set PUSH_APNS_TEAM_ID}"
      MEERKAT_PUSH_APNS_TOPIC: "${PUSH_APNS_TOPIC:?set PUSH_APNS_TOPIC to the app bundle id}"
      MEERKAT_PUSH_APNS_BASE_URL: "${PUSH_APNS_BASE_URL:-https://api.push.apple.com}"
      # FCM credentials (mounted service-account JSON).
      MEERKAT_PUSH_FCM_SERVICE_ACCOUNT_FILE: /run/secrets/push-fcm-service-account
      # Web Push VAPID credentials (mounted PEM private key + public key + contact subject).
      MEERKAT_PUSH_VAPID_PRIVATE_KEY_FILE: /run/secrets/push-vapid-private-key
      MEERKAT_PUSH_VAPID_PUBLIC_KEY: "${PUSH_VAPID_PUBLIC_KEY:?set PUSH_VAPID_PUBLIC_KEY}"
      MEERKAT_PUSH_VAPID_SUBJECT: "${PUSH_VAPID_SUBJECT:?set PUSH_VAPID_SUBJECT to a mailto or https contact}"
      MEERKAT_ALLOWED_ORIGINS: ${WEB_ORIGIN:?set WEB_ORIGIN}
      # Private Prometheus /metrics on the internal network only (not published).
      MEERKAT_METRICS_HOST: 0.0.0.0
      MEERKAT_METRICS_PORT: "9895"
    secrets:
      - source: postgres_ca
        target: postgres-ca.pem
      - source: push_apns_key
        target: push-apns-key
      - source: push_fcm_service_account
        target: push-fcm-service-account
      - source: push_vapid_private_key
        target: push-vapid-private-key
    volumes:
      # The token-cipher keyring is a DIRECTORY of <version>.key files, so it is a
      # read-only bind (Docker file secrets are single files). Rotation adds a new
      # numbered key file into this host directory and bumps PUSH_TOKEN_ACTIVE_VERSION.
      - ${PUSH_TOKEN_KEYS_DIR:?set PUSH_TOKEN_KEYS_DIR to the host push token keyring directory}:/run/secrets/push-token-keys:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8895/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Plan 51 verification-account service: the OUTER identity layer (Sign in with
  # Apple / Google, entitlement webhooks, blind credential issuance, SSO-re-auth
  # deletion). Persona-service lineage over the platform image; NEVER the slim
  # ws+zod relay image. THE WALL: it connects ONLY as the meerkat_account role
  # (account. + credential. schemas; the role grants deny persona/community/
  # moderation state) and its logs are deep-redacted (log-hygiene canary leg).
  # SSO providers and entitlement rails left blank are honestly OFF (503
  # not_configured); the service fails closed at boot without the session
  # secret, epoch key secret, database, or allowed origins.
  account:
    <<: *platform
    command: ["./node_modules/.bin/tsx", "bin/meerkat-account-service.mjs"]
    environment:
      PORT: "8896"
      HOST: 0.0.0.0
      NODE_ENV: production
      MEERKAT_DEPLOYMENT_PROFILE: first-party
      MEERKAT_STORE_BACKEND: postgres
      MEERKAT_POSTGRES_URL: ${ACCOUNT_DATABASE_URL:?set ACCOUNT_DATABASE_URL for the meerkat_account role}
      MEERKAT_POSTGRES_SSL_MODE: verify-full
      MEERKAT_POSTGRES_SSL_CA_FILE: /run/secrets/postgres-ca.pem
      MEERKAT_ACCOUNT_SESSION_SECRET: ${MEERKAT_ACCOUNT_SESSION_SECRET:?set MEERKAT_ACCOUNT_SESSION_SECRET}
      MEERKAT_ACCOUNT_EPOCH_KEY_SECRET: ${MEERKAT_ACCOUNT_EPOCH_KEY_SECRET:?set MEERKAT_ACCOUNT_EPOCH_KEY_SECRET}
      # Stable HMAC key for the deletion-subject tombstone hash (keeps the deletion
      # marker from being a membership oracle). MUST NOT change across deploys, or
      # existing tombstones stop matching and lose their anti-abuse block.
      MEERKAT_ACCOUNT_TOMBSTONE_SECRET: ${MEERKAT_ACCOUNT_TOMBSTONE_SECRET:?set MEERKAT_ACCOUNT_TOMBSTONE_SECRET}
      # SSO providers: comma-separated audience ids. Blank => that provider's
      # sign-in is honestly OFF (not_configured), never faked. Interpolation
      # names match the container names exactly so an operator setting the
      # documented MEERKAT_* variables gets them applied, not silently dropped.
      MEERKAT_APPLE_SERVICE_IDS: ${MEERKAT_APPLE_SERVICE_IDS:-}
      MEERKAT_GOOGLE_CLIENT_IDS: ${MEERKAT_GOOGLE_CLIENT_IDS:-}
      # Entitlement rails, each independent; blank => that webhook answers 503
      # not_configured. HONESTY GATE (see the bin): secrets alone do not turn a
      # rail on; the per-rail payload resolvers are founder-ops and until they
      # are wired every rail stays honestly OFF. The Apple ASSN root CA is a
      # multiline PEM: set ACCOUNT_ASSN_ROOT_CA_HOST_FILE to the host PEM (it
      # mounts as the assn_root_ca secret) and set
      # MEERKAT_ASSN_ROOT_CA_FILE=/run/secrets/assn-root-ca.pem; the bin fails
      # closed on an unreadable, empty, or non-certificate file.
      MEERKAT_ASSN_ROOT_CA_FILE: ${MEERKAT_ASSN_ROOT_CA_FILE:-}
      MEERKAT_PLAY_RTDN_AUDIENCE: ${MEERKAT_PLAY_RTDN_AUDIENCE:-}
      MEERKAT_STRIPE_WEBHOOK_SECRET: ${MEERKAT_STRIPE_WEBHOOK_SECRET:-}
      MEERKAT_ALLOWED_ORIGINS: ${WEB_ORIGIN:?set WEB_ORIGIN}
    secrets:
      - source: postgres_ca
        target: postgres-ca.pem
      - source: assn_root_ca
        target: assn-root-ca.pem
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8896/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  directory:
    <<: *platform
    command: ["./node_modules/.bin/tsx", "bin/meerkat-public-directory-node.mjs"]
    environment:
      PORT: "8891"
      MEERKAT_TRUST_PROXY_HOPS: "1"
      HOST: 0.0.0.0
      NODE_ENV: production
      MEERKAT_DEPLOYMENT_PROFILE: first-party
      MEERKAT_STORE_BACKEND: postgres
      MEERKAT_POSTGRES_URL: ${DIRECTORY_DATABASE_URL:?set DIRECTORY_DATABASE_URL for the meerkat_directory role}
      MEERKAT_POSTGRES_SSL_CA_FILE: /run/secrets/postgres-ca.pem
      MEERKAT_DIRECTORY_ANNOUNCER_HMAC_KEY: ${MEERKAT_DIRECTORY_ANNOUNCER_HMAC_KEY:?set a shared 64-hex directory HMAC key}
      TRUST_AND_SAFETY_AUTHORITY_DEVICE_ID: ${TRUST_AND_SAFETY_AUTHORITY_DEVICE_ID:?set TRUST_AND_SAFETY_AUTHORITY_DEVICE_ID}
      # Private Prometheus /metrics on the internal network only (not published).
      MEERKAT_METRICS_HOST: 0.0.0.0
      MEERKAT_METRICS_PORT: "9891"
    secrets:
      - source: postgres_ca
        target: postgres-ca.pem
    healthcheck:
      # Plan 44 WP-4A: gate on honest dependency readiness, not bounded liveness.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8891/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  community:
    <<: *platform
    command: ["./node_modules/.bin/tsx", "bin/meerkat-community-node.mjs"]
    environment:
      PORT: "8890"
      MEERKAT_TRUST_PROXY_HOPS: "1"
      HOST: 0.0.0.0
      DATA_DIR: /data/community
      NODE_ENV: production
      MEERKAT_DEPLOYMENT_PROFILE: first-party
      MEERKAT_STORE_BACKEND: postgres
      MEERKAT_POSTGRES_URL: ${COMMUNITY_DATABASE_URL:?set COMMUNITY_DATABASE_URL for the meerkat_community role}
      MEERKAT_MODERATION_POSTGRES_URL: ${COMMUNITY_MODERATION_DATABASE_URL:?set COMMUNITY_MODERATION_DATABASE_URL for the meerkat_moderation role}
      MEERKAT_ARCHIVE_POSTGRES_URL: ${ARCHIVE_INTAKE_DATABASE_URL:?set ARCHIVE_INTAKE_DATABASE_URL for the meerkat_archive_intake role}
      MEERKAT_POSTGRES_SSL_MODE: verify-full
      MEERKAT_POSTGRES_SSL_CA_FILE: /run/secrets/postgres-ca.pem
      HUMANITY_VERIFY_URL: http://humanity:8892
      MEERKAT_HUMANITY_ALLOW_INSECURE_HTTP: "1"
      MEERKAT_HUMANITY_REQUIRED: "1"
      SESSION_VERIFY_URL: http://persona:8894
      MEERKAT_APP_UNLOCK_TOKEN_SECRET: ${MEERKAT_APP_UNLOCK_TOKEN_SECRET:?set MEERKAT_APP_UNLOCK_TOKEN_SECRET}
      MEERKAT_OPERATOR_AUTHORITY_SEED: ${MEERKAT_OPERATOR_AUTHORITY_SEED:?set MEERKAT_OPERATOR_AUTHORITY_SEED}
      TRUST_AND_SAFETY_AUTHORITY_DEVICE_ID: ${TRUST_AND_SAFETY_AUTHORITY_DEVICE_ID:?set TRUST_AND_SAFETY_AUTHORITY_DEVICE_ID}
      MEERKAT_OPERATOR_CONSOLE_SECRET: ${MEERKAT_OPERATOR_CONSOLE_SECRET:?set MEERKAT_OPERATOR_CONSOLE_SECRET}
      MEERKAT_PERSONA_ADMIN_SECRET: ${MEERKAT_PERSONA_ADMIN_SECRET:?set MEERKAT_PERSONA_ADMIN_SECRET}
      PERSONA_ADMIN_URL: http://persona:8894
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: "8891"
      COMMONS_PROVISION_FILE: /run/config/commons-provision.json
      MEERKAT_ABUSE_HASH_FILE: /run/config/abuse-hashes.txt
      MEERKAT_ALLOWED_ORIGINS: ${WEB_ORIGIN:?set WEB_ORIGIN}
      MEERKAT_HOSTED_ENTITLEMENT_REQUIRED: "1"
      ENTITLEMENT_SECRET: ${ENTITLEMENT_SECRET:?set ENTITLEMENT_SECRET}
      MEERKAT_ARCHIVE_HOST_ID: ${MEERKAT_ARCHIVE_HOST_ID:?set the stable managed archive host id}
      MEERKAT_ARCHIVE_TENANT_CAP_BYTES: ${MEERKAT_ARCHIVE_TENANT_CAP_BYTES:?set the managed archive per-owner byte cap}
      MEERKAT_OBJECT_STORE_BACKEND: s3
      MEERKAT_OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:?set OBJECT_STORE_ENDPOINT}
      MEERKAT_OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:?set OBJECT_STORE_REGION}
      MEERKAT_OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:?set OBJECT_STORE_BUCKET}
      MEERKAT_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/object-store-access-key
      MEERKAT_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/object-store-secret-key
      # First-party startup validates every registered-agent field and refuses placeholders.
      MEERKAT_DMCA_AGENT_NAME: ${MEERKAT_DMCA_AGENT_NAME:?set the registered DMCA agent name}
      MEERKAT_DMCA_AGENT_ORG: ${MEERKAT_DMCA_AGENT_ORG:?set the registered DMCA agent organization}
      MEERKAT_DMCA_AGENT_ADDRESS: ${MEERKAT_DMCA_AGENT_ADDRESS:?set the registered DMCA agent address}
      MEERKAT_DMCA_AGENT_EMAIL: ${MEERKAT_DMCA_AGENT_EMAIL:?set the registered DMCA agent email}
      MEERKAT_DMCA_AGENT_PHONE: ${MEERKAT_DMCA_AGENT_PHONE:?set the registered DMCA agent phone}
      MEERKAT_DMCA_AGENT_REGISTRATION_DATE: ${MEERKAT_DMCA_AGENT_REGISTRATION_DATE:?set the registration date YYYY-MM-DD}
      NOTIFY_RELAY_URL: wss://${RELAY_DOMAIN:?set RELAY_DOMAIN}
      ANNOUNCE_RELAY_URL: wss://${RELAY_DOMAIN:?set RELAY_DOMAIN}
      PUBLIC_BASE_URL: https://${COMMUNITY_DOMAIN:?set COMMUNITY_DOMAIN}
      ANNOUNCE_COMMUNITY_IDS: ${COMMONS_PUBLICATION_IDS:?set COMMONS_PUBLICATION_IDS}
      # Private Prometheus /metrics on the internal network only (not published). Kept
      # distinct from the loopback ADMIN_PORT (operator console) above.
      MEERKAT_METRICS_HOST: 0.0.0.0
      MEERKAT_METRICS_PORT: "9890"
      # Plan 25 WP-25I: managed room-token mount. The community-node bin wires
      # options.roomToken into startCommunityNodeHttp with a membership verifier backed by
      # the node's real signed roster (createCommunityRoomMembershipVerifier over the
      # private-state store), the admission-generation store, and the LiveKit minter. The
      # mount activates ONLY when all three vars below are set; absent any, /api/rooms/*
      # routes 404 and no token is ever minted (honest off, stated in the ready log). The
      # room-name server secret HMACs opaque LiveKit room names per admission generation,
      # so a moderation revoke renames the room and stale tokens cannot rejoin (NC-25.6).
      MEERKAT_ROOM_LIVEKIT_URL: http://livekit:7880
      MEERKAT_ROOM_LIVEKIT_API_KEY: ${MEERKAT_ROOM_LIVEKIT_API_KEY:?set MEERKAT_ROOM_LIVEKIT_API_KEY}
      MEERKAT_ROOM_LIVEKIT_API_SECRET: ${MEERKAT_ROOM_LIVEKIT_API_SECRET:?set MEERKAT_ROOM_LIVEKIT_API_SECRET}
      MEERKAT_ROOM_NAME_SERVER_SECRET: ${MEERKAT_ROOM_NAME_SERVER_SECRET:?set a 64-hex room-name server secret}
    secrets:
      - source: postgres_ca
        target: postgres-ca.pem
      - source: object_store_access_key
        target: object-store-access-key
      - source: object_store_secret_key
        target: object-store-secret-key
    volumes:
      - community_data:/data/community
      - ${COMMONS_PROVISION_FILE:?set COMMONS_PROVISION_FILE}:/run/config/commons-provision.json:ro
      - ${ABUSE_HASH_FILE:?set ABUSE_HASH_FILE}:/run/config/abuse-hashes.txt:ro
    depends_on:
      humanity:
        condition: service_healthy
      persona:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8890/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Plan 43 managed archive safety plane. The public edge does not start until all three workers
  # are live. Scanner and filing startup additionally prove their external safety dependencies.
  clamav:
    image: clamav/clamav:1.5.3
    restart: unless-stopped
    volumes:
      - clamav_signatures:/var/lib/clamav
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  archive-scanner:
    <<: *platform
    command: ["./node_modules/.bin/tsx", "bin/meerkat-archive-scanner.mjs"]
    environment:
      NODE_ENV: production
      MEERKAT_DEPLOYMENT_PROFILE: first-party
      MEERKAT_STORE_BACKEND: postgres
      MEERKAT_POSTGRES_URL: ${ARCHIVE_SCANNER_DATABASE_URL:?set ARCHIVE_SCANNER_DATABASE_URL for the meerkat_archive role}
      MEERKAT_POSTGRES_SSL_MODE: verify-full
      MEERKAT_POSTGRES_SSL_CA_FILE: /run/secrets/postgres-ca.pem
      MEERKAT_OBJECT_STORE_BACKEND: s3
      MEERKAT_OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:?set OBJECT_STORE_ENDPOINT}
      MEERKAT_OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:?set OBJECT_STORE_REGION}
      MEERKAT_OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:?set OBJECT_STORE_BUCKET}
      MEERKAT_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/object-store-access-key
      MEERKAT_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/object-store-secret-key
      MEERKAT_ARCHIVE_ABUSE_HASH_FILE: /run/config/abuse-hashes.txt
      MEERKAT_ARCHIVE_CLAMD_HOST: clamav
      MEERKAT_ARCHIVE_CLAMD_PORT: "3310"
      MEERKAT_ARCHIVE_MALWARE_VERSION: "1.5.3"
      MEERKAT_ARCHIVE_MALWARE_DEFINITIONS: ${CLAMAV_DEFINITIONS_VERSION:?set the deployed ClamAV signature version}
      MEERKAT_METRICS_HOST: 0.0.0.0
      MEERKAT_METRICS_PORT: "9896"
    secrets:
      - source: postgres_ca
        target: postgres-ca.pem
      - source: object_store_access_key
        target: object-store-access-key
      - source: object_store_secret_key
        target: object-store-secret-key
    volumes:
      - ${ABUSE_HASH_FILE:?set ABUSE_HASH_FILE}:/run/config/abuse-hashes.txt:ro
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9896/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  archive-seeder:
    <<: *platform
    command: ["./node_modules/.bin/tsx", "bin/meerkat-archive-seeder.mjs"]
    environment:
      NODE_ENV: production
      MEERKAT_DEPLOYMENT_PROFILE: first-party
      MEERKAT_STORE_BACKEND: postgres
      MEERKAT_POSTGRES_URL: ${ARCHIVE_SEEDER_DATABASE_URL:?set ARCHIVE_SEEDER_DATABASE_URL for the meerkat_archive_seeder role}
      MEERKAT_POSTGRES_SSL_MODE: verify-full
      MEERKAT_POSTGRES_SSL_CA_FILE: /run/secrets/postgres-ca.pem
      MEERKAT_OBJECT_STORE_BACKEND: s3
      MEERKAT_OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:?set OBJECT_STORE_ENDPOINT}
      MEERKAT_OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:?set OBJECT_STORE_REGION}
      MEERKAT_OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:?set OBJECT_STORE_BUCKET}
      MEERKAT_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/object-store-access-key
      MEERKAT_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/object-store-secret-key
      MEERKAT_ARCHIVE_HOST_ID: ${MEERKAT_ARCHIVE_HOST_ID:?set the stable managed archive host id}
      MEERKAT_METRICS_HOST: 0.0.0.0
      MEERKAT_METRICS_PORT: "9897"
    secrets:
      - source: postgres_ca
        target: postgres-ca.pem
      - source: object_store_access_key
        target: object-store-access-key
      - source: object_store_secret_key
        target: object-store-secret-key
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9897/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  ncmec-filer:
    <<: *platform
    command: ["./node_modules/.bin/tsx", "bin/meerkat-ncmec-filing-worker.mjs"]
    environment:
      NODE_ENV: production
      MEERKAT_DEPLOYMENT_PROFILE: first-party
      MEERKAT_STORE_BACKEND: postgres
      MEERKAT_MODERATION_POSTGRES_URL: ${COMMUNITY_MODERATION_DATABASE_URL:?set COMMUNITY_MODERATION_DATABASE_URL for the meerkat_moderation role}
      MEERKAT_POSTGRES_SSL_MODE: verify-full
      MEERKAT_POSTGRES_SSL_CA_FILE: /run/secrets/postgres-ca.pem
      MEERKAT_NCMEC_FILING_ENDPOINT: ${NCMEC_FILING_ENDPOINT:?set the HTTPS CyberTipline filing gateway}
      MEERKAT_NCMEC_FILING_API_TOKEN_FILE: /run/secrets/ncmec-filing-api-token
      MEERKAT_METRICS_HOST: 0.0.0.0
      MEERKAT_METRICS_PORT: "9898"
    secrets:
      - source: postgres_ca
        target: postgres-ca.pem
      - source: ncmec_filing_api_token
        target: ncmec-filing-api-token
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9898/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Plan 25 WP-25I: self-hosted community-room SFU. Redis backs LiveKit distributed
  # mode so multiple SFU replicas share room state; Egress records only when a
  # moderator starts a real job. LiveKit terminates DTLS-SRTP at the SFU (room-server
  # transit) unless every client activates E2EE. The SFU only ever sees the opaque
  # ephemeral room + participant ids the room-token service mints, never a Meerkat
  # device key, persona, community title, or display name (NC-25.3).
  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  livekit:
    image: livekit/livekit-server:v1.8.4
    restart: unless-stopped
    command: ["--config", "/etc/livekit/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${MEERKAT_ROOM_LIVEKIT_API_KEY:?set MEERKAT_ROOM_LIVEKIT_API_KEY}: ${MEERKAT_ROOM_LIVEKIT_API_SECRET:?set MEERKAT_ROOM_LIVEKIT_API_SECRET}"
      LIVEKIT_REDIS_HOST: redis:6379
    ports:
      # RTC UDP/TCP media must reach clients directly; signaling (7880) stays behind
      # the edge over TLS. The UDP mux port carries encrypted SRTP only.
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.production.yaml:/etc/livekit/livekit.yaml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge
      - private
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "livekit-server", "--config", "/etc/livekit/livekit.yaml", "--check-health"]
      interval: 15s
      timeout: 5s
      retries: 3

  egress:
    image: livekit/egress:v1.8.4
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_FILE: /etc/livekit/egress.yaml
    volumes:
      - ./egress.production.yaml:/etc/livekit/egress.yaml:ro
    security_opt:
      - no-new-privileges:true
    # Egress uses Chrome for composite recording and needs SYS_ADMIN for its sandbox.
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    networks:
      - private
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy

networks:
  edge:
  private:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  hosted_data:
  community_data:
  clamav_signatures:

secrets:
  postgres_ca:
    file: ${POSTGRES_CA_FILE:?set POSTGRES_CA_FILE}
  object_store_access_key:
    file: ${OBJECT_STORE_ACCESS_KEY_FILE:?set OBJECT_STORE_ACCESS_KEY_FILE to the hosted object-store access key id file}
  object_store_secret_key:
    file: ${OBJECT_STORE_SECRET_KEY_FILE:?set OBJECT_STORE_SECRET_KEY_FILE to the hosted object-store secret access key file}
  push_apns_key:
    file: ${PUSH_APNS_KEY_FILE:?set PUSH_APNS_KEY_FILE to the APNs .p8 signing key file}
  push_fcm_service_account:
    file: ${PUSH_FCM_SERVICE_ACCOUNT_FILE:?set PUSH_FCM_SERVICE_ACCOUNT_FILE to the FCM service-account JSON file}
  push_vapid_private_key:
    file: ${PUSH_VAPID_PRIVATE_KEY_FILE:?set PUSH_VAPID_PRIVATE_KEY_FILE to the Web Push VAPID private key PEM file}
  storage_operator_key:
    file: ${STORAGE_OPERATOR_KEY_FILE:?set STORAGE_OPERATOR_KEY_FILE to the storage descriptor signing key file}
  oauth_kms_key:
    file: ${OAUTH_KMS_KEY_FILE:?set OAUTH_KMS_KEY_FILE to the mounted OAuth envelope key file}
  oauth_google_client_secret:
    file: ${OAUTH_GOOGLE_CLIENT_SECRET_FILE:?set OAUTH_GOOGLE_CLIENT_SECRET_FILE}
  oauth_dropbox_client_secret:
    file: ${OAUTH_DROPBOX_CLIENT_SECRET_FILE:?set OAUTH_DROPBOX_CLIENT_SECRET_FILE}
  oauth_onedrive_client_secret:
    file: ${OAUTH_ONEDRIVE_CLIENT_SECRET_FILE:?set OAUTH_ONEDRIVE_CLIENT_SECRET_FILE}
  oauth_box_client_secret:
    file: ${OAUTH_BOX_CLIENT_SECRET_FILE:?set OAUTH_BOX_CLIENT_SECRET_FILE}
  ncmec_filing_api_token:
    file: ${NCMEC_FILING_API_TOKEN_FILE:?set NCMEC_FILING_API_TOKEN_FILE}
  # Apple ASSN root CA PEM (public material, mounted-file convention because a
  # multiline PEM cannot ride dotenv interpolation). Defaults to /dev/null so
  # deploys without the Apple rail need no placeholder file; enabling the rail
  # means BOTH pointing this at the real PEM on the host AND setting
  # ACCOUNT_ASSN_ROOT_CA_FILE=/run/secrets/assn-root-ca.pem (the bin fails
  # closed on an empty or non-certificate file).
  assn_root_ca:
    file: ${ACCOUNT_ASSN_ROOT_CA_HOST_FILE:-/dev/null}
