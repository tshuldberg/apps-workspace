# Render.com deploy template for a Meerkat relay (alternative to Fly).
#
# Render serves TLS at its edge and proxies WebSocket connections to the service
# port, so the relay speaks plain ws behind it. The relay is stateless: no disk,
# no env secret. It reads only PORT (Render injects PORT) and HOST.
#
# Deploy by connecting this repo in the Render dashboard; the blueprint below is
# the service shape. Region, custom domain, and TLS are founder ops tied to your
# Render account (see docs/designs/meerkat-relay-fleet-runbook.md).

services:
  - type: web
    name: meerkat-relay
    runtime: docker
    dockerfilePath: ./packages/meerkat-relay/Dockerfile
    dockerContext: ./packages/meerkat-relay
    plan: starter
    # Render injects PORT; the relay reads it. HOST binds all interfaces.
    envVars:
      - key: HOST
        value: 0.0.0.0
      # 24h store-and-forward window (clamp max). The relay default is 5 minutes,
      # which drops overnight hand-offs. Kept in sync with the root render.yaml.
      - key: RELAY_MAILBOX_TTL_MS
        value: "86400000"
    # Readiness/liveness probe: the same GET /healthz the relay selector uses.
    healthCheckPath: /healthz
    # No disk: the relay persists nothing beyond in-memory TTL state.
    autoDeploy: false
