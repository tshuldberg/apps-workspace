// UNVERIFIED - pending dev build (Plan 42 WP-42C authors the real native bodies).
//
// Gradle build for the owned Meerkat native transport Android module. Declares
// the Kotlin/Expo module so autolinking compiles the sources into the app. The
// Kotlin bodies are SCAFFOLDING until WP-42C; nothing here proves a working
// transport.

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.mylife.meerkat.nativetransport'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
if (expoModulesCorePlugin.exists()) {
  apply from: expoModulesCorePlugin
  applyKotlinExpoModulesCorePlugin()
}

android {
  namespace 'com.mylife.meerkat.nativetransport'
  compileSdkVersion safeExtGet('compileSdkVersion', 35)

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 24)
    targetSdkVersion safeExtGet('targetSdkVersion', 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation project(':expo-modules-core')
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
