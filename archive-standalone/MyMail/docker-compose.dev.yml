###############################################################################
# MyMail - Development Overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
###############################################################################

services:
  caddy:
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:80"    # webmail on localhost:8080
      - "8443:443"

  stalwart:
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "4190:4190"
      - "8081:8080"  # JMAP API exposed for debugging
    environment:
      - STALWART_LOG_LEVEL=debug

  rspamd:
    ports:
      - "11334:11334"  # Rspamd web UI for debugging

  redis:
    ports:
      - "6379:6379"    # Redis CLI access

  roundcube:
    environment:
      - ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE=50M

  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"    # Admin UI exposed directly
    environment:
      - NODE_ENV=development
    volumes:
      - ./admin-ui/src:/app/src  # hot-reload source
