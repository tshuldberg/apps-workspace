###############################################################################
# MyMail - CI Pipeline
# Validates Docker builds, lints the admin UI, and checks shell scripts.
###############################################################################

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint the SvelteKit admin UI (TypeScript / Svelte) ────────────────
  lint-admin-ui:
    name: Lint Admin UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Svelte check (type checking)
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Build admin UI
        run: npm run build

  # ── Validate shell scripts with ShellCheck ──────────────────────────
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck on scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
          severity: warning

  # ── Build all Docker Compose services ───────────────────────────────
  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file for build
        run: |
          cp .env.example .env

      - name: Build Docker Compose services
        run: docker compose build

  # ── Validate Docker Compose configuration ───────────────────────────
  compose-config:
    name: Validate Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cp .env.example .env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Validate docker-compose.dev.yml
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
